  - case: esbg-newcomer-krast                # topic: jesus-death · newcomer
    q_en: "I do not understand why someone had to die for my sins to be forgiven. Why did God not just forgive?"
    top_score: 0.746
    credits:
      - {rank: 3, score: 0.730, en: "The crucifixion of Jesus — why did Jesus die? — 'this is what the crucifixion, death and resurrection of Jesus Christ meant'. A DEDICATED atonement article, 14.1k chars."}
    the_finding: |
      🟢 THIS IS THE CONTROL CASE FOR THE RUSSIAN GAP, AND IT COMES OUT THE OTHER WAY.
      `everystudent-ru`'s equivalent case (esru-newcomer-krest) credits two documents and
      neither reliably retrieves, because Russian has NO article whose subject is the
      atonement. Bulgarian HAS one, and it retrieves at rank 3 (rank 1 at 0.777 before the
      reword). So the Russian result is a CONTENT gap in that source, not a universal defect
      of the estate or of the embedder. Worth stating plainly because the Russian case was
      written into the keys as an expected miss.
    reworded: |
      v1: "…Каква е била нуждата Исус да умре на кръст?" → top 0.777 🔴 SMELL: it restated
      the article's own title ("Why did Jesus die?"). v2 reframes it around forgiveness and
      the asker's own sin. Result 0.777 → 0.746, target moved rank 1 → rank 3 but stayed in.
    rejected:
      - {rank: 1, score: 0.746, en: "God's help in hard times — RANK 1 AND REJECTED, a boilerplate tail match"}
      - {rank: 2, score: 0.740, en: "5 world religions — tail match"}

