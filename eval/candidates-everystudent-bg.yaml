# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ TWO HAZARDS SPECIFIC TO THIS SOURCE — read before editing the keys
# ─────────────────────────────────────────────────────────────────────────────
# 1. PERCENT-ENCODED CYRILLIC PATHS. everystudent-bg's canonical URLs are
#    Cyrillic, so their pathnames are 150–250 character %D0%B2%D1%8A… strings.
#    `eval-metrics.ts` matches on `new URL(url).pathname`, i.e. the ENCODED form,
#    so that is what must go in `relevant`. Hand-typing them is a transcription-
#    error factory: the draft and the write both resolved paths FROM TITLES via
#    the database instead. Decoded paths are in the comments below for humans.
#    This is the first campaign source with this shape — `zh-cn` and `ru` both
#    use plain ASCII paths.
#
# 2. ONE TITLE IS DUPLICATED IN THIS SOURCE. `Исус Бог ли е?` ("Is Jesus God?")
#    exists at TWO different paths (/да-познаваме-Бог/… and /други-въпроси/…).
#    A title→path map silently keeps one and drops the other. Neither is
#    credited here, so nothing is affected — but any future title-keyed tooling
#    on this source must dedupe first.

cases:

  - case: esbg-skeptic-izmislitsa            # topic: god-exists · skeptic
    q_en: "My friends think faith in God is a fiction for people who can't cope on their own. Is there anything serious behind it?"
    top_score: 0.742
    credits:
      - {rank: 1, score: 0.742, en: "Why does a rational person believe in God? — a former atheist explains the reasoning that led him to God. Answers the crutch objection head-on."}
      - {rank: 2, score: 0.707, en: "How agnostics can find out whether God exists"}
      - {rank: 3, score: 0.705, en: "How an atheist found God — Marilyn Adamson's testimony, built on five objective reasons rather than feelings"}
    dropped_after_engine_check:
      - en: "Is there a God? Six candid reasons (Marilyn Adamson)"
        why: >
          The source's flagship apologetics article — and it did NOT retrieve in the top 10 for
          this question. On reading, that is correct rather than broken: the question is about
          faith being a CRUTCH, and the three credited documents answer exactly that, while
          'Is there a God?' answers the different question of what evidence exists. Dropped
          rather than credited-and-missed.

  - case: esbg-newcomer-lichnost             # topic: know-god · newcomer
    q_en: "When I hear 'God' I picture some impersonal force somewhere far away. Is he even a person?"
    top_score: 0.732
    credits:
      - {rank: 1, score: 0.732, en: "In search of the ideal God — the qualities the Bible reveals; '#2: he can be known personally'"}
      - {rank: 2, score: 0.685, en: "Why can we rely on God? — 🔴 TITLE TRAP: the title asks about reliance, the body opens 'What is God like? SIX PERSONAL TRAITS of God'. This is the know-god article, and a title-based reviewer would file it under trust."}
      - {rank: 3, score: 0.682, en: "How God revealed himself — the Eternal Someone"}
      - {rank: 5, score: 0.654, en: "Is God invisible? — the flatland analogy; answers 'a force somewhere far away' directly"}

  - case: esbg-skeptic-katastrofa            # topic: suffering · skeptic
    q_en: "I lost a friend in a crash last year. Since then I cannot work out how that squares with the idea of a loving God."
    top_score: 0.707
    credits:
      - {rank: 2, score: 0.672, en: "Why is there suffering? — 'If there is a God and he is good, why is there suffering?' Terror attacks, sex slavery, racism, world hunger."}
      - {rank: 3, score: 0.662, en: "Where is God in hard times?"}
      - {rank: 6, score: 0.648, en: "Why worship a God who allows terrible things to happen? — framed around a child being raped"}
      - {rank: "NOT IN TOP 10", en: "Is God good? — a 1.3k video transcript: 'If he is, why is there suffering and evil?' KEPT DELIBERATELY, see below"}
    reworded_and_the_cost: |
      ⚠️ REWORDED AFTER ROUND 1 (guardrail #8 §2), and the reword COST a credit.
      v1: "…Никой не може да ми обясни защо един добър Бог допуска това."
          ("nobody can explain why a good God allows that") → top 0.752 🔴 SMELL —
          it restated the article's own opening line.
      v2 (kept): reframed as the asker's unresolved private difficulty → top 0.707,
          smell gone. But `Добър ли е Бог?` fell out of the top 10.

      I kept BOTH the honest reword and the credit. Guardrail #8 §2: "Keep the
      honest phrasing and let the eval record the gap — a case that always passes
      measures nothing." This case will score coverage 3/4, on purpose.
      `Добър ли е Бог?` is the Bulgarian twin of the Spanish /articulos/bueno.html
      and the Chinese /a/isgodgood.html, which was rank 1 for the Chinese version
      of this question in Part A. Crediting it is consistent across all three.

  - case: esbg-seeker-nishto-ne-ostava       # topic: purpose · seeker
