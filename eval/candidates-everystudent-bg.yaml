    note: |
      ⓘ The top hit at 0.750 is `Исус и ислямът` ("Jesus and Islam"), NOT a credited document.
      The score sits exactly on the smell line but the question is not restating that article —
      it is the *tahrif* (scripture-corruption) overlap already recorded for `zh` and `kk` in
      §0.7. The credited target sits comfortably below at 0.729. Left as is.

