# because all ten §0.7 topics are genuinely answerable from this source and the §0.7
# persona split (skeptic 4 · newcomer 3 · seeker 2 · believer 1) is defined at n=10.
# Dropping one topic would have broken the split to buy nothing. If the operator wants
# 9, drop `escs-seeker-uzkost` (anxiety) — it is the thinnest topic here, one document.
#
# Questions authored IN CZECH, not translated from the English §0.7 menu (§0.6).
#
# CORPUS SHAPE — read this before judging any hit
#   74 documents, all under one flat path family: `/in/<id>/<ascii_slug>`. There is NO
#   `/a/` vs `/story/` split like `hu`, so the URL tells you nothing about what a page is.
#   ⚠️ 17 of the 74 (23%) are a NEW-BELIEVER / DISCIPLESHIP shelf, not seeker apologetics:
