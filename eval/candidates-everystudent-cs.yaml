#   That shelf is why this source, alone among `ru` `bg` `hu`, can credit TWO documents to
#   the prayer case instead of one. It is also why three of its title traps are there.
#   Null-language documents: 0 of 74 (guardrail #3a — nothing excluded).
#   Duplicate titles: 0 (the hazard that bit `bg` does not exist here).
#
# DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-cs cs
#   → 49 distinct candidate documents of 74, all ten topics covered.
# All 74 documents were then read from the database (title + opening ~900 chars) before
# anything was credited — guardrail #5, and specifically because of the boilerplate-tail
# trap recorded in §0.9. On this source judging by title would have been wrong EIGHT
# times; the full list is in the SUMMARY.
