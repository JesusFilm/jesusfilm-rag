      - {path: "/in/62/jaky_je_buh", rank: 4, score: 0.603, en: "What is God like? (4.3k) — 'Who is God? What is he like? SIX PERSONAL ATTRIBUTES of God: God is knowable. God is approachable…' The Czech twin of the Russian /a/ktoeto.html, the Hungarian /a/milyen.html and the Bulgarian 'Защо можем да разчитаме на Бог?'. It is the canonical answer and the engine ranks it FOURTH — see the reword note."}
