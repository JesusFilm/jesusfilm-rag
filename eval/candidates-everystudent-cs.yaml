# ENGINE-CHECKED FIVE TIMES (guardrail #8 §2) — .tmp-diag/phase5-cs-check.ts
#   Round 1: 0 paraphrase smells · 4 credits not returned · 33 credits
#   Round 2: 0 paraphrase smells · 2 credits not returned · 33 credits
#   Round 3: 0 paraphrase smells · 1 credit  not returned · 32 credits
#   Round 4: 0 smells but the anxiety case COLLAPSED to top 0.504 — reverted
#   Round 5: 0 smells but the anxiety case collapsed again to top 0.526 — reverted
