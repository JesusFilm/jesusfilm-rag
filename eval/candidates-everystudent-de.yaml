# Phase 5 PART B — golden suite DRAFT for `everystudent-de` (45 documents, duentscheidest.com).
# Campaign #111, batch 2. Working record — NOTHING here has been written to
# eval/qa-golden.yaml. Guardrail #4 gates that on an explicit operator approval turn.
#
# Sizing: 45 ÷ 8 = 5.6 → 5 cases.
# Personas: skeptic 2 · newcomer 1 · seeker 1 · believer 1 — matches the §0.7 n=5 row exactly.
# Questions authored IN GERMAN, not translated from the English topic menu (§0.6).
#
# ══ CORPUS SHAPE — read this before judging any hit ══════════════════════════
#   45 documents, ALL under `/artikel/`. There is no `/story/` directory on this source.
#   🔴 A PATH-BASED TESTIMONY COUNT READS 0% HERE AND IS WRONG. §0.12 says tail severity
#   "tracks the testimony share", measured on `hu` as 24% `/story/`. German files its
#   personal accounts as ordinary articles: `/artikel/hoffnung.html` (Steve Sawyer, AIDS,
#   21.2k), `/artikel/atheistin.html` (Marilyn Adamson's own conversion), `/artikel/
#   lebensveranderung.html` (Josh McDowell), `/artikel/schonheit.html` (a fashion model),
#   `/artikel/neunzehn.html` (a former stripper/prostitute), `/artikel/heilung.html`
#   (Rachel Fatyanov), `/artikel/liebeoderbegierde.html` (Duncan Moore) and
#   `/artikel/echtesleben.html` (three first-person accounts) — 8 of 45 ≈ 18% by CONTENT.
#   So `de` is a `hu`-class source that a path count would score as a `pt`-class one.
#   ⚠️ Whoever computes testimony share for the estate must count content, not paths.
#
#   Hazards (from .tmp-diag/phase5-openings.ts, run first):
#     ✅ every path resolves to exactly one document
#     ✅ no null-language documents (45/45 lang=de) — guardrail #3a, nothing excluded
#     ✅ no duplicate titles (the hazard that bit `bg`)
#     ✅ no document under 1,200 chars — ZERO pure-tail documents (failure mode #2)
#   Shortest documents, both read in full and both real content, not tails:
#     `/artikel/Gottgut.html` 1,604 ch / 1 chunk — a free-will theodicy video transcript
#       (the square-circle argument), the twin of `hu` `/a/jo.html`.
#     `/artikel/collins.html` 2,252 ch / 2 chunks — Francis Collins on the 15 fine-tuned
#       cosmological constants. Neither is credited; see the drop note on case 1.
#
# ══ DISCOVERY ════════════════════════════════════════════════════════════════
#   .tmp-diag/phase5-partb-discover.ts everystudent-de de
#   → 42 distinct candidate documents of 45, ALL TEN TOPICS COVERED.
#   ⚠️ This contradicts the Phase-4 smoke, which returned only 1 `de` hit above the 0.37
#   minScore. The pool is not thin; the smoke was one query against a small subcorpus.
#   Every one of the 45 documents was then read from the database (title + character
#   length + opening ~900 chars, and six of them at 2,400 chars) before anything was
#   credited — guardrail #5.
#
# ══ WHICH TOPICS, AND WHY THE OTHER FIVE ARE NOT HERE ════════════════════════
#   🔴 NOTHING WAS DROPPED FOR LACK OF CONTENT. `everystudent-de` genuinely carries all
#   ten §0.7 topics. Five cases is a QUOTA (45 ÷ 8), not a content gap, and the operator
#   should read it that way. The five kept were chosen on two grounds:
#     (a) the §0.7 persona row for n=5 (skeptic 2 · newcomer 1 · seeker 1 · believer 1)
#         allows only two of the four skeptic topics and one of the three newcomer ones;
#     (b) CLUSTER DISTINCTNESS. The discovery report's own "surfaced by more than one
#         topic" section shows `suffering` and `anxiety` sharing most of their pool
#         (`leid` `angst` `staune` `frieden`). Running both would measure the same shelf
#         twice in a five-case suite, so `anxiety` was kept and `suffering` dropped.
#         Confirmed after the fact: `/artikel/leid.html` and `/artikel/staune.html`, the
#         two documents `suffering` would have credited, both appear in case 4's top 10.
#
#   The five NOT drafted, with the document each would credit, so the suite can be
#   extended later without repeating discovery:
#     `know-god`    → `/artikel/werist.html` (Wer oder was ist Gott? — six traits, 0.594)
#                     + `/artikel/beziehung-zu-Gott.html`. This is the §0.7-confirmed
#                     landing document for know-god variant B. ADD THIS FIRST.
#     `suffering`   → `/artikel/leid.html` 0.603 · `/artikel/staune.html` 0.587
#                     · `/artikel/Gottgut.html` 0.585 · `/artikel/Gottanbeten.html` 0.575
#                     (four credits — the richest dropped topic).
#     `trinity`     → `/artikel/dreieinigkeit.html` 0.699 + `/artikel/hgeist.html`.
#     `purpose`     → `/artikel/echtesleben.html` 0.574 + `/artikel/lebensveranderung.html`
#                     + `/artikel/philosophie.html`.
#     `bible-trust` → `/artikel/bibel.html` 0.654 (25.7k, "Wer hat die Bibel geschrieben?").
#                     ⓘ ONE credit only, and that is the finding: `de` has NO Islam article,
#                     so the tahrif route recorded for `ja`/`zh`/`bg` in §0.12 does not exist
#                     here. German patterns with `cs` and `fa` (no Islam article at all) and
#                     answers bible-trust head-on with a standalone transmission piece.
#
# ══ ENGINE-CHECKED TWICE — .tmp-diag/phase5-check.ts de de ═══════════════════
#   Round 1: 0 paraphrase smells (max top score 0.708) · 2 credits not in top 10 · 13 credits
#   Round 2: 0 paraphrase smells (max top score 0.705) · 1 credit not in top 10 · 11 credits
#            — and that one is a DELIBERATE keep, see `wunschdenken` below.
#   Per-case round-2 top scores: 0.701 · 0.668 · 0.669 · 0.705 · 0.672.
#   ⓘ REACH, NOT SMELL, WAS THE ONLY CONSTRAINT ON THIS SOURCE. No question in either
#   round came within 0.04 of the 0.75 line; the suite ceiling is 0.708. This is the same
#   shape §0.12 recorded for Persian (topped out at 0.710 over five rounds) — the smell
#   threshold is not universal and was never the binding constraint here. Judge this
#   suite by which documents came back, not by the numbers.
#
#   MECHANICAL CHECKS — both green, run inside the check script so they cannot be skipped:
#     Guardrail #8 §3: all 11 credited paths resolve to EXACTLY ONE document — 11/11.
#     Guardrail #3a:   no credited document has a null language — 11/11.
#     No credited document is under 1,200 chars.
#
# evidence_tier: proposed `llm-translated`. This is a fact about the REVIEWER, not the
# language — if anyone on the team reads German and can sanity-check the questions and
# the glosses, it should be `human-verified`. OPERATOR TO CONFIRM.

cases:

  # ── 1 ─────────────────────────────────── skeptic ⚠ SEE THE KEPT MISS
  - id: "esde-skeptic-wunschdenken" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "In meinem Freundeskreis gilt der Glaube an Gott als reines Wunschdenken. Ich hätte gern gewusst, ob dahinter etwas Belastbares steht — etwas, das auch jemand nachprüfen kann, der von sich aus gar nicht glauben will."
    en: "In my circle of friends, believing in God counts as pure wishful thinking. I would like to know whether there is anything solid behind it — something that could also be checked by someone who has no wish to believe in the first place."
    credits:
      - { path: "/artikel/atheistin.html", en: "How an atheist found God (Marilyn Adamson, 16.4k) — she asked believers how they knew and got only 'you just know'. Her own turn is stated as exactly the fact-versus-feeling contrast this question is about: 'I methodically recalled five OBJECTIVE reasons why I believed God existed. So my belief in God rested not on feelings but on facts and reasons.'", rank: 3, score: 0.677 }
      - { path: "/artikel/ichkann.html", en: "I cannot believe — I need proof (3.6k). Written directly at the German asker: 'about a third of Germans think this way, as surveys show. They are atheists, or church members for whom faith has no relevance to daily life.' It answers by taking apart what proof means in ordinary life — the chair analogy, the aspirin bought at the chemist — and argues everyone already lives on warranted trust rather than proof. The one article here that engages the demand-for-proof stance itself instead of offering evidence.", rank: 1, score: 0.7 }
      - { path: "/artikel/gibtes.html", en: "Does God exist — six reasons why God really is there (Marilyn Adamson, 19.2k). The source's flagship apologetics article. Opens: 'Is there a God? Is there evidence for it? The following article sets out indications, facts and reasons why it is reasonable to believe in God.'", rank: 2, score: 0.69 }
      - { path: "/artikel/universum.html", en: "Did God create the universe? (10.4k) — the Big Bang as a genuine beginning, and what has to lie outside space, time and matter to have caused it. 🔴 KEPT DELIBERATELY, see below.", rank: NOT IN TOP 10 }
    kept_miss: |
      🔴 THE ONE CREDIT THAT DOES NOT RETURN, AND WHY IT IS KEPT (guardrail #8 §2).
      `/artikel/universum.html` is this source's SCIENCE-EVIDENCE article and it closes on
      precisely what the question asks for: "if you ever wanted to believe in God but
      certainly did not want to do so in contradiction with known scientific facts,
      science gives you a reason to believe that God exists and powerfully created all
      things." A question asking whether anything holds up for someone who does not want
      to believe is answered by that document. Dropping it would be dishonest, so it is
      KEPT and this case will score 3/4 coverage on purpose. Same treatment `hu` gave
      `/a/dns.html` and `bg` gave `esbg-skeptic-katastrofa`.

      What it measures: for a question that explicitly asks for something checkable, the
      engine returns `/artikel/wunder.html` at rank 4 (the article about why God does NOT
      prove himself), `/artikel/angst.html` — the anxiety article — at rank 5, and
      `/artikel/staune.html` at rank 10, all ahead of the science article, which does not
      make k=10 at all. The anxiety article surviving at rank 5 is failure mode #5
      persisting through a reword that deliberately removed every emotional word from the
      question; see `reworded` below.
    reworded: |
      ⚠️ REWORDED ONCE, for REACH — there was never a smell to fix on this source.
      v1: "…Gibt es dafür irgendetwas Belastbares, oder läuft am Ende alles nur auf ein
           Gefühl hinaus?" ("…or does it all come down to a feeling in the end?")
           → top 0.708, no smell, 3 of 5 credits returned at ranks 1, 2, 4. The closing
           "Gefühl" clause is textbook failure mode #5: it put `/artikel/angst.html`
           (anxiety) at rank 5, `/artikel/leid.html` (suffering) at rank 6 and
           `/artikel/frieden.html` (inner peace) at rank 10, while BOTH cosmology
           articles fell out of the top 10 entirely.
      v2 (kept): drops "Gefühl" and asks instead for something a person who does not want
           to believe could check.
           → **0.708 → 0.701, and the three returning credits tightened from ranks
           1, 2, 4 to ranks 1, 2, 3.** `/artikel/frieden.html` left the top 10 and
           `/artikel/leid.html` fell from 6 to 8, so removing the emotional word did
           displace two of the three emotional documents. It did NOT buy the science
           article back, and `/artikel/angst.html` held rank 5 regardless.
      🔑 The lesson for the next agent: on this estate, removing emotional framing buys
      RANK among the documents that were already reaching. It does not reach documents
      that were not. Recorded as a real result, not papered over — on `everystudent-de`
      the god-exists question retrieves the three discursive/testimonial evidence
      articles and neither of the two cosmological ones.
    rejected:
      - { path: "/artikel/wunder.html", rank: 4, why: "'Why does God not perform spectacular miracles and prove he exists?' (3.6k, Philip Yancey on 'the miracle of restraint'). It surfaced at 0.589 in discovery, held rank 3 in round 1 and rank 4 here, and reads like a perfect hit. Its subject is God's RETICENCE — why he does not compel belief — which is a different objection from whether there are grounds. Identical call to the one `hu` made on its twin /a/csodat.html." }
      - { path: "/artikel/angst.html", rank: 5, why: "🔴 THE ANXIETY ARTICLE AT RANK 5 FOR A GOD-EXISTS QUESTION, and it survived the de-emotionalising reword. Credited to case 4. It reaches because its own text digresses into 'God? Does he even exist? Can there be a God? That question sent me on a long journey of questioning and researching.'" }
      - { path: "/artikel/glaube.html", rank: 6, why: "'Who is Jesus? Is Jesus God? The proof' (Paul E. Little, 24.6k) — evidence, but for Jesus' deity specifically, which is a narrower claim than whether there is a God at all" }
      - { path: "/artikel/werist.html", rank: 7, why: "'Wer oder was ist Gott?' — the six-attributes article, i.e. the answer document for the undrafted `know-god` topic. Its subject is what God is like, not whether belief is grounded." }
      - { path: "/artikel/leid.html", rank: 8, why: "'Where is God in all the suffering?' — the article the dropped `suffering` topic would have credited first. Was rank 6 before the reword." }
      - { path: "/artikel/beziehung-zu-Gott.html", rank: 9, why: "what knowing God is like — a 'begin here' page, boilerplate-adjacent" }
      - { path: "/artikel/staune.html", rank: 10, why: "'Marvel at God's goodness' — a theodicy article under a devotional title, and the second document the dropped `suffering` topic would have credited" }
    dropped_after_engine_check:
      - { path: "/artikel/nichts.html", why: "'Was there ever the great Nothing?' (6.1k) — the sealed-room thought experiment: a room the size of a football pitch, no doors, no windows, absolutely nothing inside, and no way to get anything into it, therefore nothing cannot yield something. Filed under 'Gottes Existenz' and it surfaced in discovery, but it argues about the ORIGIN OF THE UNIVERSE and does not mention God until late. It did not make k=10 in round 1, and on reading, correctly so — the question asks whether belief in God is more than wishful thinking, not where everything came from. Dropped. One deliberate miss per case is enough, and `/artikel/universum.html` is the better one to keep." }
      - { path: "/artikel/collins.html", why: "'Scientific pointers to God' — Francis Collins on the 15 fine-tuned cosmological constants (2,252 ch, 2 chunks). Real content, not a pure tail, and on subject. Dropped because its own header line says 'Siehe Artikel Gibt es einen Gott?' — it is the abridged VIDEO companion to /artikel/gibtes.html, which is already credited and carries the same fine-tuning argument at length. Same call `hu` made on /a/isten-segitsege.html: crediting a document and its own video twin measures one text twice and inflates the denominator." }
    note: |
      🔴 THE *NOTHING → SOMETHING → WHO → WHO 2* TRAP APPEARS HERE IN A TRUNCATED FORM,
      and the truncation is itself the finding. Eight sources (`hu` `pl` `mn` `sk` `pt`
      `es` `fa` `cs`) carry this cosmological argument as FOUR documents with contentless
      sequential titles. `everystudent-de` publishes only the FIRST part —
      `/artikel/nichts.html`, "Gab es das große Nichts?" — and there is no German "Etwas",
      "Wer" or "Wer 2". A reviewer who knows the four-part pattern will go looking for the
      other three; on this source they do not exist. The one that does exist is still
      unjudgeable by title and had to be read before it could be dropped.
    top_score: 0.7

  # ── 2 ────────────────────────────────────────────────────────────── skeptic
  - id: "esde-skeptic-kollege" # topic: religions
    persona: skeptic
    topic: religions
    q: "Ein Kollege von mir ist Muslim, eine Bekannte praktiziert Buddhismus, und beide sind von ihrer Sache genauso überzeugt wie meine christlichen Freunde. Warum sollte ausgerechnet das Christentum näher an der Wahrheit sein als die anderen?"
    en: "A colleague of mine is Muslim, an acquaintance practises Buddhism, and both are just as convinced of their own thing as my Christian friends are. Why should Christianity of all things be closer to the truth than the others?"
    credits:
      - { path: "/artikel/hochsten.html", en: "Contact with the Highest (Marilyn Adamson, 19.4k). Subtitle: 'Hinduism, Buddhism, Christianity, Islam, New Age — is it not all the same thing?' Walks each belief system in turn, then compares Christianity with the others. This is the estate's /a/205 world-religions piece under a localised slug — the same article as Hungarian /a/istenkereses.html, Swahili /a/kuunganishwa.html and French /a/205divin.html (§0.7).", rank: 1, score: 0.668 }
      - { path: "/artikel/religionen.html", en: "Jesus and the other religions (2.9k) — five numbered differences, stated flatly: in many religions people strain to reach God and only ever get there in fragments, whereas in Christ God came down to us; no other founder claimed to be God; no other founder did those miracles; in other religions people punish themselves for their guilt with scourging, mortification or sacrificial rites; other religions speak of reincarnation, Jesus of bodily resurrection.", rank: 2, score: 0.629 }
    note: |
      🟢 THE CLEANEST CASE IN THE SUITE — ranks 1 and 2, first attempt, no reword, and
      it settles the §0.7 misread from the other side. An earlier pass reported the
      `religions` topic as landing on generic 'connecting with God' pages instead of the
      world-religions comparison, and §0.7 records that as WRONG because it judged by
      title. `/artikel/hochsten.html` translates as "Contact with the Highest", which is
      exactly what a generic connect-with-God page would be called. It is the comparison
      article, and this suite is the first time it is credited in a case rather than a probe.

      ⚠️ The question deliberately does NOT list the religions in hochsten.html's own
      order. `hu` wrote "Hinduism, Buddhism and Islam make the same big claims as
      Christianity" for this topic and scored **0.813** — the worst smell in batch 1 —
      because that reproduces the article's subtitle. Putting the same objection in the
      asker's workplace and naming only two faiths keeps it at 0.668.
    rejected:
