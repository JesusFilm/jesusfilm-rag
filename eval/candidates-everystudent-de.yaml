    top_score: 0.668

  # ── 3 ──────────────── newcomer 🔴 THE TAIL TEST + A SECOND RAW-SCRIPTURE SURVIVOR
  - id: "esde-newcomer-hinrichtung" # topic: jesus-death
    persona: newcomer
    topic: jesus-death
    q: "Für Christen scheint der Tod von Jesus am Kreuz alles verändert zu haben. Für mich ist das erst mal nur eine Hinrichtung vor zweitausend Jahren – was genau soll die bewirkt haben?"
    en: "For Christians, the death of Jesus on the cross seems to have changed everything. To me it is, first of all, just an execution two thousand years ago — what exactly is it supposed to have accomplished?"
    credits:
      - { path: "/artikel/starb.html", en: "The crucifixion of Jesus — why did Jesus die? (10.8k). A DEDICATED atonement article: 'This is what the death and resurrection of Jesus, the crucifixion of Jesus Christ, was about.' Works through why crucifixion was reserved for the worst criminals and who demanded his death, then the two reasons he accepted it — the second one being 'it was for us'.", rank: 1, score: 0.669 }
    the_finding: |
      🟢 THE BOILERPLATE TAIL FIRES HERE AND LOSES, AND THAT IS THE POINT OF THIS CASE.
      §0.12 says tail severity tracks the testimony share: `hu` at 24% `/story/` had tails
      at ranks 1, 2 AND 3 for its cross case and pushed the atonement article down to
      rank 5; `pt` with zero testimonies kept its atonement article at rank 1.

      `everystudent-de` is the configuration that separates the two claims — 0% testimony
      by PATH (there is no `/story/` directory at all) but ~18% by CONTENT. Measured:

        rank 1  0.669  /artikel/starb.html                              ← THE ANSWER
        rank 2  0.652  /artikel/leid.html                    suffering article, gospel tail
        rank 3  0.648  /artikel/Gott-personlich-kennenlernen-video.html  Four Spiritual Laws
        rank 4  0.616  /artikel/echtesleben.html             testimony, gospel tail
        rank 5  0.612  /artikel/lebensveranderung.html       testimony, gospel tail
        rank 6  0.611  /artikel/frieden.html                 inner peace, gospel tail
        rank 7  0.610  /artikel/beziehung-zu-Gott.html       know-God article, gospel tail
        rank 9  0.602  /artikel/glaube.html                  Jesus' DEITY, not the cross
        rank 10 0.598  /artikel/hoffnung.html                AIDS testimony, gospel tail

      🔑 So the tail is PRESENT and takes eight of the nine slots below the answer, but it
      does NOT outrank a dedicated atonement article. `de` behaves like `pt`, not like
      `hu`, despite being an `hu`-class source by content. That is evidence the driver is
      not the raw testimony share but whether the source publishes a dedicated atonement
      article at all — which is what §0.12's own 8-of-11 table already implies.

      The tail was verified, not assumed: the matched chunk of `/artikel/hoffnung.html` in
      the discovery pass is the invitation prayer verbatim — "Herr Jesus, ich brauche
      dich. Ich danke dir, dass du für mich am Kreuz gestorben bist. Ich bitte dich, in
      mein Leben zu kommen…" — and the same prayer closes `/artikel/einsamkeit.html`
      (loneliness) and `/artikel/vergifteter.html` (pornography). Sixth source, sixth
      confirmation of §0.9.

      ⓘ ON THE ATONEMENT GAP (settled, not re-opened): `de` HAS a dedicated article and
      ranks it 1. It joins the 8-of-11 majority; nothing here disturbs §0.12.
    dropped_after_engine_check:
      - path: "/artikel/werwar.html"
        why: |
          🔴 THIS DROP CARRIES A FINDING THE OPERATOR NEEDS — READ IT EVEN IF THE DROP
          ITSELF IS UNCONTROVERSIAL.

          "Wer war Jesus?" is the LARGEST document on this source at 26,343 chars, and it
          RETURNED at rank 8 / 0.603 in round 1, so this is not a reach problem. Its own
          opening states its subject: "you can quickly form an accurate picture of what
          Jesus' life, death and resurrection were about … and why his life matters so
          much for you."

          Dropped for two reasons, in this order:
          1. IT IS A RAW-SCRIPTURE DOCUMENT. The rest of its opening reads: "The following
             texts give you a short insight into the life of Jesus Christ. They are
             extracts taken directly from the GOSPEL OF JOHN, a book of the Bible, WITHOUT
             ADDITIONAL COMMENTARY." That is word for word the class §12 excludes and
             §0.12 OPEN DECISION 1 governs — the same class as `sq` /a/ishte.html
             (24,883 ch, "no commentary added"), `sq` /a/gjoni.html, `es`
             /articulos/biblia_juan.html and the Arabic Gospel of John.
             ⚠️ §0.12 states that an audit of all 45 sources found `sq` /a/ishte.html was
             "THE ONLY ONE LEFT". IT IS NOT. `/artikel/werwar.html` is a second survivor.
             THE AUDIT NEEDS RE-RUNNING before that decision is closed. Crediting it would
             also put a golden answer key on a document the campaign may delete.
          2. ON ITS TEXT IT DOES NOT ANSWER THIS QUESTION ANYWAY. It presents the events —
             Nicodemus at night, the crucifixion, the resurrection — as narrative with no
             commentary. A reader asking what the death ACCOMPLISHED is not answered by
             primary text; that is exactly what /artikel/starb.html is for.

          Leaving it uncredited also keeps `de` consistent with `sq`, where the equivalent
          document is inert and therefore cannot corrupt a score either way.
    rejected:
      - { path: "/artikel/leid.html", rank: 2, why: "RANK 2 AND REJECTED — 'Where is God in all the suffering?' matched on its gospel block ('God so loved people that he gave his only Son'), not on its subject." }
      - { path: "/artikel/Gott-personlich-kennenlernen-video.html", rank: 3, why: "The Four-Spiritual-Laws video transcript — 'how to begin a personal relationship with God right now'. Exactly the /a/personally.html shape from Part A. Tail match." }
      - { path: "/artikel/echtesleben.html", rank: 4, why: "Real life — three people who reached the summit and were still empty. Matched on its closing gospel block ('Jesus Christ took all our sins on himself when he willingly died on a cross'), not on its subject." }
      - { path: "/artikel/lebensveranderung.html", rank: 5, why: "Josh McDowell's testimony. Tail match." }
      - { path: "/artikel/frieden.html", rank: 6, why: "inner peace — credited to case 4. Tail match here." }
      - { path: "/artikel/beziehung-zu-Gott.html", rank: 7, why: "what knowing God is like — its matched chunk is the wall-of-sin-removed passage, which is tail language" }
      - { path: "/artikel/werwar.html", rank: 8, why: "raw Gospel-of-John extracts — see the drop note above; this is the second raw-scripture survivor in the estate" }
      - { path: "/artikel/glaube.html", rank: 9, why: "'Who is Jesus? — Is Jesus God? — The proof' (Paul E. Little, 24.6k). Its subject is Jesus' DEITY and whether he claimed it, not what his death accomplished. Same call `hu` made on its twin /a/hiten.html." }
      - { path: "/artikel/hoffnung.html", rank: 10, why: "Steve Sawyer's AIDS testimony. Tail match — and the specimen that proves the tail exists on this source." }
    top_score: 0.669

  # ── 4 ──────────────────────── seeker 🔴 REVERSE TITLE TRAP + A COUNTEREXAMPLE
  - id: "esde-seeker-unruhig" # topic: anxiety
