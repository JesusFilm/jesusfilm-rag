      - { path: "/a/isthere.shtml", en: "'Υπάρχει Θεός;' (18.6k) — Marilyn Adamson's flagship apologetics article. Opens by refusing to push ('Χωρίς να σου λέει ότι: Πρέπει να πιστέψεις') and then argues from the fine-tuning of the earth, DNA and the workings of the human mind. This is the source's answer to 'is there any serious argument'.", rank: 1, score: 0.683 }
      - { path: "/a/nothing.shtml", en: "'Υπήρχε ποτέ τίποτα;' (6.0k) — part 1 of the four-part cosmological chain, subtitled as a thought-journey on the beginning of time, the origin of the universe and 'το ερώτημα του ευφυούς σχεδίου' (the question of intelligent design). Argues that Absolute Nothing never existed, therefore something eternal always has. The source's reasoned, non-emotional grounds for God. 🔴 KEPT DELIBERATELY, see below.", rank: NOT IN TOP 10 }
    kept_miss: |
      🔴 THE ONE CREDIT THAT DOES NOT RETURN, AND WHY IT IS KEPT (guardrail #8 §2).
      `/a/nothing.shtml` is the entry point of `everystudent-el`'s four-part
      cosmological argument — /a/nothing.shtml → /a/something.shtml → /a/who.shtml →
      /a/who2.shtml. Its own subtitle names "την αρχή του χρόνου, την καταγωγή του
      σύμπαντος και το ερώτημα του ευφυούς σχεδίου" (the beginning of time, the origin
      of the universe, and the question of intelligent design). The question asks, in
      as many words, where everything that exists came from if not from someone. This
      document IS that argument, so dropping it would be dishonest — I KEPT it.

      WHAT IT MEASURES, and it is a corpus finding, not a question defect. THREE
      different framings of the same question were tried and NOT ONE of the four parts
      of the chain reached the top 10 for any of them:
        v1  "is there anything tangible, or is it only a matter of feeling?"  → none
        v2  "are there historical or scientific facts that support it?"        → none
        v3  "where did everything that exists come from, if not from someone?" → none
      The chain is not globally invisible — /a/who2.shtml does retrieve, at rank 9 on
      the TRINITY case (0.559) and in discovery for know-god (0.465). It is invisible
      specifically to god-exists framings. The reason is legible in the openings: the
      four parts are written as an abstract thought experiment (a sealed, windowless
      room the size of a football pitch; ten tennis balls) under titles that name no
      subject at all, and the word "Θεός" barely appears until part 4. The estate
      published its strongest formal argument for God in a form the retriever cannot
      connect to anyone asking for one.

      ⚠️ This case will therefore score coverage 1/2 on purpose. Same treatment as
      `/a/dns.html` on `eshu-skeptic-vagyalom` and `esbg-skeptic-katastrofa`.
    reworded: |
      ⚠️ REWORDED TWICE — all three engine-check rounds were spent on this one case.
      v1: "…Υπάρχει κάτι χειροπιαστό από πίσω, ή στο τέλος είναι μόνο θέμα
           συναισθήματος;" ("…is there anything tangible behind it, or is it in the end
           only a matter of feeling?")
           → top 0.708, no smell, but 1 of 3 credits returned and the shape of the
           failure was textbook FAILURE MODE #5: `/a/search.shtml` ("Sex and the search
           for intimacy") came back at RANK 3 and `/a/finding.shtml` (inner peace) at
           rank 5, for a question about evidence. Naming "συναίσθημα" (feeling) dragged
           the whole top 10 toward the emotional-need articles. The brief's fix —
           ask for GROUNDS, not about feelings — is exactly right.
      v2: "…υπάρχουν ιστορικά ή επιστημονικά δεδομένα που να τη στηρίζουν…"
           ("…are there historical or scientific facts that support it…")
           → top 0.693, /a/isthere.shtml up to rank 1, but a NEW artifact appeared:
           `/a/bible.shtml` jumped to RANK 2 (0.683). The single word "ιστορικά"
           (historical) pulled the Bible-transmission article — FAILURE MODE #4, an
           incidental adjective behaving like scene-setting colour. Still 1 of 3.
      v3 (kept): drops "ιστορικά", keeps the grounds framing, and points the example at
           the origin of everything — which is what the cosmological chain argues.
           → **0.708 → 0.693 → 0.683.** /a/bible.shtml fell to rank 9 and
           /a/isthere.shtml held rank 1. The chain still did not come.

      🔴 AND `/a/faith.shtml` WAS DROPPED HERE — see `dropped_after_engine_check`.
    dropped_after_engine_check:
      - path: "/a/faith.shtml"
        why: >
          "Πέρα από την Τυφλή Πίστη" (23.4k, Paul E. Little) — credited in rounds 1 and 2 and dropped after round 2. Its opening genuinely reads like an evidence-for-God article ("Οφείλουμε να ερευνήσουμε την ιστορία για να ανακαλύψουμε αν υπάρχει κάποιο στοιχείο που να αποκαλύπτει το Θεό") and its title is the objection itself — beyond BLIND faith. But the sentence after that is the tell: "Πριν από περίπου 2000 χρόνια… γεννήθηκε ένα παιδί μέσα σε μια φάτνη." The subject of the document is JESUS' identity and deity, argued as historical evidence. It is the Greek twin of `hu` /a/hiten.html, which the Hungarian suite rejected from its evidence case on the same reasoning. It missed the top 10 in both rounds and, on re-reading the body rather than the opening, the engine is right. THE ENGINE IS RIGHT — DROPPED, not kept. ⓘ It is also the closest thing this source has to an atonement article, which is why the `jesus-death` topic had to be dropped for absence; see the header.
