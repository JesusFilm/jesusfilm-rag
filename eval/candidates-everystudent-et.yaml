cases:

  # ── 1 ─────────────────────────── skeptic · the hardest case in this suite
  - id: "eset-skeptic-valjamoeldud" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "Minu sõpruskonnas peetakse usku puhtaks soovmõtlemiseks – millekski, mille inimene endale ise välja mõtleb. Kas selle poolt on midagi asjalikku tuua? Kas universumi ehitusest või ajaloost saab midagi järeldada, või jääb see lõpuks ikkagi tunde peale?"
    en: "In my circle of friends, faith is regarded as pure wishful thinking — something a person invents for themselves. Is there anything substantial to be offered for it? Can anything be concluded from the make-up of the universe or from history, or does it in the end still come down to feeling?"
    credits:
      - { path: "/a/olemas.html", en: "'Does God exist? Six reasons to believe God exists' (Marilyn Adamson, 16.8k) — this source's flagship apologetics article. Opens: 'Would you not like someone, just once, to show you evidence for God's existence? No arm-twisting. No claims that you simply have to believe.' Then the moon-landing-denier analogy, then design in the universe: 'the more science discovers about human life and the universe, the clearer it becomes how complex and detailed their design is.' Answers the fact-versus-feeling question head-on.", rank: 3, score: 0.537 }
      - { path: "/a/sattusime.html", en: "FAQ: 'Did we end up here by chance?' — the cosmological half of the question. 'It is impossible for something to arise from absolutely nothing, however many billions of years there are for it, because time itself causes nothing… the sum of chance and time is not a sufficient explanation. To say we got here by chance requires far more faith than believing in an Intelligent Creator.' ⚠️ 1,114 chars, below the script's 1,200 watch line — SEE THE NOTE, it is not a pure tail.", rank: 2, score: 0.572 }
    note: |
      ⚠️ THE ONE UNDER-1,200-CHAR CREDIT IN THIS SUITE, AND WHY IT IS NOT A PURE TAIL.
      Failure mode #2 says never credit a 476–809 char page that is only a video promo
      plus the invitation prayer. `/a/sattusime.html` is not one. Its full text was read
      from the database: 1,114 chars of which ~1,050 are the argument quoted above
      (the "flying polar bear" illustration and all). There is no video promo and no
      invitation prayer — the only tail residue is a single trailing LINK line,
      "Kuidas alustada suhet Jumalaga" ("How to begin a relationship with God"). The
      check script will still WARN on the length; the warning is correct to raise and
      wrong to act on here. OPERATOR MAY OVERRIDE — dropping it leaves the case with
      one credit at rank 3, which is still a valid case.

      ⓘ IT ALSO SHOWS WHAT ESTONIAN DID NOT LOCALISE. This FAQ closes by pointing the
      reader to "Was there ever nothing?" — **in English, untranslated**. That is the
      first article of the *Nothing → Something → Who → Who 2* four-part cosmological
      series which §0.12 lists as a SYSTEMATIC title trap across `hu` `pl` `mn` `sk`
      `pt` `es` `fa` `cs`. Estonian carries only this one-page FAQ digest of it and
      links out to the English original. **The four-part title trap does not exist on
      this source** — one fewer hazard, and a data point on how far localisation went.
    reworded: |
      ⚠️ REWORDED THREE TIMES, AND ROUND 4 WAS THE WORST. Recording all four, because
      the pattern is the clearest specimen of failure mode #5 in this suite.
      v1: "…millekski, mille inimesed on endale ise välja mõelnud, SEST NII ON LIHTSAM
           ELADA. Kas selle taga on ka midagi, mida saaks päriselt kontrollida…"
           ("…because it makes life easier…")
           → top 0.574, no smell, but `/a/olemas.html` at rank 9 and `/a/enamat.html`
           out entirely. The "makes life easier" clause is the FAITH-AS-A-CRUTCH
           framing §0.12 warns about, and the top six came back accordingly:
           rank 1 `/a/janu.html` (alcohol and real friendship), rank 3
           `/a/elumuutuste.html`, rank 4 `/a/ilu.html` (a fashion model on self-worth),
           rank 6 `/a/vabaks.html` (EATING DISORDERS). Emotional framing retrieved
           emotional documents; every apologetics article fell to the bottom.
      v2: dropped the coping clause, asked for "kontrollitav alus – midagi ajaloost või
           maailmast endast" ("checkable grounds — from history or the world itself").
           → top 0.622, no smell, BOTH credits returned — but at ranks 9 and 10.
           A clean round that had not actually answered the question (#6). The word
           "kristluse" ("Christianity's claims") pulled the comparative-religion shelf
           up instead: `/a/kuidas.html` rank 2, `/a/juurde.html` rank 3.
      v3 (KEPT): drops "kristluse", names the two grounds concretely as "universumi
           ehitus" (the make-up of the universe) and "ajalugu", and restores the menu's
           "soovmõtlemine" (wishful thinking).
           → **`/a/olemas.html` rank 9 → rank 3, its best position in four rounds**,
           and `/a/sattusime.html` arrives at rank 2. Cost: `/a/enamat.html` drops out
           — see `dropped_after_engine_check`.
      v4: same as v3 but with "universumi ehitusest" softened back to "maailmast
           endast". → top 0.560, **BOTH credits out of the top 10**, rank 1
           `/a/kuidas.html`, rank 2 `/a/ilu.html`. The concrete design noun is what
           carries this article; removing it collapses the case. Reverted to v3.
    dropped_after_engine_check:
      - path: "/a/enamat.html"
        why: >
          "More than blind faith — the life of Jesus Christ. Was he the Son of God?" (Paul E. Little, 19.9k). It opens on exactly this question ("only if he takes the initiative and reveals himself can we know for certain whether God exists and what he is like… we must examine history"), which is why it was credited in rounds 1–4. But its SUBJECT is Jesus' life and deity; God's existence is its preamble, not its argument. It returned at rank 9 under v2 and outside the top 10 under v3 and v4. This is the same call `hu` made on `/a/hiten.html`, the Hungarian twin of this same Paul Little article, which `hu` also declined to credit for god-exists. Dropped — the engine is right.
    rejected:
      - { path: "/a/kuidas.html", rank: 1, why: "RANK 1 AND REJECTED — the world-religions article, credited to case 2. It reaches rank 1 on 'is there anything substantial' because its whole shape is comparative evaluation, but it does not argue that God exists." }
      - { path: "/a/seks1.html", rank: 4, why: "'Is premarital sex wrong? Must we live a boring life?' at rank 4 for an evidence question. A boilerplate-tail match — and the only one in this suite that reaches the top 5." }
      - { path: "/a/poole.html", rank: 5, why: "'Does it matter which God I call out to?' — its subject is praying to a god who may not exist, an adjacent but different question." }
      - { path: "/a/hingerahu.html", rank: 6, why: "the peace/stress article — the source's broadest document, see the header" }
      - { path: "/a/elevant.html", rank: 7, why: "credited to case 2" }
      - { path: "/a/keson.html", rank: 8, why: "'Who is God' — the six-attributes article. It describes what God is like, presupposing he exists. This is the `know-god` answer, and the topic was dropped; see the header." }
      - { path: "/a/kurjus.html", rank: 9, why: "the evil-and-suffering FAQ — a different objection" }
      - { path: "/a/elumuutuste.html", rank: 10, why: "credited to case 4. It was RANK 1 for v2 of this question; this source's tail magnet." }
    top_score: 0.576

  # ── 2 ─────────────────────────────────────────── skeptic · the deepest key
  - id: "eset-skeptic-nurgaalt" # topic: religions
    persona: skeptic
    topic: religions
    q: "Mul on tuttavaid väga erineva usulise taustaga ja igaüks räägib omast sama veendunult. Mulle tundub, et nad kirjeldavad kõik lihtsalt sama asja eri nurga alt. Miks peaks kristlus siin midagi muud olema?"
    en: "I know people from very different religious backgrounds and every one of them speaks about their own with the same conviction. It seems to me they are all just describing the same thing from a different angle. Why would Christianity be anything different here?"
    credits:
      - { path: "/a/elevant.html", en: "'Is God an elephant?' (David A. Horner) — the blind-men-and-the-elephant allegory, i.e. word for word the claim this question makes. Opens: 'a popular parable used to show that all religions can describe God adequately. Religious-studies lecturers especially love it, because it equalises all religions and shows their descriptions of God to be equally true.' Then dismantles it.", rank: 2, score: 0.653 }
      - { path: "/a/juurde.html", en: "FAQ: 'Is Jesus the only way to God?' — the question it answers is this case's objection verbatim: 'Christianity is the RIGHT one — is that not naive?' Reply: 'Jesus said he is the Way, the Truth and the Life. Either he spoke the truth or he did not. If he spoke the truth, it is not naive to agree with him,' then that belief in Jesus is not a Western thing (the world's largest church is in South Korea). ⚠️ 1,496 chars and its first third is a pointer to /a/kuidas.html — a BOUNDARY credit, see the note.", rank: 3, score: 0.623 }
      - { path: "/a/kuidas.html", en: "'How to find God — are all the world's religions really the same?' (Marilyn Adamson, 15.8k). Surveys Hinduism, the New Age, Buddhism, Islam and Christianity one at a time — what each is, what marks it out, what it offers a person — then sets Jesus' teaching against them. This is the estate's world-religions article (the twin of the Hungarian /a/istenkereses.html and the French /a/205divin.html) under a localised slug.", rank: 4, score: 0.619 }
      - { path: "/a/religioonidel.html", en: "'Jesus and the world religions — what is the difference between Jesus' teaching and the world religions?' A point-by-point contrast: 'in contrast to religions that reach up toward God, with Jesus you see God stretching down to us'; 'no key figure of any world religion has been acknowledged as God.'", rank: 6, score: 0.596 }
    note: |
      ⚠️ TITLE TRAP, MILD BUT REAL — AND IT RUNS THE OPPOSITE WAY TO THE ESTATE NORM.
      `/a/kuidas.html` carries TWO conflicting names. Its stored `title` is
      "Hinduism, budism, islam, kristlus, New Age" — honest and machine-readable. Its
      on-page H1 is "Kuidas leida Jumalat" ("How to find God"), and the slug follows
      the H1. So a reviewer working from the URL files this under conversion, while a
      reviewer working from the title field gets it right. The estate's usual trap is
      the reverse (a contentless title over a substantive body); Estonian is the first
      source in the campaign where the TITLE FIELD is the reliable half and the SLUG
      is the misleading one. Credit by path and read the opening — both, as always.

      ⓘ `/a/juurde.html` IS A BOUNDARY CREDIT. 1,496 chars — above the 1,200 line, so
      the script does not warn — but roughly the first third is link furniture ("we have
      an article about the main differences between the world religions… see the article
      Kuidas leida Jumalat"). I credited it because the remaining two-thirds answer this
      exact objection in this source's own words ("is that not naive?"), and because it
      returns at rank 3 unprompted. OPERATOR MAY DROP IT: the case is a clean 3/3 without
      it, at ranks 2, 4 and 6.
    rejected:
      - { path: "/a/elumuutuste.html", rank: 1, why: "RANK 1 AND REJECTED — Josh McDowell's changed-life article. Its 'Christianity is not a religion' passage and its church-hopping opening are why it matches; its subject is one man's search for meaning. Credited to case 4. This is this source's tail magnet, and this is the only place in the suite where it holds rank 1." }
      - { path: "/a/katoliiklastel.html", rank: 5, why: "'Is there a difference between Catholics and Christians?' — an INTRA-Christian question, not a world-religions one. Same call `hu` made on /a/katolikus.html and `ru` on /a/katolikom.html. NOTE §0.12: this is the article Turkish got at rank 1 from the 'forgiveness of sins' trigger phrase; here it arrives on topic and is still not the answer." }
      - { path: "/a/olemas.html", rank: 7, why: "credited to case 1" }
      - { path: "/a/piibel.html", rank: 8, why: "credited to case 5" }
      - { path: "/a/enamat.html", rank: 9, why: "the life-of-Jesus article, dropped from case 1" }
      - { path: "/a/ilmutatud.html", rank: 10, why: "credited to case 5" }
    top_score: 0.656

  # ── 3 ────────────────────────────────── newcomer · the cleanest case here
  - id: "eset-newcomer-kirikus" # topic: trinity
    persona: newcomer
    topic: trinity
    q: "Käisin paar korda kirikus ja seal pöörduti kord Isa poole, kord Jeesuse poole, kord Püha Vaimu poole. Kas kristlased kummardavad siis mitut jumalat või kuidas seda mõista?"
    en: "I went to church a couple of times and there they addressed the Father, then Jesus, then the Holy Spirit. So do Christians worship several gods, or how am I meant to understand it?"
    credits:
      - { path: "/a/kolmainsust.html", en: "FAQ: 'Can you explain the Trinity?' — 'The Bible speaks clearly of God the Father, God the Son (Jesus Christ) and God the Holy Spirit, and also says clearly that there is only ONE God.' Then the arithmetic of the Estonian word itself (kolm + ainsus = kolmainsus), the water/ice/steam analogy, and why the egg analogy misleads (it implies God is made of parts).", rank: 1, score: 0.637 }
      - { path: "/a/vaim.html", en: "FAQ: 'Who is the Holy Spirit?' — 'The Holy Spirit is not a vague, evanescent shadow nor an impersonal force. He is a person, in every respect equal to God the Father and God the Son. He is regarded as the third person of God.' Answers the third of the three the asker heard named.", rank: 2, score: 0.587 }
    note: |
      ⓘ NO REWORD NEEDED, and that is the §0.10/§0.11 lesson transferring for the third
      time. `ru` (0.807) and `bg` (0.756) both smelled on this topic when the question
      was stated as the doctrinal formula, and both fixed it by reframing it as
      something a newcomer NOTICES IN A SERVICE. Estonian started from the fixed shape
      and landed at 0.637, ranks 1 and 2, first time. The question also never uses the
      word "kolmainsus", which would have restated /a/kolmainsust.html's own title.
    rejected:
      - { path: "/a/kuidas.html", rank: 3, why: "the world-religions article — credited to case 2. It matches on 'do Christians worship several gods', which is a question it asks about OTHER religions." }
      - { path: "/a/poole.html", rank: 4, why: "'Does it matter which God I call out to?' — about false gods and whether everyone prays to the same one, not about one-versus-three." }
      - { path: "/a/pusida.html", rank: 5, why: "'Divorce statistics — marriage problems' at rank 5 for a Trinity question. A boilerplate-tail match, and the plainest specimen of the tail in this suite." }
      - { path: "/a/mida.html", rank: 6, why: "'What does Jesus say about himself?' — Jesus' DEITY specifically, the closest near-miss here. Rejected because the asker's difficulty is the arithmetic (three named, one God), which /a/kolmainsust.html handles and this one does not." }
      - { path: "/a/enamat.html", rank: 7, why: "the life-of-Jesus article, dropped from case 1" }
      - { path: "/a/huntidega.html", rank: 8, why: "'Advice about relationships' (a young man on dating and sex) at rank 8 for a Trinity question. Tail match." }
      - { path: "/a/lukka.html", rank: 9, why: "'What if I neither accept nor reject God?' — agnostic non-commitment, a different question" }
      - { path: "/a/elumuutuste.html", rank: 10, why: "credited to case 4" }
    top_score: 0.637

