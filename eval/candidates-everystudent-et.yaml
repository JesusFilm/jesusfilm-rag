      - { path: "/a/olla.html", en: "FAQ: 'Why do I need God in order to be happy?' — asked by someone already content, which is the mirror image of this asker: 'you are right that happiness can be found in life without God… yet however happy you are now, your life would be fuller with him.' The tricycle-versus-Porsche parable, then that Jesus can fill the deepest longings.", rank: 7, score: 0.498 }
    reworded: |
      ⚠️ REWORDED ONCE, for LENGTH — the §0.12 Polish finding, confirmed on Estonian.
      v1 was 18 words and stopped at the feeling: "…Mille nimel ma seda kõike üldse
      teen?" → `/a/elumuutuste.html` rank 3, `/a/olla.html` rank 8.
      v2 (kept) adds the second half — "and does life have any larger aim than just
