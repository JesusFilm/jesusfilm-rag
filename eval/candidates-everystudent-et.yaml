# Phase 5 PART B — golden suite DRAFT for `everystudent-et` (46 documents, tudengielu.net).
# Campaign #111, batch 2. Working record — NOTHING here has been written to
# eval/qa-golden.yaml. Guardrail #4 gates that on an explicit operator approval turn.
#
# Sizing: 46 ÷ 8 = 5.75 → 5 cases.
# Personas: skeptic 2 · newcomer 1 · seeker 1 · believer 1 — the §0.7 five-case row.
# Questions authored IN ESTONIAN, not translated from the English menu (§0.6).
#
# ── CORPUS SHAPE — read this before judging any hit ──────────────────────────
#   46 documents, ALL of them `/a/*.html` articles. **ZERO `/story/` testimonies —
#   0% testimony share.** That is the lowest in the estate alongside `pt`, and §0.12
#   predicts the consequence exactly: the boilerplate tail is present but WEAK. No
#   case in this suite has a tail at rank 1.
#   The corpus is also unusually SHORT-TAILED: 30 of the 46 documents are 1.1k–4.8k
#   char `KKK:` (FAQ) pages. Only six documents exceed 14k chars. A five-case suite
#   on a 46-doc source therefore has thin answer keys by construction, not by
#   sloppiness — most topics here are carried by ONE long article plus one FAQ page.
#
#   ⚠️ THIS SOURCE'S TAIL MAGNET IS AN ARTICLE, NOT A TESTIMONY. With no `/story/`
#   pages, the role `/story/Atti.html` plays on `hu` is played here by
#   `/a/elumuutuste.html` (Josh McDowell's changed-life article, 14.3k). It appears
#   in the top 10 of FOUR of the five cases and was RANK 1 for both skeptic
#   questions before they were reworded. It is credited to exactly one case
#   (`purpose`), where its subject actually lies.
#
# ── HAZARDS (from .tmp-diag/phase5-openings.ts) ──────────────────────────────
#   ✅ every path resolves to exactly one document — 46/46
#   ✅ no null-language documents — 0 of 46. The seven Estonian documents that sat
#      null-language before the 2026-07-31 sweep are labelled `et` and VERIFIED here.
#   ✅ no duplicate titles (the hazard that bit `bg` and `ja` does not exist here)
#   ⚠️ 1 document under 1,200 chars: `/a/sattusime.html` (1,114). It is NOT a pure
#      tail — see case 1, where it is credited and the full text is quoted.
#   ⓘ `.contentleftpadding` container (unique in the estate): NO truncation or
#      padding artifact found. Openings are clean prose from the first sentence,
#      character counts are consistent with body length, and the 27.5k
#      `/a/piibel.html` is intact through manuscripts, archaeology and prophecy.
#      Nothing to report against the extractor.
#
# ── DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-et et ─────────
#   → 29 distinct candidate documents of 46. All 46 openings were then read from
#     the database before anything was credited (guardrail #5).
#
# ── ENGINE-CHECKED FOUR ROUNDS — .tmp-diag/phase5-check.ts et et ─────────────
#   Round 1: 0 smells · 1 credit not in top 10 · max top score 0.713
#   Round 2: 0 smells · 0 credits not in top 10 · max top score 0.713
#   Round 3: 0 smells · 1 credit not in top 10 · max top score 0.713
#   Round 4: 0 smells · 2 credits not in top 10 · max top score 0.713  ← WORST, reverted
#   Final:   0 smells · 0 credits not in top 10 · max top score 0.713
#   Round 2 was already "clean" and I ran two more anyway, because of §0.12 failure
#   mode #6: in round 2 case 1 returned both credits at ranks 9 and 10 — a survival,
#   not an answer. The full four-round wording log for that case is in `reworded:`.
#
# ── MECHANICAL CHECKS — run inside the check script so they cannot be skipped ──
#   Guardrail #8 §3: all 12 credited paths resolve to EXACTLY ONE document — 12/12.
#   Guardrail #3a:   no credited document has a null language — 12/12.
#
# ── TOPICS: 5 of the §0.7 ten used, 5 dropped ────────────────────────────────
#   USED     god-exists · religions · trinity · purpose · bible-trust
#   DROPPED — 2 are CONTENT GAPS (this source does not carry them):
#     `jesus-death` 🔴 NO DEDICATED ATONEMENT ARTICLE. Confirmed by discovery and by
#        reading all 46 openings. The cross is stated in PASSING inside other
#        articles — `/a/religioonidel.html` ("being God, he paid our debt… on the
#        cross he bore all our sins"), `/a/usaldamine.html` ("what does trusting
#        Jesus mean"), `/a/jolka.html` (the Four-Laws tract) — but no document's
#        SUBJECT is what the death accomplished. Estonian joins `ru`, `zh-cn` and
#        `mn` as the FOURTH source in this class; §0.12 settled that this is corpus
#        composition, so it is recorded and not re-opened.
#     `prayer`      🔴 NO PRAYER ARTICLE AT ALL. Discovery returned exactly one
#        candidate for the prayer question — `/a/hingerahu.html` at 0.451, matched on
#        its gospel tail ("he was executed on the cross in our place"). Nothing on
#        this source addresses unanswered prayer. This is why the believer case rides
