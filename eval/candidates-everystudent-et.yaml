      - { path: "/a/huntidega.html", rank: 4, why: "dating and relationships — tail match" }
      - { path: "/a/hingerahu.html", rank: 5, why: "the peace/stress article. Its SEO title is literally 'How to cope with stress – The meaning of life', so it is a near-miss by design; its body is about anxiety and stability, and `anxiety` was the dropped topic it would have carried." }
      - { path: "/a/jolka.html", rank: 6, why: "'J.O.L.K.A.' — the Four Spiritual Laws tract. This is this source's pure gospel-summary page and exactly the /a/personally.html shape from Part A. Never credit it." }
      - { path: "/a/silmitsi.html", rank: 8, why: "death and the fear of dying — adjacent, different" }
      - { path: "/a/vabaks.html", rank: 9, why: "'Free from an eating disorder' at rank 9 for a purpose question. Tail match — and the article that was rank 6 for v1 of case 1." }
      - { path: "/a/kuidas.html", rank: 10, why: "credited to case 2" }
    top_score: 0.578

  # ── 5 ─────────────────────────── believer · the strongest case in this suite
  - id: "eset-believer-urik" # topic: bible-trust
    persona: believer
    topic: bible-trust
    q: "Ma ise usun, aga kui keegi ütleb mulle, et Piibel on lihtsalt vana tekst, mida on sajandeid käsitsi ümber kirjutatud, jään ma vastuse võlgu. Mille poolest erineb see mis tahes muust muistsest ürikust?"
    en: "I believe myself, but when someone says to me that the Bible is just an old text that has been copied by hand for centuries, I have no answer to give. What makes it different from any other ancient document?"
