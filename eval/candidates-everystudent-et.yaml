    topic: purpose
    q: "Iga päev möödub mul ühtemoodi ja õhtul jääb tunne, et sellest ei jäänud midagi järele. Mille nimel ma seda kõike üldse teen ja kas elul on mingi suurem siht kui lihtsalt ühest päevast teise jõuda?"
