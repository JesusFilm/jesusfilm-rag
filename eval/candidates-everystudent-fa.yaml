#   so the "testimony outranks argument" effect is present under article URLs.
#   Null-language documents: 0 of 75.  Documents not labelled `fa`: 0 of 75.
#   Duplicate titles: 0 (the hazard that bit `bg` does not exist here).
#
# 🔴 LANGUAGE LABELS — CLEAN NOW, BUT THE ROOT CAUSE IS STILL IN THE TEXT. See SUMMARY.
#
# DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-fa fa
#   → 45 distinct candidate documents of 75, all ten topics covered.
# All 75 documents were then read from the database (title + opening 500–700 chars)
# before anything was credited — guardrail #5, and specifically because of the
# boilerplate-tail trap recorded in §0.9. Judging by title would have been wrong in BOTH
# directions on this source; four title traps are listed in the SUMMARY.
#
# ENGINE-CHECKED FIVE TIMES (guardrail #8 §2) — .tmp-diag/phase5-fa-check.ts
#   Round 1: 0 paraphrase smells (max 0.706) · 6 credits not returned · 27 credits
#   Round 2: 0 paraphrase smells (max 0.710) · 2 credits not returned · 28 credits
#   Round 3: 0 paraphrase smells (max 0.709) · 1 credit  not returned · 27 credits
#   Round 4: 0 paraphrase smells (max 0.710) · 1 credit  not returned · 27 credits
#   Round 5: 0 paraphrase smells (max 0.710) · 1 credit  not returned · 27 credits  ← THIS FILE
#   Rounds 3 and 4 were spent entirely on case 9, which flip-flops between two credits
#   it cannot hold at once. The working is in that case's `reworded` block.
#   ⓘ This source never produced a paraphrase smell. Scores here run LOW compared with
#   `ru`/`bg`/`hu` (top scores 0.587–0.710, mean 0.666), so the 0.75 line was never in
#   reach. That is a property of the source, not evidence the questions are good — the
#   REACH failures, not the smells, are what took five rounds.
#
# MECHANICAL CHECKS — both green, run inside the check script so they cannot be skipped
#   Guardrail #8 §3: all 27 credited paths resolve to EXACTLY ONE document — 27/27.
#   Guardrail #3a:   no credited document has a null language — 27/27, all `fa`.
#   No document is credited by more than one case — 27 credits, 27 distinct documents.
