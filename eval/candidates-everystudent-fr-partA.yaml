# Slice #10 — Stage 4, PART A (re-review of the 10 existing `tlfr-*` French cases)
# PROPOSAL ONLY — nothing here reaches eval/qa-golden.yaml without operator approval
# (golden Guardrail #4: the WRITE is the gate).
#
# Method
#   Candidate pool  : deep-k fr-scoped probe, topK=40, minScore=0, over all 10 fr cases.
#                     Floor 0.50 — the HIGHEST floor that excludes ZERO already-approved
#                     docs (credited docs bottom out at 0.511). 320 (case, doc) pairs over
#                     151 distinct documents (94 thelife-fr · 56 everystudent-fr · 1 cru).
#   Judging         : whole-document (every chunk sampled, never chunk 0 — slice #7),
#                     two axes scored separately (relevance ⊥ biblical soundness),
#                     both gated at 0.75. French is MULTI-source, so the slice-#7/#8
#                     two-axis rule applies, NOT slice #9's relevance-only rule.
#   Result          : 54 approved / 320 (16.9%). 266 rejected — 265 as SOUND-BUT-
#                     OFF-QUESTION (the Guardrail #6 tripwire, 83%), 1 on SOUNDNESS.
#   New credits     : 33 everystudent-fr (the new source) + 21 thelife-fr (prior-slice
#                     curation gaps, golden R3).
#
# ── SOUNDNESS REJECTION (1) ──────────────────────────────────────────────────
# everystudent-fr /a/700horribles.html — "Pourquoi adorer un Dieu qui permet des choses
#   horribles?" (the child-rape FAQ). Relevance 0.82 for tlfr-seeker-deuil-fils; SOUNDNESS
#   0.62 → REJECTED. The free-will defence itself is orthodox and it opens with genuine
#   solidarity ("un membre de ma famille proche s'est fait violer dans son enfance… je
#   comprends vraiment votre rage"). But mid-article it asserts, with no evidence and as a
#   wager: « je parie que la plupart [des conseillers] diraient que l'abus verbal est celui
#   dont les conséquences sont les plus graves » — a false empirical claim that relativises
#   child sexual abuse downward, inside the answer to a survivor's question. This is the
#   FRENCH SIBLING of the Arabic doc slice #9 filed under #123. See the slice file.

part_a_credits:

  # ── 1. tlfr-seeker-deuil-fils ── "My son died and I'm angry at God — can my faith survive?"
  # existing 4 credited (cov 3/4). +6. Rank stays 1.
  tlfr-seeker-deuil-fils:
    everystudent-fr:
      - "/a/601epreuve.html"          # rel 0.82 — "Où est Dieu quand l'épreuve nous frappe?" fear/disaster/anguish
      - "/a/aide-de-Dieu.html"        # rel 0.78 — "when tragedy strikes we ask why"; heaven, no more pain
      - "/a/602pourquoi.html"         # rel 0.85 — "Pourquoi la vie est-elle si dure?" — names anger at God directly
    thelife-fr:
      - "/mon-petit-heros"            # rel 0.76 — infant brother's death; the family's faith after it   [gap-fix]
      - "/dans-la-tempete-faire-face-a-une-crise-familiale"  # rel 0.76 — family crisis, grieving at own pace [gap-fix]
      - "/comment-parler-de-deuil"    # rel 0.80 — author lost twins at 20 weeks; child-loss grief       [gap-fix]

  # ── 2. tlfr-skeptic-dieu-existe ── "I'm an atheist: give me one good reason a god exists."
  # THE regressed case (rank 1→4, cov 4/4→2/4). existing 4. +16. Rank 4 → 1.
  tlfr-skeptic-dieu-existe:
    everystudent-fr:
      - "/a/athee.html"               # rel 0.92 — ex-atheist + "five objective reasons I believed"
      - "/a/101existe.html"           # rel 0.95 — "Dieu existe-t-il? Six arguments" — the canonical answer
      - "/a/rationnelle.html"         # rel 0.88 — "How can a rational person still believe today?"
      - "/a/reel.html"                # rel 0.90 — "Dieu est-il réel?" DNA, Anthony Flew
      - "/a/cree.html"                # rel 0.85 — "Qui a créé Dieu?" the classic atheist rejoinder
      - "/a/deconcertes.html"         # rel 0.85 — "Scientists baffled by the laws of nature"
      - "/a/collins.html"             # rel 0.85 — Francis Collins: "a huge challenge for a strict atheist"
      - "/a/univers.html"             # rel 0.85 — "Dieu a-t-il créé l'Univers?" Big Bang, a beginning
      - "/a/103quelquechose.html"     # rel 0.85 — why something rather than nothing (the Eternal Something)
      - "/a/102rien.html"             # rel 0.82 — "Et avant le commencement? Rien?" origins, design
      - "/a/731miracle.html"          # rel 0.82 — "Why no spectacular miracle to prove it?"
      - "/a/guide.html"               # rel 0.82 — scientific + historical reasons, AND reasons against
      - "/a/ouest.html"               # rel 0.80 — "show me God" — if God is invisible, how?
      - "/a/204qui2.html"             # rel 0.80 — the Eternal Someone outside time and space
      - "/a/104qui.html"              # rel 0.80 — "Qui est le Quelque Chose Éternel?"
    thelife-fr:
      - "/bienvenue-aux-sceptiques"   # rel 0.78 — skeptics welcome; trilemma, historical documents [gap-fix]

  # ── 3. tlfr-skeptic-resurrection ── "How can anyone believe a dead man rose 2,000 years ago?"
  # existing 2 (cov 1/2). +6.
  tlfr-skeptic-resurrection:
    everystudent-fr:
      - "/a/201foiaveugle.html"       # rel 0.88 — Paul Little; liar/lunatic/Lord, the empty tomb
      - "/a/pourquoi-jesus-est-il-mort.html"  # rel 0.85 — crucifixion, death, resurrection, the guard
      - "/a/miracles-de-jesus.html"   # rel 0.80 — magician André Kole's analysis; ends on the resurrection
      - "/a/215bible.html"            # rel 0.80 — Tacitus, manuscripts, gospel dating
      - "/a/700_existe.html"          # rel 0.75 — extra-biblical evidence Jesus existed at all
    thelife-fr:
      - "/bienvenue-aux-sceptiques"   # rel 0.85 — resurrection documents "as numerous as other history" [gap-fix]

  # ── 4. tlfr-seeker-avortement ── post-abortion self-forgiveness
  # existing 4 (cov 3/4). +2. everystudent-fr contributes NOTHING here (it has no
  # post-abortion content) — the new source is not universally relevant.
  tlfr-seeker-avortement:
    thelife-fr:
      - "/apprenez-a-vous-voir-comme-dieu-vous-voit"  # rel 0.78 — names abortion as a shame source [gap-fix]
      - "/venez-tel-que-vous-etes"    # rel 0.76 — "aide-moi à me pardonner" — self-forgiveness    [gap-fix]

  # ── 5. tlfr-seeker-porno ── "Can't quit porn, so ashamed — how do I get out?"
  # existing 2 (cov 2/2). +4. Rank 3 → 1.
  tlfr-seeker-porno:
