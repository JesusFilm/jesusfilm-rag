      - "/a/offre.html"               # rel 0.80 — "Qu'est-ce que Jésus nous offre?"
      - "/a/noel.html"                # rel 0.78 — "not another prophet or teacher — God revealing himself"
      - "/a/202citationsdeJesus.html" # rel 0.78 — what Jesus claimed about himself

  # ── 10. tlfr-seeker-anxiete ── churning worries, real inner peace
  # existing 4 (cov 4/4). +4, ALL in top-10. Rank 3 → 1.
  tlfr-seeker-anxiete:
    everystudent-fr:
      - "/a/coronavirus.html"         # rel 0.90 — "comment gérer l'anxiété… vivre en paix"
