      - "/a/601epreuve.html"          # rel 0.76 — "où puiser des forces… surmonter les craintes et l'angoisse"
    thelife-fr:
      - "/les-merveilles-de-la-creation"  # rel 0.75 — "Que faire en temps de stress?"        [gap-fix]

