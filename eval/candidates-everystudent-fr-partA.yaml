      - "/a/512luttant.html"          # rel 0.90 — an 18-year-old woman's own account of the same struggle
    thelife-fr:
      - "/la-puissance-des-images"    # rel 0.85 — the power of images, porn dependency        [gap-fix]
      - "/une-transformation-surnaturelle"  # rel 0.80 — freed from sexual addiction          [gap-fix]

  # ── 6. tlfr-believer-pardonner ── "I can't forgive — how do I actually do it?"
  # existing 6 (cov 3/6). +4. All prior-slice gaps; everystudent-fr has no forgiveness content.
  tlfr-believer-pardonner:
    thelife-fr:
      - "/comment-pardonner-et-oublier-quand-votre-partenaire-vous-decoit"  # rel 0.85 concrete steps [gap-fix]
      - "/violence-fraternelle"       # rel 0.78 — sibling violence, hatred → healing            [gap-fix]
      - "/trainer-les-bagages-de-famille-la-liberte-est-un-choix"  # rel 0.76 — releasing past hurt [gap-fix]
      - "/il-ne-brisera-pas-le-roseau-qui-se-ploie"  # rel 0.75 — forgiving an abuser as the gateway [gap-fix]

  # ── 7. tlfr-believer-saint-esprit ── "Christian life feels flat — how to live in the Spirit's power?"
  # existing 4 (cov 4/4). +5. everystudent-fr contributes NOTHING — it publishes seeker
  # apologetics, not sanctification. /a/708saintesprit.html scored rel 0.72 (it explains WHO
  # the Spirit is, not how to LIVE in his power) — just under the gate.
  tlfr-believer-saint-esprit:
    thelife-fr:
      - "/croitre-dans-votre-relation-avec-dieu"   # rel 0.82 — letting the Spirit direct your life [gap-fix]
      - "/s-abandonner"               # rel 0.80 — surrender: "not my commitment, my self-abandon" [gap-fix]
      - "/la-force-dans-la-faiblesse" # rel 0.78 — "ask him by faith to fill you with his Spirit"  [gap-fix]
      - "/vivre-une-vraie-transformation"  # rel 0.75 — "God works in you to will and to do"       [gap-fix]
      - "/reconnaitre-la-voix-de-dieu"     # rel 0.75 — discerning the Spirit's voice              [gap-fix]

  # ── 8. tlfr-believer-mari-incroyant ── unbelieving husband, alone in her faith
  # existing 2 (cov 2/2). +2, both buried below rank 10 — this case's coverage will FALL.
  tlfr-believer-mari-incroyant:
