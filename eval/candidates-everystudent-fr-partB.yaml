  # ── 4 ────────────────────────────────────────────────────────────────────────
  # ⚠️ REPHRASED after the engine check. The first draft ("Comment un Dieu qui se dit amour
  # peut-il condamner quelqu'un à souffrir pour l'éternité ?") echoed the article's own
  # title and scored a soft 0.749 at rank 1 — a paraphrase, per Guardrail #1. The
  # proportionality framing below is how a skeptic actually puts the objection, and it is a
  # much harder test: `/a/726enfer.html` FALLS OUT OF THE TOP 8 ENTIRELY. That is a real
  # vocabulary gap (cf. the slice-#3 `jf-believer-disciple-making` gap), and the case is
  # kept in its honest form so the eval records it rather than hiding it.
  - id: "esfr-skeptic-enfer"
    language: "fr"
    # EN: "Infinite punishment for a finite life — how can that possibly be just?"
    question: "Un châtiment infini pour une vie finie, comment est-ce que ça peut être juste ?"
    relevant:
      everystudent-fr:
        - "/a/726enfer.html"        # rel 0.90 — "how can a God of love send people to hell?" (BURIED)
        - "/a/bonDieu.html"         # rel 0.76 — "is God good? then why suffering and evil?"
      thelife-fr:
        - "/10-questions-spirituelles-avec-reponses"  # rel 0.80 — Q10 is exactly this objection
  # ⛔ /a/700horribles.html is DELIBERATELY NOT CREDITED (Part A: relevance 0.82, soundness
  #    0.62 — the unevidenced "verbal abuse is worse" claim). It ranked 4 on the original
  #    phrasing, so the RAG serves it regardless: excluding it from the key protects the
  #    metric's honesty, not the reader. Content fix belongs on issue #123.
  # RETRIEVED (qwen, fr-scoped, 2026-07-27, REPHRASED question):
  #   1. 0.616 tlfr /10-questions-spirituelles-avec-reponses — EN: "10 spiritual questions answered"
  #   2. 0.616 esfr /a/260islam.html — EN: "Jesus in Islam"  (off-question)
  #   3. 0.611 esfr /a/723catholique.html — EN: "Catholic vs Christian?"  (off-question)
  #   4. 0.594 esfr /a/pourquoi-jesus-est-il-mort.html — EN: "Why did Jesus die?"
  #   — /a/726enfer.html did NOT appear in the top 8. On the softer phrasing it was rank 1 @ 0.749.

  # ── 5 ────────────────────────────────────────────────────────────────────────
  - id: "esfr-newcomer-trinite"
    language: "fr"
    # EN: "I'm told there is one God but also Father, Son and Spirit — how does that work?"
    question: "On me dit qu'il y a un seul Dieu mais aussi le Père, le Fils et l'Esprit — comment ça marche ?"
    relevant:
      everystudent-fr:
        - "/a/709trinite.html"      # rel 0.92 · soundness 0.90 — see the note below
        - "/a/708saintesprit.html"  # rel 0.78 — who the Holy Spirit is
  # ⓘ The question deliberately avoids the word "trinité" so this is not a title match.
  # ⓘ SOUNDNESS, worth recording: `/a/709trinite.html` is careful — "trois personnes de la
  #    même essence divine" — and it explicitly REJECTS the H2O and egg analogies for
  #    implying parts. No modalism, in direct contrast with slice #9's finding on the
  #    ARABIC Trinity explainer (#123). Doctrinal quality varies per language, not per ministry.
  # RETRIEVED (qwen, fr-scoped, 2026-07-27):
  #   1. 0.748 esfr /a/709trinite.html — EN: "How do you explain the Trinity?"
  #   2. 0.745 esfr /a/260islam.html — EN: "Jesus in Islam" (has a Trinity section; not credited —
  #      its "1x1x1=1" illustration is vacuous and the doc is an Islam apologetic, not a Trinity explainer)
  #   3. 0.622 esfr /a/708saintesprit.html — EN: "Who is the Holy Spirit?"
  #   5. 0.590 tlfr /le-saint-esprit-et-la-difference-qu-il-fait — EN: "The Holy Spirit and the difference he makes"

