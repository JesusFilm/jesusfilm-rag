# Slice #10 — Stage 4, PART B: 12 everystudent-fr-native golden cases
# PROPOSAL ONLY — nothing here reaches eval/qa-golden.yaml without operator approval
# (golden Guardrail #4).
#
# Targets content the 10 existing `tlfr-*` cases do NOT cover and Part A did not credit:
# world religions, purpose, death/afterlife, hell, the Trinity, self-image, sexuality,
# unanswered prayer, Islam, denominations, racism/women, marriage.
#
# Personas: newcomer ×3 · seeker ×5 · skeptic ×3 · believer ×1. The believer thinness is
# HONEST, not an oversight — everystudent-fr publishes seeker apologetics, not
# sanctification (Part A found it contributed zero credits to the Holy-Spirit and
# forgiveness cases).
#
# Every question was run through the wired Retriever fr-scoped before being finalised
# (golden Step 4 bootstrap check). TWO were rephrased after that check because the first
# draft echoed the article's own title — Guardrail #1; see the notes on cases 4 and 10.
#
# `language: "fr"` is pinned explicitly on every case, matching the esar-* convention.
# Credits: 39 total — 26 everystudent-fr + 13 thelife-fr.

part_b_cases:

  # ── 1 ────────────────────────────────────────────────────────────────────────
  - id: "esfr-newcomer-religions"
    language: "fr"
    # EN: "Don't all religions lead to the same God in the end?"
    question: "Toutes les religions ne mènent-elles pas au même Dieu, au fond ?"
    relevant:
      everystudent-fr:
        - "/a/205divin.html"        # rel 0.90 — describes Hinduism, Buddhism, Islam, Christianity, New Age
        - "/a/elephant.html"        # rel 0.88 — the blind-men-and-the-elephant argument, answered
        - "/a/700_religions.html"   # rel 0.85 — what makes Jesus different from the major faiths
        - "/a/107choisir.html"      # rel 0.78 — "why choose the God of the Bible?" (buried, rank >10)
      thelife-fr:
        - "/10-questions-spirituelles-avec-reponses"  # rel 0.75 — Q3 is "is Jesus the only way?"
  # RETRIEVED (qwen, fr-scoped, 2026-07-27) — EN translations for human verification:
  #   1. 0.670 esfr /a/205divin.html — EN: "A connection with the divine: the world's major religions"
  #   2. 0.663 esfr /a/elephant.html — EN: "The blind men and the elephant analogy"
  #   3. 0.653 tlfr /10-questions-spirituelles-avec-reponses — EN: "10 spiritual questions answered"
  #   4. 0.616 esfr /a/700_religions.html — EN: "What is the difference between Jesus and the major religions?"
  #   5. 0.572 tlfr /cinq-choses-que-la-science-ne-peut-prouver — EN: "Five things science cannot prove"

  # ── 2 ────────────────────────────────────────────────────────────────────────
  - id: "esfr-seeker-sens-vie"
    language: "fr"
    # EN: "I get up every morning not knowing what I'm for — does my life have any meaning?"
    question: "Je me lève chaque matin sans savoir à quoi je sers — est-ce que ma vie a un sens ?"
    relevant:
      everystudent-fr:
        - "/a/305but.html"          # rel 0.90 — "what is the purpose of my life?"
        - "/a/302changerdevie.html" # rel 0.82 — "have you ever said 'I hate my life'?"
        - "/a/philosophie.html"     # rel 0.78 — philosophers ask the real questions; what are the answers
        - "/a/507soif.html"         # rel 0.75 — the emptiness behind drinking and shallow company (buried)
  # RETRIEVED (qwen, fr-scoped, 2026-07-27):
  #   1. 0.674 esfr /a/305but.html — EN: "Do you want to know the purpose of your life?"
  #   2. 0.635 tlfr /10-questions-spirituelles-avec-reponses — EN: "10 spiritual questions answered"
  #   3. 0.631 esfr /a/302changerdevie.html — EN: "Changing your life: no longer saying 'I hate my life'"
  #   4. 0.616 esfr /a/philosophie.html — EN: "The value of philosophy"
  #   5. 0.582 tlfr /y-a-t-il-une-vie-apres-la-mort — EN: "Is there life after death?"

  # ── 3 ────────────────────────────────────────────────────────────────────────
  - id: "esfr-seeker-peur-mort"
    language: "fr"
    # EN: "I'm afraid of dying and I don't know what comes after — can anyone tell me?"
    question: "J'ai peur de mourir et je ne sais pas ce qu'il y a après — est-ce que quelqu'un peut me le dire ?"
    relevant:
      everystudent-fr:
        - "/a/608apres.html"        # rel 0.90 — "what happens when you die?"
        - "/a/611inevitable.html"   # rel 0.88 — facing the inevitable; life after death
        - "/a/725paradis.html"      # rel 0.78 — what heaven is like, is it real
      thelife-fr:
        - "/y-a-t-il-une-vie-apres-la-mort"  # rel 0.88 — "Is there life after death?"
  # RETRIEVED (qwen, fr-scoped, 2026-07-27):
  #   1. 0.743 esfr /a/608apres.html — EN: "What happens when you die?"
  #   2. 0.741 tlfr /y-a-t-il-une-vie-apres-la-mort — EN: "Is there life after death?"
  #   3. 0.723 esfr /a/611inevitable.html — EN: "The best approach when facing death"
  #   4. 0.618 tlfr /du-deuil-au-doute-au-dialogue — EN: "From grief, to doubt, to dialogue"
