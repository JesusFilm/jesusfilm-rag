#      settled atonement gap (§0.12). Recorded as corpus composition; not re-opened.
#      (/a/tkojebio.html is raw John excerpts with 'no added commentary'; the estate
#      excludes that class elsewhere. /a/razbijeni-tanjuri.html, 1,321 ch, IS the
#      invitation tail as a standalone video narration. Neither is a valid key.)
#
#   The other four ARE carried and were dropped only because 41 documents buy 5
#   cases. Recorded here so a future expansion does not re-derive them:
#      `bible-trust` → /a/bibliji.html ('Zašto možete vjerovati Bibliji', 28,569 ch,
#         19 chunks, the source's largest document; discovery 0.596 and the ONLY
#         candidate). Croatian has no Islam article, so the tahrif route (§0.12)
