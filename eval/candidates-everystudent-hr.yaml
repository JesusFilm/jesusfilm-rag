# Phase 5 PART B — golden suite DRAFT for `everystudent-hr` (Croatian, vrlovazno.com, 41 documents).
# Campaign #111, batch 2. Working record — NOTHING here has been written to
# eval/qa-golden.yaml. Guardrail #4 gates that on an explicit operator approval turn.
#
# Sizing: 41 ÷ 8 = 5.1 → 5 cases (§0.7 rule).
# Personas: skeptic 2 · newcomer 1 · seeker 1 · believer 1 — matches the §0.12 5-case row.
# Questions authored IN CROATIAN, not translated from the English menu (§0.6).
#
# ═══ CORPUS SHAPE — read this before judging any hit ═══
#   41 documents, ALL of them `/a/*.html` articles. **ZERO `/story/` testimonies.**
#   Testimony share 0% — the lowest-risk shape in the estate for failure mode #1.
#   Croatian nonetheless publishes four first-person accounts AS articles
#   (/a/ateistica.html, /a/izvor.html, /a/sawyer.html, /a/vatrom.html), so the
#   boilerplate tail is present; it just does not have a 20-document /story/ bucket
#   to ride on the way `hu` (24% testimony) does.
#   Under-1,200-char documents: **0** — no pure-tail documents (failure mode #2).
#   Shortest documents: /a/dobar.html 1,266 ch · /a/razbijeni-tanjuri.html 1,321 ch
#   · /a/collins.html 1,881 ch. All three are video transcripts.
#   Duplicate paths: 0. Duplicate titles: 0. Null-language documents: 0.
#
# ═══ 🔴 THE LANGUAGE-SWEEP CASUALTY IS CLEAN — VERIFIED, NOT ASSUMED ═══
#   Until 2026-07-31 this source had 30 documents mislabelled `sr` and 11 null, and
#   the whole `sr` bucket was fake (`everystudent-sr` was deferred and never acquired).
#   `.tmp-diag/phase5-openings.ts everystudent-hr` reports, on today's database:
#     ✅ every path resolves to exactly one document
#     ✅ no null-language documents
#     ✅ no duplicate titles
#     41 documents · 0 under 1,200 chars · 0 duplicate paths · 0 null-language
#   Every one of the 41 is `lang hr`. The sweep held. Nothing below rests on the
#   old labels.
#
# ═══ DISCOVERY ═══
#   .tmp-diag/phase5-partb-discover.ts everystudent-hr hr
#   → 32 distinct candidate documents of 41. Nine of the ten §0.7 topics reached an
#     own-source document; `jesus-death` did not reach one that answers it (below).
#   Every one of the 41 documents was then read from the database (title + opening
#   ~900 chars) before anything was credited — guardrail #5.
#
# ═══ ENGINE-CHECK ROUND LOG — .tmp-diag/phase5-check.ts hr hr ═══
#   Round 1: **1 paraphrase smell** (0.756, case 1) · 2 credits not in top 10 · 14 credits
#   Round 2: 0 paraphrase smells (max 0.748) · 1 credit not in top 10 · 13 credits
#            — case 1 reworded; the smell cleared but reach did not recover, and 0.748
#              sat two thousandths under the line.
#   Round 3: 0 paraphrase smells (max 0.739) · 1 credit not in top 10 · 13 credits
#            — case 1 reworded again to name the evidence DOMAINS. This pulled two
#              further own-source science documents into the top 10; both were read and
#              credited, taking case 1 to 5 credits.
#   Round 4 (final, --update): **0 paraphrase smells · max top score 0.738
#            · 15 credits · 1 credit outside the top 10, kept deliberately
#              (/a/stvaran.html — see kept_miss on case 1).**
#   ⓘ The round-3 and round-4 runs are the SAME questions and differ by 0.001
#     (0.739 → 0.738). That is embedding run-to-run jitter, not a change. Do not
#     read single-thousandth movements between runs as signal — §0.10 recorded the
#     same flapping on `esru-newcomer-krest`.
#   Verification (runs inside the script, cannot be skipped):
#     guardrail #8 §3 — 15/15 credited paths resolve to EXACTLY ONE document
#     guardrail #3a   — 0/15 credited documents have a null language
#   Only ONE question was reworded (case 1). The other four were right first time,
#   which is unusual for this campaign and is consistent with Croatian's 0.881
#   Phase-4 top score: retrieval here is strong and the questions did not have to
#   fight it.
#
# ═══ TOPICS DROPPED, AND WHY ═══
#   Five of the ten §0.7 topics are not used. Only ONE is a genuine content gap.
#
#   🔴 `jesus-death` — GENUINE CONTENT GAP. everystudent-hr has NO article whose
#      subject is what the cross accomplished. Discovery's top hit for it is
#      /a/osobno.html (0.582), which is the Four Spiritual Laws tract, and its
