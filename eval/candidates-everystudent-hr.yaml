#         'Hinduizam, Budizam, Islam, Kršćanstvo i New Age'. Discovery 0.619.
#      `trinity`    → /a/trojstvo.html ('Možete li objasniti Trojstvo?', 4,648 ch,
#         the 1x1x1=1 formulation). Discovery 0.641 — the highest topic score in the
