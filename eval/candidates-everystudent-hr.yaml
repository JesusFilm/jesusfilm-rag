#   Dropping `purpose` is what keeps the persona split legal: the 5-case row allows
#   one seeker, and `anxiety` was chosen over `purpose` because it exercises the
#   reverse title trap this source demonstrably carries (case 4).
#
# ═══ evidence_tier ═══
#   Proposed `llm-translated`. This is a fact about the REVIEWER, not the language —
#   nobody available reads Croatian. If someone on the team does and can sanity-check
#   the glosses, it should be `human-verified`. OPERATOR TO CONFIRM.

cases:

  # ── 1 ──────────────────────────────────────────────────────────────── skeptic
  - id: "eshr-skeptic-pobozna-zelja" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "Prijatelji mi govore da je vjera u Boga samo pobožna želja, nešto što si ljudi umisle jer im tako odgovara. Postoji li išta provjerljivo — u prirodi, u znanosti, bilo gdje — na čemu bi se takva vjera mogla temeljiti?"
    en: "My friends tell me that faith in God is just wishful thinking, something people talk themselves into because it suits them. Is there anything checkable — in nature, in science, anywhere — that such a faith could rest on?"
    credits:
      - { path: "/a/ateistica.html", en: "How an atheist woman found God (Marilyn Adamson) — 'For the first few months I asked myself: do I really believe in God? And why? Then I would methodically go back over the FIVE OBJECTIVE REASONS why I believed God exists. My faith in God did not rest on feelings but on facts and evidence.' Rank 1 in all four rounds. It answers the 'wishful thinking' charge from the inside — a former atheist stating that her reasons were objective ones she could re-check.", rank: 1, score: 0.738 }
      - { path: "/a/postoji.html", en: "Does God exist? SIX DIRECT REASONS for holding that God really exists (Marilyn Adamson, 18,867 ch) — the source's flagship apologetics article. Opens by refusing the 'you just have to believe' move: 'No pressure. No statements like: you just have to have faith.'", rank: 2, score: 0.708 }
      - { path: "/a/prirode.html", en: "Scientists astonished by the laws of nature (7,693 ch) — 'Why are the laws of nature so unchanging? Your coffee left on the table will always go cold. Gravity stays stable, and not by chance. The speed of light stays constant.' Cosmologist Sean Carroll is quoted, then the principle of universality. This is the 'in nature' half of the question answered directly.", rank: 5, score: 0.673 }
      - { path: "/a/svemir.html", en: "Did God create the universe? (8,137 ch) — 'Scientists confirm the Big Bang theory and a beginning of the universe… something outside time, outside space and outside matter caused all of it to come into being.' Edwin Hubble's 1920s observation, and why a beginning is a hard result for non-theistic scientists. The 'in science' half of the question.", rank: 8, score: 0.671 }
      - { path: "/a/stvaran.html", en: "Is God real? (4,356 ch) — the DNA article. Antony Flew, one of the leading spokesmen for atheism, on video in December 2004: 'a super-intelligence is the only satisfying explanation for the origin of life and the complexity of nature', then DNA laid alongside a computer program's ones and zeros. 🔴 KEPT DELIBERATELY THOUGH IT DOES NOT RETURN — see kept_miss.", rank: NOT IN TOP 10 }
    kept_miss: |
      🔴 THE ONE CREDIT THAT DOES NOT RETURN, AND WHY IT IS KEPT (guardrail #8 §2).
      /a/stvaran.html is this source's DNA-and-Antony-Flew article — the single most
      on-point document for a question that explicitly asks whether there is anything
      checkable in science. It stayed outside the top 10 in ALL THREE rounds, including
      the round whose whole purpose was to reach it.

      WHAT MAKES THIS WORTH RECORDING RATHER THAN PAPERING OVER: round 3 added
      'u prirodi, u znanosti' ('in nature, in science') to the question, and the science
      shelf DID respond — /a/prirode.html came in at rank 5 (0.674) and /a/svemir.html
      at rank 8 (0.671), neither of which had been in the top 10 before. So the engine
      is not deaf to the science framing. It surfaces the laws-of-nature article and the
      Big-Bang article and still will not surface the DNA article. Croatian is the
      sharpest instance in the campaign of the `hu` /a/dns.html finding (§0.12), because
      here the miss survives a question written specifically to reach it.

      A PLAUSIBLE MECHANICAL READING, offered as a hypothesis not a conclusion:
      /a/stvaran.html is 4,356 chars in 3 chunks, against 7,693/5 for prirode and
      8,137/5 for svemir. Fewer chunks is fewer shots at the top 10. If the operator
      wants this tested, the cheap probe is whether short documents systematically
      under-return across the batch — not a Croatian question.

      This case therefore scores coverage 4/5 ON PURPOSE, the same treatment
      `eshu-skeptic-vagyalom` and `esbg-skeptic-katastrofa` were given.
    reworded: |
      ⚠️ REWORDED TWICE. Round 1 carried THE ONLY PARAPHRASE SMELL IN THE SUITE, and it
      was not on the case anyone would have predicted.
      v1: "…Postoji li iza toga ijedna činjenica ili je doista sve samo osjećaj?"
          ("…Is there a single fact behind it, or is the whole thing really just a
          feeling?")
          → top **0.756 🔴 SMELL**, and a clean example of guardrail #1. It restates
          /a/ateistica.html's own sentence nearly word for word: 'Moja vjera u Boga nije
          se oslanjala na osjećaje već na činjenice i dokaze' — 'my faith in God did not
          rest on FEELINGS but on FACTS and evidence'. The question had borrowed the
          article's own fact-versus-feeling contrast.
          It also had a REACH failure at the same time: 2 of 4 credits missed.
      v2: drops the fact/feeling contrast, keeps the menu's 'wishful thinking', and asks
          for something CHECKABLE the belief could rest on — §0.12 failure mode #5,
          which says asking for grounds beats emotional framing.
          → **0.756 → 0.748. Smell cleared but reach did not recover**: /a/stvaran.html
          was still outside the top 10, and 0.748 sits two thousandths under the line,
          close enough to flap between runs.
      v3 (kept): names the domains the asker would accept — 'u prirodi, u znanosti,
          bilo gdje' ('in nature, in science, anywhere') — and drops v2's trailing
          'or is it just what we would like to be true'.
          → **0.748 → 0.739**, further clear of the line, /a/postoji.html rank 4 → 2,
          and TWO NEW own-source science documents entered the top 10 and were then
          credited on their text (/a/prirode.html r5, /a/svemir.html r8).
          🟢 THE RARE ROUND WHERE SMELL AND REACH MOVED THE SAME WAY. §0.12 warns they
          usually pull in opposite directions; naming the evidence DOMAINS rather than
          restating the claim is what let both improve at once. Worth trying elsewhere.
    rejected:
      - { path: "/a/cudo.html", rank: 3, why: "'Why does God not perform a spectacular miracle and prove his existence?' (3,445 ch) — rank 3 across all three rounds and rejected every time. Its subject is God's RETICENCE: why he does not overwhelm people with undeniable proof. That is a different objection from 'is there any checkable ground at all'. Same call `hu` made on /a/csodat.html." }
      - { path: "/a/koronavirus.html", rank: 4, why: "the anxiety article — credited to case 4. It reaches rank 4 here because one of its chunks recounts Marilyn Adamson studying the evidence for God for eighteen months; the document's subject is still anxiety." }
      - { path: "/a/bibliji.html", rank: 6, why: "'Why you can trust the Bible' — the bible-trust answer document (see the dropped-topics list in the header). Genuinely evidential, but it argues for the reliability of a TEXT, which is the next question along, not this one." }
      - { path: "/a/molitve.html", rank: 7, why: "credited to case 5" }
      - { path: "/a/savrsenog.html", rank: 9, why: "credited to case 3" }
      - { path: "/a/povezati.html", rank: 10, why: "the world-religions article (the `religions` answer document, dropped for budget) — a comparison piece, not an argument that God exists" }
    note: |
      ⓘ CROATIAN HAS THE ESTATE'S DEEPEST god-exists SHELF RELATIVE TO ITS SIZE.
      Nine of the 41 documents sit in the 'Božje postojanje' (God's existence)
      category: /a/postoji.html, /a/ateistica.html, /a/stvaran.html, /a/prirode.html,
      /a/svemir.html (Big Bang), /a/postojanje.html (three arguments, video),
      /a/collins.html (Francis Collins on the gravitational constant, video), /a/tkoje.html
      and two parts of the cosmological chain. FIVE of the nine are credited here and a
      sixth (/a/cudo.html) is a considered rejection, which is why this case carries more
      credits than any other in the suite. This is also why Croatian topped the Phase-4
      smoke run at 0.881 — the shelf is dense, not the engine lucky.

      ⚠️ FOR THE REVIEWER: five credits on one case is the top of the range for a 5-case
      suite. If a leaner key is wanted, /a/prirode.html and /a/svemir.html are the two to
      cut — they answer the question's 'in nature, in science' clause specifically rather
      than the wishful-thinking objection, and cutting them returns this case to the
      3-credit shape the other four cases use. I kept them because the question does
      explicitly ask for them.
    top_score: 0.738

  # ── 2 ──────────────────────────────────────────────────────────────── skeptic
  - id: "eshr-skeptic-nesreca" # topic: suffering
    persona: skeptic
    topic: suffering
    q: "Prošle godine mi je prijatelj poginuo u nesreći. Otad mi nitko nije uspio objasniti kako to uopće ide zajedno s dobrim Bogom koji je to mogao spriječiti."
    en: "A friend of mine died in an accident last year. Since then nobody has managed to explain to me how that goes together at all with a good God who could have prevented it."
    credits:
      - { path: "/a/tragedije.html", en: "Where is God in the middle of tragedy? (Marilyn Adamson, 11,133 ch) — 'Have you ever asked: God, where are you? What exactly can we expect from God?' The closest document in the source to the asker's situation.", rank: 3, score: 0.702 }
      - { path: "/a/zasto.html", en: "Why is life so hard? (7,896 ch) — 'Why do people get cancer? Why do earthquakes destroy whole cities?' Then the wake-up events: our parents separate, the girl down the street gets pregnant at 16, a family member gets cancer.", rank: 2, score: 0.715 }
      - { path: "/a/stovati.html", en: "Why worship a God who permits evil? (5,000 ch) — a Q&A article built on the hardest case the estate states anywhere: 'Why worship a God who allows evil such as the rape of a child?' Answers on human freedom and on God not being to blame for what people choose.", rank: 6, score: 0.681 }
      - { path: "/a/dobar.html", en: "Is God good? (1,266 ch, 1 chunk) — a video transcript: 'Is God good? If he is, why is there suffering and evil?' The free-will theodicy worked through with square circles and one-sided sticks. Croatian twin of the Hungarian /a/jo.html and the Bulgarian 'Добър ли е Бог?', both credited for this same topic.", rank: 1, score: 0.734 }
    rejected:
      - { path: "/a/koronavirus.html", rank: 4, why: "the general anxiety article — credited to case 4. Its subject is living with anxiety, not why a good God permits a death." }
      - { path: "/a/sawyer.html", rank: 5, why: "'How we can have life after death' — Steve Sawyer's account of living under a terminal diagnosis. Its subject is personal hope in the face of death, not the theodicy question. Same call `hu` made on its own /a/sawyer.html at rank 2 and `ru` on /a/steysi1.html." }
      - { path: "/a/ateistica.html", rank: 7, why: "credited to case 1" }
      - { path: "/a/paklu.html", rank: 8, why: "'Can good people end up in hell?' — judgment and God's standard, a different question" }
      - { path: "/a/savrsenog.html", rank: 9, why: "credited to case 3" }
      - { path: "/a/molitve.html", rank: 10, why: "credited to case 5" }
    note: |
      ⚠️ /a/dobar.html IS THE SHORTEST DOCUMENT IN THE SOURCE (1,266 ch) AND IS STILL
      NOT A PURE TAIL. The openings script flags everything under 1,200 chars and
      flagged nothing here. Read, it is a complete free-will argument in miniature —
      the same call `hu` made on its 1.5k twin /a/jo.html. Recorded explicitly because
      failure mode #2 says never credit a short document without reading it; this one
      was read.
    top_score: 0.734

  # ── 3 ─────────────────────────── newcomer 🔴 TWO TITLE TRAPS IN ONE CASE
  - id: "eshr-newcomer-maglovita-sila" # topic: know-god
    persona: newcomer
    topic: know-god
    q: "Kad netko spomene Boga, meni na pamet padne samo neka maglovita sila negdje gore. Kakav je zapravo Bog i može li se njega uopće osobno upoznati?"
    en: "When someone mentions God, all that comes to my mind is some hazy force somewhere up there. What is God actually like, and can he even be known personally?"
    rejected:
      - { path: "/a/osobno.html", rank: 3, why: "'Osobno poznavati Boga' — the FOUR SPIRITUAL LAWS tract ('First principle: God loves you and has a wonderful plan for your life'), not a description of what God is like. It is the estate's /a/personally.html shape from Part A and it is boilerplate by construction. Rank 3 for a know-god question is exactly the §0.9 tail behaviour, and it is REJECTED on its text. `hu` made the identical call on /a/isten-szemelyes-megismerese.html." }
      - { path: "/a/tragedije.html", rank: 4, why: "credited to case 2. Its opening does run 'Who is God? God is the Creator of the universe who longs for you to know him', which is why it reaches rank 4 — but its subject is God in tragedy." }
      - { path: "/a/postoji.html", rank: 5, why: "credited to case 1 — whether God exists, not what he is like" }
      - { path: "/a/svemir.html", rank: 9, why: "'Did God create the universe?' — the Big Bang article. A god-exists document." }
    credits:
      - { path: "/a/tkoje.html", en: "Who is God? What is he like? Here are SIX CHARACTER TRAITS of God (4,585 ch) — 'He can be known. It is possible to know the God who created the universe… not only can we know facts about him, we can know him personally and intimately.' The Croatian member of the estate's six-attributes family (Russian /a/ktoeto.html, Hungarian /a/milyen.html, Bulgarian 'Защо можем да разчитаме на Бог?').", rank: 2, score: 0.694 }
      - { path: "/a/savrsenog.html", en: "🔴 TITLE TRAP. Titled 'Pronalazak savršenog Boga' — 'Finding the perfect God' — which reads as a conversion story. The body (16,205 ch) is an ENUMERATED ATTRIBUTES LIST: '1. Longing for God; God is greater than us… 2. Longing for God; God can be known personally…' This is the source's SECOND what-is-God-like article and the systematic §0.12 trap in its Croatian form.", rank: 1, score: 0.732 }
      - { path: "/a/tko.html", en: "🔴 TITLE TRAP, THE DANGEROUS KIND. Titled simply 'Tko?' ('Who?') — one letter from /a/tkoje.html's 'Tko je Bog?'. It is NOT a what-is-God article: it is PART 4 of the four-part cosmological chain, and it opens 'This is a continuation of the article Što?'. It is credited anyway because its actual content is the personhood argument: the Eternal Someone is transcendent, exists outside space and time, is therefore invisible, and 'has personality and will'. That is precisely the 'is he even someone' half of the question. Same call `hu` made on /a/kicsoda2.html.", rank: 6, score: 0.638 }
    the_finding: |
      🔴 CROATIAN CARRIES THE FOUR-PART COSMOLOGICAL CHAIN, AND ITS TITLES ARE WORSE
      THAN ANY SOURCE ON RECORD.

        /a/nista.html   'U početku bijaše... ništa?'  ('In the beginning there was… nothing?')
        /a/nesto.html   'Nešto'                        ('Something')      → continues nista
        /a/sto.html     'Što?'                         ('What?')          → continues nesto
        /a/tko.html     'Tko?'                         ('Who?')           → continues sto

      §0.12 lists this chain for `hu` `pl` `mn` `sk` `pt` `es` `fa` `cs`. Croatian makes
      it worse in one specific way: part 4 is titled **'Tko?'** while a completely
      different document — the six-attributes article — is titled **'Tko je Bog?'**.
      Two documents, three characters apart, one a cosmological argument and one the
      know-god article. A title-keyed tool or a title-only reviewer picks wrong here on
      a coin flip. This is the concrete Croatian case for guardrail #8 §3 and for the
      §0.12 rule that credits are declared by PATH.

      🟢 AND THE SAME CASE CONTAINS THE OPPOSITE TRAP: /a/savrsenog.html's title names
      no attributes at all and its body is nothing but attributes. Both directions,
      one case, one source.
    note_no_reword: |
      ⓘ NO REWORD NEEDED, AND THAT WAS NOT THE PREDICTION. Before measuring, this case
      looked like the likeliest smell in the suite: the §0.7 variant-B framing is close
      to /a/tkoje.html's own subtitle ('Tko je Bog? Kakav je on?') and to its first
      attribute heading ('Može ga se upoznati'). Measured, it came in at **0.732, clear
      of 0.75**, with all three credits at ranks 1, 2 and 6. The smell landed on case 1
      instead. §0.12 failure mode #6 in the other direction: a question that looks
      dangerous can be fine, and the one that looked safe was the one that smelled.
      Recorded because guessing at smells without running the check is how batch-1
      agents wasted rounds.
    top_score: 0.732

