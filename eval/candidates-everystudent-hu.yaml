# Phase 5 PART B — golden suite DRAFT for `everystudent-hu` (83 documents).
# Campaign #111, tier A. Working record — NOTHING here has been written to
# eval/qa-golden.yaml. Guardrail #4 gates that on an explicit operator approval turn.
#
# Sizing: 83 ÷ 8 = 10.4, capped at 10 → 10 cases (§0.7 rule).
# Personas: skeptic 4 · newcomer 3 · seeker 2 · believer 1 — matches §0.7 exactly.
# Topics: all ten of the §0.7 approved menu, one case each.
# Questions authored IN HUNGARIAN, not translated from the English menu (§0.6).
#
# CORPUS SHAPE — read this before judging any hit
#   83 documents = 63 `/a/*.html` articles + 20 `/story/*.html` personal testimonies.
#   ⚠️ 24% of this source is TESTIMONY. That is a much higher share than `ru` or `bg`,
#   and it shows: `/story/Atti.html` alone appears in the top 10 of FIVE of the ten
#   cases, and no case credits a single `/story/` document. See the SUMMARY.
#   Null-language documents: 0 of 83 (guardrail #3a — nothing excluded).
#   Duplicate titles: 0 (the hazard that bit `bg` does not exist here).
#
# DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-hu hu
#   → 53 distinct candidate documents of 83, all ten topics covered.
# Every one of the 63 articles was then read from the database (title + opening
# ~900 chars) before anything was credited — guardrail #5, and specifically because
# of the boilerplate-tail trap recorded in §0.9. Judging by title would have been
# wrong in BOTH directions on this source; see the two traps below.
#
# ENGINE-CHECKED THREE TIMES (guardrail #8 §2) — .tmp-diag/phase5-hu-check.ts
#   Round 1: 2 paraphrase smells · 7 credits not returned · 30 credits
#   Round 2: 2 paraphrase smells · 0 credits not returned · 27 credits
#   Round 3: **0 paraphrase smells** (max top score 0.744) · **1 credit not returned**
#            — and that one is a DELIBERATE keep, see `vagyalom` below.
#   Round 2 is why there were three rounds: fixing case 1's REACH over-corrected it
#   into a 0.832 restatement. Reach and smell pull in opposite directions and one
#   round cannot settle both.
#
# MECHANICAL CHECKS — both green, run inside the check script so they cannot be skipped
#   Guardrail #8 §3: all 27 credited paths resolve to EXACTLY ONE document — 27/27.
#   Guardrail #3a:   no credited document has a null language — 27/27.
#
# ⚠️ ONE DELIBERATE DEVIATION FROM THE `bg` CHECK SCRIPT, AND WHY.
#   `phase5-bg-check.ts` declares credits by TITLE and resolves them to paths, because
#   `bg`'s paths are 150–250 char percent-encoded Cyrillic. everystudent-hu is the
#   OPPOSITE shape: paths are short plain ASCII (`/a/letezik.html`) while the TITLES
#   carry Hungarian curly quotes („ ”), en dashes (–) and long accented strings. Here
#   the title is the transcription risk, so credits are declared by PATH and titles are
#   resolved from the database. The safety property the `bg` rule exists for is kept and
#   strengthened: the script asserts every key resolves to exactly one non-null-language
#   document and fails loudly otherwise.
#
# evidence_tier: proposed `llm-translated` (nobody available reads Hungarian). This is a
# fact about the REVIEWER, not the language — if anyone on the team reads Hungarian and
# can sanity-check the translations, it should be `human-verified`. OPERATOR TO CONFIRM.

cases:

  # ── 1 ─────────────────────────────────────────── skeptic ⚠ SEE THE KEPT MISS
  - id: "eshu-skeptic-vagyalom"               # topic: god-exists
    persona: skeptic
    q: "A barátaim szerint az istenhit csak vágyálom. Van bármi tényleges, ami alátámasztja, vagy tényleg csak érzés az egész?"
    en: "My friends think believing in God is just wishful thinking. Is there anything factual that backs it up, or is the whole thing really just a feeling?"
    top_score: 0.744                          # clear of 0.75
    credits:
      - {path: "/a/ateista.html",     rank: 1, score: 0.744, en: "How an atheist found God — Marilyn Adamson: 'I methodically examined five OBJECTIVE reasons for believing God exists… I realised my belief was not emotional.' Answers the 'just a feeling' half of the question head-on."}
      - {path: "/a/bizonyitani.html", rank: 2, score: 0.720, en: "Can you prove God exists? — Gregory Ganssle, PhD, on why 'you can't prove it' is itself a dogma"}
      - {path: "/a/utmutato.html",    rank: 4, score: 0.704, en: "A guide to finding faith — written at the agnostic who would rather not look"}
      - {path: "/a/letezik.html",     rank: 6, score: 0.697, en: "Does God exist? Six arguments that he does (Marilyn Adamson) — the source's flagship apologetics article, 23.5k chars, argued as courtroom evidence"}
      - {path: "/a/dns.html",         rank: "NOT IN TOP 10", en: "Does God exist? What does our DNA say about it? — Antony Flew's reversal, DNA as a written program. 🔴 KEPT DELIBERATELY, see below."}
    kept_miss: |
      🔴 THE ONE CREDIT THAT DOES NOT RETURN, AND WHY IT IS KEPT (guardrail #8 §2).
      `/a/dns.html` is the source's SCIENTIFIC-EVIDENCE article — the British philosopher
      Antony Flew, a leading spokesman for atheism, concluding that "the only acceptable
      explanation for the origin of life is some kind of superior intelligence", then DNA
      as a written computer program. The question explicitly asks whether there is anything
      FACTUAL. This document is the factual answer. On reflection it does not answer a
      different question, so DROPPING it would be dishonest — I KEPT it.

      What it measures: for a question that asks for facts, the engine returns
      `/story/Agi.html` at rank 3 (0.715), `/a/sawyer.html` at rank 7 (0.693) and
      `/a/blues.html` at rank 8 (0.692) — three personal testimonies — ahead of the
      science article. This case will score coverage 4/5, on purpose. It is the same
      treatment `esbg-skeptic-katastrofa` got in §0.11.

      ⚠️ It is a BOUNDARY credit and its result will flap. In round 2 it returned at
      rank 9 / 0.724; the round-3 reword pushed it just outside k=10. Do not read a
      future 5/5 or 4/5 as a change in the engine — §0.10 recorded the same tie-reorder
      flapping on `esru-newcomer-krest`.
    reworded: |
      ⚠️ REWORDED TWICE — this case cost more work than the other nine combined, and the
      reason is worth keeping: REACH and SMELL pull in opposite directions.
      v1: "…csak vágyálom azoknak, akik nem bírják el a valóságot."
          ("…wishful thinking for people who can't cope with reality")
          → top 0.651, no smell, but only 1 of 5 credits returned. The "can't cope with
          reality" clause dragged the whole top 10 into emotional-coping and meaning
          documents — rank 1 was `/a/blues.html`, the DEPRESSION testimony. All four
          apologetics articles missed. A question-design defect, not a corpus defect.
      v2: "…van egyáltalán tárgyilagos érv amellett, hogy Isten létezik?"
          ("…is there any objective argument at all that God exists?")
          → top 0.832 🔴 PARAPHRASE SMELL, 5 of 5 credits returned at ranks 1,2,3,6,9.
          It restates BOTH `/a/bizonyitani.html`'s title ("Can you prove God exists?")
          and `/a/letezik.html`'s. Fixing reach broke smell.
      v3 (kept): drops the coping clause, keeps the menu's "wishful thinking", and asks
          for fact-versus-feeling instead of for an argument that God exists.
          → **0.744, clear of 0.75, 4 of 5 credits returned.** The cost is `/a/dns.html`.
    rejected:
      - {path: "/story/Agi.html",   rank: 3, why: "personal testimony — and the clearest specimen on this source of testimonies outranking argument"}
      - {path: "/a/csodat.html",    rank: 5, why: "why God does not perform a stunning miracle — a different objection (credited to no case; it is about God's reticence, not about evidence)"}
      - {path: "/a/sawyer.html",    rank: 7, why: "Steve Sawyer's HIV testimony — hope under a terminal diagnosis"}
      - {path: "/a/blues.html",     rank: 8, why: "'Ninth-floor blues' — addiction, emotional pain, suicidal thoughts. Was RANK 1 for v1 of this question. See the SUMMARY: third language in which this same article misfires."}
      - {path: "/a/kapcsolat.html", rank: 9, why: "what a relationship with God means — a boilerplate-adjacent 'begin here' page"}
      - {path: "/a/forrasa.html",   rank: 10, why: "Josh McDowell testimony — credited to case 4, where its subject (the search for meaning) actually lies"}

  # ── 2 ──────────────────────────────────────────── newcomer 🔴 TITLE TRAP HERE
  - id: "eshu-newcomer-milyen"                # topic: know-god
    persona: newcomer
    q: "Ha valaki azt mondja, hogy „Isten”, nekem valami ködös energia jut eszembe valahol fent. Ő egyáltalán személy?"
    en: "When someone says 'God', what comes to my mind is some hazy energy somewhere up there. Is he even a person?"
    top_score: 0.710
    credits:
      - {path: "/a/tokeletes.html", rank: 1, score: 0.710, en: "Seeking — and finding — the 'perfect God'. 🔴 TITLE TRAP: the title ('Keresni – és megtalálni') names no subject at all. The body is an enumerated list of God's attributes — '1. The perfect God — a God greater than us…' — i.e. this IS the what-is-God-like article. A title-based reviewer files it under conversion. Fourth source, fourth title trap."}
      - {path: "/a/milyen.html",    rank: 2, score: 0.654, en: "What might God be like? — 'Who is God? What is he like? SIX PERSONALITY TRAITS characteristic of God': knowable, approachable… The Hungarian twin of the Russian /a/ktoeto.html and the Bulgarian 'Защо можем да разчитаме на Бог?'"}
      - {path: "/a/kicsoda2.html",  rank: 4, score: 0.649, en: "Who 2. — part 4 of the cosmological series; this is where the 'Eternal Someone' is argued to be a PERSON and not a machine, and where God's invisibility is handled ('God is spirit… the invisible God'). Answers 'is he even a person' directly."}
    rejected:
      - {path: "/a/no.html",     rank: 3, why: "'Could God be a woman?' — its subject is God's GENDER and how he chose to reveal himself, not whether he is personal. Close, and rejected on the text."}
      - {path: "/a/kicsoda.html", rank: 5, why: "'Who' — part 3 of the same series, but its subject is whether the Eternal Something is ONE or MANY, which is a god-exists question. The personhood conclusion is in Who 2, which IS credited. Crediting both would credit the argument twice."}
      - {path: "/a/iszlam.html", rank: 6, why: "Jesus and Islam — credited to case 7"}
      - {path: "/a/faj.html",    rank: 7, why: "where is God when it hurts — credited to case 3"}
      - {path: "/story/Davidski.html", rank: 9, why: "personal testimony"}
      - {path: "/story/Agi.html",      rank: 10, why: "personal testimony"}
    note: |
      ⓘ FOUR DOCUMENTS ON THIS SOURCE ARE UNJUDGEABLE BY TITLE BY CONSTRUCTION.
      `/a/semmi.html` ("Was there ever nothing?") → `/a/valami.html` ("Something") →
      `/a/kicsoda.html` ("Who") → `/a/kicsoda2.html` ("Who 2.") are a FOUR-PART
      cosmological argument published as separate documents with sequential titles that
      name no subject. Only the last one is credited, and only because its body was read.

  # ── 3 ─────────────────────────────────────────────────────────────── skeptic
  - id: "eshu-skeptic-baleset"                # topic: suffering
    persona: skeptic
    q: "Tavaly meghalt egy barátom egy balesetben. Azóta sem tudom összerakni magamban, hogy ez hogyan fér össze egy jóságos Istennel."
    en: "A friend of mine died in an accident last year. I still cannot square that in my own head with a good God."
    top_score: 0.726
    credits:
      - {path: "/a/miert.html",  rank: 1, score: 0.726, en: "Why is life so hard? — 'Why does someone get cancer? Why do earthquakes destroy whole cities?' Then: the girl next door is abducted, a relative gets cancer. The closest match to the asker's situation."}
      - {path: "/a/szornyu.html", rank: 3, score: 0.706, en: "Why worship a God who allows terrible things? — framed around a child being raped and around war"}
      - {path: "/a/jo.html",     rank: 4, score: 0.700, en: "Is God really good? — a 1.5k video transcript: 'If he is, why is there so much suffering and evil?' The free-will theodicy, square circles and all. Hungarian twin of the Bulgarian 'Добър ли е Бог?' and the Chinese /a/isgodgood.html, which was RANK 1 for the Chinese version of this question in Part A."}
      - {path: "/a/faj.html",    rank: 7, score: 0.694, en: "Where is God when it really hurts? (Marilyn Adamson) — 14.8k chars; 'disasters and free will' is its own section"}
    rejected:
      - {path: "/a/sawyer.html",     rank: 2, why: "RANK 2 AND REJECTED — Steve Sawyer's HIV testimony. Its subject is how he personally kept hope, not why a good God allows it. Same call as the Russian /a/steysi1.html."}
      - {path: "/a/ateista.html",    rank: 5, why: "atheist's conversion testimony — credited to case 1"}
      - {path: "/a/koronavirus.html", rank: 6, why: "the anxiety article — credited to case 5"}
      - {path: "/a/emberek.html",    rank: 8, why: "'Can good people go to hell?' — judgment, a different question. NOTE: unlike everystudent-es (§0.9), this source DOES carry a hell article; it simply is not the answer here."}
      - {path: "/a/tokeletes.html",  rank: 9, why: "the know-god article — credited to case 2"}
      - {path: "/story/Atti.html",   rank: 10, why: "personal testimony"}
    dropped_after_engine_check:
      - {path: "/a/isten-segitsege.html", why: "'God's help in hard times' — a 6.4k VIDEO TRANSCRIPT of /a/faj.html (14.8k), which is already credited; the two openings are near-identical ('When tragedy strikes we often ask: God, where are you?'). It fell outside the top 10. Crediting a document and its own abridged video twin measures the same text twice and inflates the denominator. Dropped rather than credited-and-missed."}

  # ── 4 ───────────────────────────────────────────────────────────────── seeker
  - id: "eshu-seeker-uresen"                  # topic: purpose
    persona: seeker
    q: "Minden napom ugyanúgy telik, és este azzal fekszem le, hogy semmi nem maradt belőle. Mi értelme az egésznek?"
    en: "Every day of mine passes the same way, and at night I go to bed feeling nothing remained of it. What is the point of any of it?"
    top_score: 0.660
    credits:
      - {path: "/a/celom.html",    rank: 1, score: 0.660, en: "What is my purpose in life? — the hammer parable, told at length"}
      - {path: "/a/valddi.html",   rank: 2, score: 0.636, en: "Real life — three people who reached the summit and were still empty (the mountaineer, the Champions League winner, the graduate)"}
      - {path: "/a/forrasa.html",  rank: 5, score: 0.593, en: "The source of a changed life (Josh McDowell) — 'Who am I? Why am I here? Where is my life going?' Hungarian twin of the Spanish /articulos/lafuente.html, the Russian /a/istochnik.html and the Bulgarian 'Казвали ли сте си някога „мразя живота си“?', all credited for this same question shape"}
      - {path: "/a/filozofia.html", rank: 7, score: 0.582, en: "The value of philosophy — 'Why are we here? What is our purpose? What brings fulfilment, what gives life meaning?' (Socrates, Plato, Peter Kreeft)"}
    rejected:
      - {path: "/story/Aron.html",   rank: 3, why: "personal testimony. Its closing block LINKS to 'Mi a célom az életben?' — link furniture, not an answer."}
      - {path: "/a/blues.html",      rank: 4, why: "'Ninth-floor blues' — addiction, emotional pain, suicidal thoughts. ⚠ THIRD LANGUAGE, SAME MISFIRE: the Spanish /articulos/blues.html and the Russian /a/sigaretoy.html both retrieved for the EMPTINESS question rather than a depression one. Now Hungarian. Three sources, one quirk."}
      - {path: "/a/szepseg.html",    rank: 6, why: "a fashion model on lasting beauty and self-esteem. Same call as the Russian /a/krasoti.html."}
      - {path: "/story/Balint.html", rank: 8, why: "personal testimony"}
      - {path: "/a/csakra.html",     rank: 9, why: "anxiety — credited to case 5"}
      - {path: "/a/ateista.html",    rank: 10, why: "credited to case 1"}
    dropped_after_engine_check:
      - {path: "/a/szomjadat.html", why: "'Quench your real thirst' — the title reads like a meaning article and the discovery pass surfaced it, but the body is about binge DRINKING with mates and the craving for real friendship behind it. Its subject is not life purpose. It fell outside the top 10 and, on reading, correctly so. Dropped."}

  # ── 5 ───────────────────────────────────── seeker 🔴 REVERSE TITLE TRAP HERE
  - id: "eshu-seeker-szorongas"               # topic: anxiety
    persona: seeker
    q: "Szinte állandóan szorongok, akkor is, amikor épp semmi konkrét bajom nincs. Kínál erre a hit bármit is?"
    en: "I am anxious almost constantly, even when nothing specific is actually wrong. Does faith offer anything at all for that?"
    top_score: 0.677
    credits:
      - {path: "/a/koronavirus.html", rank: 1, score: 0.677, en: "Coronavirus — what do we do with our fears? (Marilyn Adamson). 🔴 REVERSE TITLE TRAP: the TITLE is 'Fear of coronavirus', which reads as a dated 2020 piece a reviewer would strike out. The BODY broadens in its third paragraph and never goes back: 'perhaps other things are what really worry you… terrorism, climate change, racism, war, poverty, harassment, trafficking, natural disasters, money troubles, illness, job insecurity, difficult relationships, addictions.' 19.6k chars and it is this source's general ANXIETY article."}
      - {path: "/a/beke.html",        rank: 2, score: 0.645, en: "Peace of mind in an uncertain world — 'whatever the future holds, it is possible to live without worry and fear'"}
      - {path: "/a/csakra.html",      rank: 3, score: 0.630, en: "Anxiety and chakra healing — Rachel Fatyanov, who was lonely, depressed and increasingly anxious, went through Buddhism/Zen, yoga, New Age and occult practice, horoscopes, mediums, palm readers, crystal-energy healing and a ~USD200 course, and what she found instead. ⚠ A TITLE-ONLY reviewer rejects this as New Age content. Its subject IS chronic anxiety. Hungarian twin of the Russian /a/chakr.html, credited there for this same question."}
    the_finding: |
      🟢 THIS CASE IS THE CLEANEST DEMONSTRATION IN THE CAMPAIGN THAT TITLES ARE UNUSABLE.
      Its rank-1 and rank-3 credits are BOTH documents a title-only reviewer would strike:
      one looks like an expired pandemic notice, the other looks like New Age promotion.
      Read, they are the two best anxiety documents in the source. Meanwhile the two
      rank-1 hits REJECTED elsewhere in this suite (`/a/forrasa.html` for the cross,
      `/story/Agi.html` for evidence) are documents a title-only reviewer would credit.
      Both directions, same source. Golden guardrail #5, demonstrated four ways.
    rejected:
      - {path: "/a/faj.html",       rank: 4, why: "where is God when it hurts — its subject is crisis and tragedy, not anxiety with nothing objectively wrong. Credited to case 3. Same call as the Russian /a/gdebog.html."}
      - {path: "/a/imadsagra.html", rank: 5, why: "prayer — credited to case 8"}
      - {path: "/a/kapcsolat.html", rank: 6, why: "its opening lists freedom 'from worry, aimlessness, fear' but its subject is what a relationship with God IS"}
      - {path: "/a/utmutato.html",  rank: 7, why: "credited to case 1"}
      - {path: "/a/miert.html",     rank: 8, why: "credited to case 3"}
      - {path: "/a/isten-segitsege.html", rank: 9, why: "crisis help — the video twin of /a/faj.html, dropped from case 3 for the same reason"}
      - {path: "/story/Petra.html", rank: 10, why: "personal testimony"}
    note: |
      ⓘ CONTENT OBSERVATION, NOT A GAP. Unlike `bg` (which has a dedicated 11.6k
      'How do we deal with anxiety?' by Marilyn Adamson), `everystudent-hu` has NO article
      whose TITLE is anxiety. It answers the topic through a peace article, a
      pandemic-framed article and a testimony. The topic is covered; the shelf is shaped
      differently. Worth knowing before comparing the two sources' numbers.

  # ── 6 ──────────────────────────── newcomer 🔴 BOILERPLATE-TAIL TRAP, FULL FORCE
  - id: "eshu-newcomer-kereszt"               # topic: jesus-death
    persona: newcomer
    q: "A keresztény ismerőseim úgy beszélnek a keresztről, mintha az mindent megváltoztatott volna. Nekem viszont csak egy kivégzés, ami kétezer éve történt."
    en: "The Christians I know talk about the cross as if it changed everything. To me it is just an execution that happened two thousand years ago."
    top_score: 0.710
    credits:
      - {path: "/a/meghalni.html", rank: 5, score: 0.686, en: "Why did Jesus have to die? — 'What are Jesus' death and resurrection, the crucifixion, actually about?' A DEDICATED atonement article, 17.0k chars, working through the Passover lamb, the substitution and 'the Lamb of God who takes away the sin of the world'."}
    the_finding: |
      🔴 THE BOILERPLATE-TAIL TRAP FIRES HERE HARDER THAN ON ANY SOURCE SO FAR.
      The top FOUR hits are all rejected on their text, and the one document whose
      SUBJECT is what the cross accomplished sits at rank 5:

        rank 1  0.710  /a/forrasa.html     Josh McDowell's testimony + gospel tail
        rank 2  0.700  /story/Atti.html    personal testimony + gospel tail
        rank 3  0.699  /story/Petra.html   personal testimony + gospel tail
        rank 4  0.690  /a/hiten.html       is Jesus God? — his DEITY, not the cross
        rank 5  0.686  /a/meghalni.html    ← THE ANSWER
        …
        rank 8  0.669  /a/marcia.html      an astrology/occult conversion testimony

      The tail is verified present on this source, not assumed: `/a/farkasokkal.html`
      (why my dating habits changed) closes with "…come into my life as Saviour and Lord"
      and `/a/mergezo.html` (toxic porn) closes with "Thank you for the forgiveness and
      for entering my life now." Both are the same invitation prayer, and each is its own
      chunk. Fourth source, fourth confirmation of §0.9.

      🟢 BUT HUNGARIAN PATTERNS WITH BULGARIAN, NOT RUSSIAN — and this matters.
      `esru-newcomer-krest` credits two documents and NEITHER retrieves, because
      `everystudent-ru` has no article whose subject is the atonement. Hungarian HAS one,
      it retrieves, and the case scores 1/1. §0.11 called Bulgarian "the control that
      isolates the Russian gap"; Hungarian is the second control, and it comes out the
      same way. State this whenever the Russian expected-miss comes up: THREE sources now
      say the Russian result is corpus composition, not a systemic retrieval defect.
    rejected:
      - {path: "/a/forrasa.html",   rank: 1, why: "RANK 1 AND REJECTED — Josh McDowell's changed-life testimony with a gospel tail. Credited to case 4, where its actual subject lies."}
      - {path: "/story/Atti.html",  rank: 2, why: "RANK 2 AND REJECTED — personal testimony, matched on its tail"}
      - {path: "/story/Petra.html", rank: 3, why: "RANK 3 AND REJECTED — personal testimony, matched on its tail"}
      - {path: "/a/hiten.html",     rank: 4, why: "'Who is Jesus — is Jesus God — look at the evidence' (Paul E. Little, 23.0k). Its subject is Jesus' DEITY: did he ever claim to be God. That is a different question from what his death accomplished."}
      - {path: "/a/szornyu.html",   rank: 6, why: "credited to case 3"}
      - {path: "/a/iszlam.html",    rank: 7, why: "credited to case 7. Its Q4/Q5 do ask 'did Jesus die on the cross?', but that is a historicity question inside a tahrif article."}
      - {path: "/a/marcia.html",    rank: 8, why: "Marcia Montenegro's astrology-and-occult conversion testimony"}
      - {path: "/a/isten-segitsege.html", rank: 9, why: "crisis-help video, tail match"}
      - {path: "/a/sawyer.html",    rank: 10, why: "HIV testimony, tail match"}
    dropped_after_engine_check:
      - path: "/a/bizni.html"
        why: >
          "What does it mean to 'trust' Jesus?" (3.3k) — it states the atonement plainly
          ("we need forgiveness of our sins and to understand that Jesus died for them;
          his death on the cross is the only way to forgiveness"), and it is the exact
          Hungarian twin of the Russian /a/dovyeryat.html, which IS credited in the `ru`
          suite for this topic. I dropped it here on the same reasoning the Bulgarian
          suite used: its SUBJECT is what trusting Christ means — a 'begin a relationship'
          page — not what the cross accomplished, and it missed the top 10. Hungarian,
          unlike Russian, has a dedicated atonement article to credit instead, so keeping
          this one would add a known miss without measuring anything Russian does not
          already measure. OPERATOR MAY OVERRIDE: crediting it would make this case a
          second Russian-shaped probe. I judged one such probe in the campaign is enough.

