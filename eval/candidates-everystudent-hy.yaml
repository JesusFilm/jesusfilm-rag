      games… then you retire, walk in the mornings, work in the garden a bit… then the
      newspapers, the books and the television." Judged on the opening alone I would have
      credited it. Read further (chunks 1–4) it turns entirely and never turns back: "some
      call it paradise, some Heaven, some also speak of hell… many are convinced that if
      they are 'good enough' people they will go to Heaven after death. Is that how it
      works?" — then human imperfection, then a link to the Four Spiritual Laws page. Its
      subject is what happens AFTER death and whether being good is enough, not what life
      is for. REJECTED on the body. Guardrail #5 says judge on the opening rather than the
      title; this document says the opening is the floor, not the ceiling.
