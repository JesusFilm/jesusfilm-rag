  # ── 3 ───────────────────────────── skeptic 🔑 SETTLES THE TAHRIF QUESTION FOR `id`
  - id: "esid-skeptic-naskahkuno"
    persona: skeptic
    topic: bible-trust
    q: "Saya sering dengar di kampus bahwa naskah setua Alkitab tidak mungkin bertahan utuh setelah ribuan tahun disalin tangan. Buat saya itu terdengar masuk akal. Apa yang membuat kitab ini berbeda dari naskah kuno mana pun?"
    en: "I often hear on campus that a manuscript as old as the Bible cannot possibly have survived intact after thousands of years of hand-copying. To me that sounds reasonable. What makes this book different from any other ancient manuscript?"
    credits:
      - { path: "/artikel/215alkitab.html", en: "Why can you trust the Bible? — the books of the Bible, the history of the Bible, who wrote the Bible. 30.5k chars over 21 chunks, the longest document on this source. Opens on this exact objection ('How do we know the Bible we have today can be trusted? Can an intelligent person believe the Bible? Yes. The Bible is not a book of fairy tales — unlike other religious books, the Bible does not ask for blind faith') and answers it three ways: transmission, ancient history agreeing with the text, and archaeology.", rank: 1, score: 0.681 }
      - { path: "/artikel/200Islam.html", en: "Jesus and Islam — six questions Muslims and others commonly ask about Jesus, prefaced 'this is offered out of respect to anyone who wants to know about Jesus. Not a challenge. Nor any criticism of any religion, in any form.' Question 1 IS the asker's objection: 'Has the Bible's authenticity been altered? Or has it been changed and cut down again and again?' — the tahrif / scripture-corruption question. ⚠️ Its TITLE, 'Yesus dengan Agama-agama di dunia', is SHARED with /artikel/206Yesus.html, a different article credited to case 6. Credited by path.", rank: 2, score: 0.678 }
    the_finding: |
      🔑 THIS CASE IS THE STRONGEST AVAILABLE TEST OF §0.12's TAHRIF CORRECTION, AND IT
      PASSES. §0.12 replaced an earlier wrong generalisation with: "the bible-trust /
      tahrif pattern is about PUBLISHING, not audience" — the evidence being that Japan,
      not Muslim-majority, routes the topic through its Islam article, while Iran and
      Czechia have no Islam article at all.

      Indonesia is the hardest case that claim could face: the world's largest
      Muslim-majority country, and a source that carries SIX separate Islam documents.
      If audience drove the pattern, the Islam article would own this topic here.

      It does not. The dedicated 30.5k Bible-reliability article wins at rank 1, the Islam
      article follows at rank 2, and the gap between them is 0.003 — they are effectively
      tied, with the standalone article ahead. **Same answer as Czechia and Portugal;
      opposite audience.** §0.12's correction holds, and it now holds against the case
      most likely to break it. Do not re-open the audience hypothesis.

      ⓘ SECOND OBSERVATION, MEASURED NOT ASSUMED — THE ISLAM SERIES IS FRAGMENTED.
      `id` publishes the Islam material as SIX documents (/artikel/200Islam.html plus
      200Islam2–6.html, 3.0k–7.6k chars each), one per question, and every one of the six
      repeats the same ~700-character preamble that lists all six questions. So the phrase
      "has the Bible's authenticity been altered?" appears as CONTENT in one document and
      as BOILERPLATE in five. The effect is visible in two cases here:
        this case      — 200Islam6 at rank 4, 200Islam2 at rank 5, 200Islam5 at rank 10
        case 7 trinity — 200Islam6 at rank 2 (!), 200Islam5 at 5, 200Islam3 at 7, 200Islam2 at 9
      i.e. FOUR of the six flood the trinity top 10 and the one with the content is not
      among them. No batch-1 source split its Islam article this way. **This is a
      fragmentation effect distinct from the boilerplate tail — the repeated block is a
      navigation preamble, not the gospel invitation — and it is new to the campaign.**
      It costs this case nothing (both credits return at 1 and 2) but it is the likeliest
      explanation for the odd rank-2 on case 7.
    reworded: |
      ⚠️ REWORDED ONCE, PRE-EMPTIVELY, on the `eshu-skeptic-masolat` lesson — which is the
      only reason this topic did not cost three rounds here as it did on Hungarian.
      Hungarian smelled TWICE on this topic (0.755 then 0.787) because `id`, like `hu`,
