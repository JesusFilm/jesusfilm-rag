      start here and Indonesian landed at 0.681 with both credits at ranks 1 and 2, first
      attempt, no smell. A batch-1 finding transferring cleanly to batch 2.
    top_score: 0.681

  # ── 4 ───────────────────────────────────── seeker 🔴 REVERSE TITLE TRAP HERE
  - id: "esid-seeker-cemas"
    persona: seeker
    topic: anxiety
    q: "Saya hampir setiap hari merasa cemas, padahal sering kali tidak ada yang benar-benar salah dalam hidup saya. Pikiran saya seperti tidak pernah bisa tenang. Apakah iman bisa membantu keadaan seperti ini?"
    en: "Almost every day I feel anxious, even though often nothing is actually wrong in my life. My mind feels like it can never settle. Can faith help with a state like this?"
    credits:
      - { path: "/artikel/301kedamaian.html", en: "Peace of mind in an uncertain world — 'in uncertain times, how is it possible to have peace of mind rather than worry and unease? Whatever is happening in the world or in each of our lives, is there a place to get certainty back?' 18.4k chars, the source's dedicated peace article. The Indonesian twin of the Hungarian /a/beke.html.", rank: 2, score: 0.584 }
      - { path: "/artikel/coronavirus.html", en: "🔴 REVERSE TITLE TRAP, CONFIRMED ON `id` — SEVENTH SOURCE after `hu` `pl` `sq` `tr` `pt` `es`. The TITLE is 'Coronavirus (COVID-19)' — a dated 2020 notice that a title-only reviewer strikes on sight, six years on. The subtitle already broadens it ('how to overcome anxiety') and the body never goes back: 'you may feel anxious about some other threat entirely. Every day we are faced with all kinds of reasons to feel under pressure. The list is very long… terrorism, climate change, racism, war, government dysfunction, poverty, sexual violence, human trafficking, natural disasters, personal finances, illness, job security, stressful relationships, addiction.' 13.3k chars, and it is this source's general ANXIETY article.", rank: 3, score: 0.575 }
    the_finding: |
      ⚠️ THIS CASE IS THE SUITE'S SPECIMEN OF FAILURE MODE #6 — A CASE THAT FAILS WITHOUT
      SMELLING — AND IT IS THE ONLY ONE STILL PARTLY UNFIXED. Both credits return, and
      neither of them is rank 1. Rank 1 is /artikel/306menjawabdoa.html, the PRAYER
      article, which is credited to case 5. Round 1 was worse: the credits sat at ranks 3
      and 4, behind the prayer article AND the tragedy article; the reword lifted them to
      2 and 3 and dropped the top score 0.670 → 0.628, but could not dislodge the prayer
      article from the top.

      Why the prayer article wins: it carries its own "what about UNANSWERED prayer?"
      section that enumerates illness, money troubles and hardship, so it reads to the
      embedder as a general 'what does God do about my situation' document. Any anxiety
      question with a faith clause in it competes with that section. Removing the faith
      clause entirely would fix the rank and would stop asking the §0.7 approved question,
      so it was not done.

      🔴 AND THE BOILERPLATE TAIL IS HERE TOO, WITH NO TESTIMONIES TO CARRY IT.
      Ranks 9 and 10 for this anxiety question are /artikel/502langgeng.html (DIVORCE
      STATISTICS AND MARRIAGE PROBLEMS, 23.1k) and /artikel/501keintiman.html (SEX AND THE
      SEARCH FOR INTIMACY, 13.6k). Both entered only after the reword. This is worth
      recording precisely because this source has ZERO `/story/` pages: §0.12 said tail
      severity "tracks the testimony share", and `id` is 0% testimony and still produces
      marriage-and-sex articles in an anxiety top 10. **The tail rides on ARTICLES here,
      not on testimonies** — the same /a/gaylesbian.html document family from §0.9 shows
      up at rank 9 of the prayer case. Testimony share predicts how BAD it gets, not
      whether it happens.
    dropped_after_engine_check:
      - path: "/artikel/700jahat.html"
        why: >-
          "Worried about being attacked by evil spirits" (5.7k) — drafted as a third credit and DROPPED after round 1. The case for it was real: it is a document about a man living under permanent dread, and it is specific to this source's Indonesian readership in a way nothing on any batch-1 source is (his parents consulted dukun — shamans — for fortune and wealth, and he is certain Satan will collect). There is no equivalent anywhere else in the campaign. I pulled all four of its chunks and dropped it on two grounds. FIRST, its subject is spiritual attack and the occult, and its answer is conversion — "there is one way to make sure no evil spirit can disturb our lives: to have the Spirit of God dwell in us", then Jesus' five powers, then the invitation. Its closing line offers itself to readers with "kekuatiran semacam itu" — worry OF THAT KIND. The question asks about anxiety with nothing objectively wrong, which is the opposite shape. SECOND, it is a promiscuous matcher: the discovery pass matched it on its INVITATION-PRAYER tail ("Tuhan Yesus, saya memerlukan Dikau… Terima kasih, karena Tuhan telah mengampuni dosa-dosaku"), which is its own chunk, and it also turns up at rank 4 of the TRINITY case, where it has no business at all. Crediting it would have bought coverage on a document the engine did not find for the right reason. OPERATOR MAY OVERRIDE — it is a genuine fear document and Indonesian readers plausibly arrive at it through anxiety; I judged the tail match disqualifying.
    top_score: 0.628

