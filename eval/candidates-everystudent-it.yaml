    persona: newcomer
    topic: know-god
    q: "Quando sento la parola «Dio» mi viene in mente solo una specie di energia indefinita da qualche parte lassù. È qualcuno con cui si può davvero avere a che fare, o resta un'idea astratta?"
    en: "When I hear the word 'God' all that comes to mind is some kind of undefined energy somewhere up there. Is he someone you can actually have dealings with, or does he stay an abstract idea?"
    top_score: 0.64
    credits:
      - { path: "/bibbia", rank: 1, score: 0.64, en: "🔴 THE §0.12 TITLE TRAP, CONFIRMED PRESENT IN ITALIAN. Titled 'Perché scegliere il Dio della Bibbia?' ('Why choose the God of the Bible?'), which reads as an apologetic for Christianity over other faiths. Its BODY is a six-attribute enumeration of what God is like — '1. A God greater than us. 2. A God who can be known personally. 3…' — i.e. this IS the what-is-God-like article. Same document as bg 'Защо можем да разчитаме на Бог?' and the `tr`, `fa`, `pt`, `cs` twins. VERIFIED here by reading, NOT credited on precedent — §0.12 records that `ro` and `de` broke this same pattern and that assuming it cost `ro` a credit." }
      - { path: "/chi-2", rank: 2, score: 0.617, en: "'Who 2' (9.1k) — part 4 of the four-part cosmological chain, and the part where the 'eternal Something' is argued to have a WILL and to be a person rather than a machine ('if it produces something else, it must DECIDE to do so, and it possesses a will'), and where God's omnipresence is handled ('in a sense we exist inside God, because he is everywhere, while being distinct from us'). This is the document that turns 'undefined energy' into 'someone'." }
      - { path: "/dio", rank: 4, score: 0.574, en: "Who is God? (4.1k) — the honestly-titled twin: 'Who is God? What is he like? 6 personal qualities of God.' Then: 'Who is God… We can know him… Who is God… We can approach him. God invites us to speak with him and to take part in his life.' Directly answers 'is he someone you can have dealings with'." }
    the_finding: |
      🟢 THIS CASE IS THIS SOURCE'S DEMONSTRATION THAT TITLES ARE UNUSABLE, BOTH WAYS.
      Its rank-1 credit is a document a title-only reviewer files under "why Christianity
      rather than another religion" (/bibbia). Its rank-2 credit has the bare title
      "Chi 2" and names no subject at all. The one document a title-only reviewer WOULD
      pick first — /dio, "Chi è Dio?" — is the LOWEST-ranked of the three at rank 4.
      A title-only reviewer would have credited one of three and mis-filed the other two.

      Both title traps §0.12 lists as SYSTEMATIC are present on `it`, and both were
      re-verified rather than assumed:
        • "Why choose / rely on the God of the Bible?" → the six-attributes
          what-is-God-like article. ✅ HOLDS on `it`. (Broke on `ro` and `de`.)
        • Nothing → Something → Who → Who 2 → the four-part cosmological chain with
          contentless titles. ✅ HOLDS, with the personhood conclusion in PART 4, like
