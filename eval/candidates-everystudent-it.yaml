    topic: god-exists
    q: "I miei amici sono convinti che credere in Dio sia solo un'illusione consolatoria. Io vorrei capire se esistono argomenti seri, per esempio dalla scienza o da un ragionamento rigoroso, che portino davvero a pensare che Dio ci sia."
    en: "My friends are convinced that believing in God is just a consoling illusion. I would like to understand whether there are serious arguments, for example from science or from rigorous reasoning, that genuinely lead one to think God is there."
    top_score: 0.699
    credits:
      - { path: "/esisteundio", rank: 1, score: 0.699, en: "Is there a God? (Marilyn Adamson, 18.5k) — the source's flagship apologetics article. 'Just once, wouldn't you like someone to show you the proof of God's existence? No arm-wrestling. No statements of the sort, You just have to believe.' Then six reasons argued as evidence." }
      - { path: "/atea", rank: 2, score: 0.695, en: "How an atheist found God — Marilyn Adamson's own account: 'I systematically reviewed FIVE OBJECTIVE reasons why I believed God exists. So my faith in God was not based on feelings, but on facts, on reasoning.' It answers the wishful-thinking objection in its own words." }
      - { path: "/universo", rank: 4, score: 0.602, en: "Did God create the universe? (9.5k) — the Big Bang as a singular beginning of space, time and matter; Hubble's 1920s observation of receding galaxies; and why a universe that began 'poses enormous challenges to non-theist scientists'. The cosmological half of 'arguments from science'." }
      - { path: "/dimostra", rank: "NOT IN TOP 10", en: "A scientist gives the proof that demonstrates God (2.1k) — Dr Francis Collins, director of the Human Genome Project, on the fine-tuning of the gravitational constant: one part in 10^14 weaker and there is no coalescence of stars, galaxies, planets or us. 🔴 KEPT DELIBERATELY, see below." }
    kept_miss: |
      🔴 THE ONE CREDIT THAT DOES NOT RETURN, AND WHY IT IS KEPT (guardrail #8 §2).
      `/dimostra` is this source's HARD-SCIENCE document — a named scientist (Francis
      Collins, Human Genome Project) on cosmological fine-tuning. The question asks in
      so many words whether there are serious arguments FROM SCIENCE. This document is
      one. It does not answer a different question, so dropping it would be dishonest.
      I KEPT it.

      What it measures: LENGTH, not relevance. /dimostra is 2,065 chars over 2 chunks —
      the shortest credit in this suite — competing against 9k–18k articles that make
      the same fine-tuning and cosmology case at length. Its own argument DOES return,
      inside /universo (9.5k) at rank 4. The engine is preferring the long restatement
      over the short primary source. This case will score coverage 3/4, on purpose.
      Same treatment as `hu`'s /a/dns.html and `bg`'s esbg-skeptic-katastrofa.

      ⚠️ It did NOT return in any of the four rounds, at any wording — including round 1,
      whose wording was more emotional and pulled short documents higher. So unlike
      `hu`'s /a/dns.html this is not a boundary that flapped; it is a stable miss, which
      makes it the more informative of the two.
