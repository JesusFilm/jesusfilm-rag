  # ── 2 ─────────────────────── skeptic · CLEAN FIRST TIME, NO REWORD NEEDED
  - id: "esit-skeptic-ricopiata"              # topic: bible-trust
    persona: skeptic
    topic: bible-trust
    q: "A me la Bibbia sembra un testo antico come tanti altri, ricopiato a mano da generazioni di persone molto prima che esistesse la stampa. Cosa la renderebbe più attendibile di un qualsiasi altro documento di quell'epoca?"
    en: "To me the Bible looks like an ancient text like plenty of others, recopied by hand by generations of people long before printing existed. What would make it any more trustworthy than any other document from that era?"
    top_score: 0.702
    credits:
      - { path: "/ecco-perche-puoi-credere-nella-bibbia", rank: 1, score: 0.702, en: "The history of the Bible — who wrote the Bible (28.5k, the LONGEST document on this source). Opens on transmission and authorship directly: '40 authors over 1,500 years… unlike other religious texts the Bible is written as a truthful account of real events, places, people and dialogue. Historians and archaeologists have repeatedly confirmed its authenticity.' The retrieved chunk is the archaeology table — Petra, the walls of Jericho, the Hittites — which is exactly the 'how is it different from any other ancient document' answer." }
      - { path: "/gesu-e-islam", rank: 2, score: 0.698, en: "Jesus and Islam (21.8k) — six questions, and question 1 IS this one: 'Has the Bible changed from its original version? Or was it modified over time?' The retrieved chunk is the tahrif answer: 'The Qur'an does not claim the Bible was changed. Quite the opposite — it honours the Torah and the Bible many times.' This is the scripture-corruption overlap already on record for `zh`, `kk`, `th`, `bg` and `hu` (§0.7) — not an error." }
    note: |
      🟢 THE ONLY CASE IN THIS SUITE THAT WAS CLEAN ON THE FIRST WORDING — and the
      contrast with `hu` is the useful part.

      `hu` needed THREE wordings on this topic and hit 0.755 then 0.787, because BOTH
      of its candidate documents open with the reader's own doubt ("Can we believe the
      Bible?" / "Has the Bible changed from the original?"), so paraphrasing away from
      one landed on the other. On `it` only /gesu-e-islam opens that way;
      /ecco-perche-puoi-credere-nella-bibbia opens on the Bible's COMPOSITION ("40
      authors over 1,500 years"), not on the doubt. There was no second title to
      collide with, so the shape `hu` needed three rounds to find — "what makes it
      different from any other old book?", asked in the reader's own terms — worked
      here immediately at 0.702, ranks 1 and 2.

      ⓘ TWO CREDITS IS THE HONEST NUMBER. This source carries exactly two documents
      whose subject is whether the Bible is trustworthy AS A TEXT, and both return at
      ranks 1 and 2. Everything below rank 2 drops to 0.534 or less — a 0.164 cliff,
      the widest in this suite, which is the engine agreeing that the shelf has two
      documents on it.
