  # ── 7 ──────────────────────────────────────────── skeptic ⚠ THE GAP CASE
  - id: "esja-skeptic-kakikae"                # topic: bible-trust
    persona: skeptic
    q: "聖書は何千年も手書きで写されてきたんですよね。途中で都合よく書き換えられていない保証って、どこにあるんですか。"
    en: "The Bible was copied by hand for thousands of years, right? Where is the guarantee it wasn't rewritten to suit someone along the way?"
    top_score: 0.615
    credits:
      - {path: "/a/jesus-in-islam.html", rank: 1, score: 0.615, en: "Islam — what is the difference? 14.5k chars, six questions Muslim readers ask about Jesus. QUESTION 1 IS VERBATIM THIS CASE'S SUBJECT: 聖書は、著者のオリジナルから変更されたことはなかったのか？ ('Has the Bible never been altered from the author's original?'). Its answer argues that four independent Gospels are themselves evidence against 改竄 (falsification), like four eyewitnesses in court."}
