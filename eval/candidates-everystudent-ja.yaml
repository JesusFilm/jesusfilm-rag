# Phase 5 PART B — golden suite DRAFT for `everystudent-ja` (79 documents).
# Campaign #111, tier A. Working record — NOTHING here has been written to
# eval/qa-golden.yaml. Guardrail #4 gates that on an explicit operator approval turn.
#
# Sizing: 79 ÷ 8 = 9.875 → 10 cases. §0.7's rule floors at 4 and caps at 10; 9.875
#   rounds to 10, and all ten §0.7 topics are genuinely answerable by this source, so
#   no topic is dropped. ⚠️ IF THE OPERATOR PREFERS A STRICT FLOOR OF 9, drop
#   `esja-skeptic-kakikae` (bible-trust) — it is the weakest topic here and the reason
#   is a real content gap, documented under GAP below.
# Personas: skeptic 4 · newcomer 3 · seeker 2 · believer 1 — matches §0.7 exactly.
# Questions authored IN JAPANESE, not translated from the English menu.
# Null-language documents: 0 of 79 (guardrail #3a — nothing excluded).
#
# DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-ja ja
#   → 51 distinct candidate documents of 79, all ten topics covered.
# Every credited document was read from the database (title + opening 500–700 chars)
# before being credited — guardrail #5, and specifically because of the boilerplate-tail
# trap recorded in §0.9. Several rank-1 and rank-2 hits were rejected on that reading.
#
# ENGINE-CHECKED THREE TIMES (guardrail #8 §2) — .tmp-diag/phase5-ja-check.ts
#   Round 1: 28 credits · 0 paraphrase smells · 4 credits not returned in top 10.
#   Round 2: 27 credits · 0 paraphrase smells · 3 credits not returned.
#   Round 3: 25 credits · 0 paraphrase smells (max top score 0.741) · 1 credit not
#            returned — and that one is a DELIBERATE keep, see `esja-skeptic-jiko`.
#   No question ever smelled. All three fixes were credit DROPS plus one reword whose
#   purpose was a lexical artifact, not a smell (see `esja-skeptic-negaibou`).
#
# MECHANICAL CHECKS — both green
#   Guardrail #8 §3: all 25 credited paths resolve to EXACTLY ONE document — 25/25,
#                    25 distinct documents, no document credited twice.
#   Guardrail #3a:   no credited document has a null language — 25/25, all `ja`.
#
# evidence_tier: llm-translated (nobody available reads Japanese). This is a fact about
#   the REVIEWER, not the language — if anyone on the team reads Japanese and can
#   sanity-check the questions, it should be `human-verified`. OPERATOR TO CONFIRM.
#
# ⓘ `ja` shares no language bucket with any other source, so the §0.8 competition
#   effect does not apply here. Every hit in every top-10 above came from
#   `everystudent-ja` itself.

# ─────────────────────────────────────────────────────────────────────────────
# 🔴 ONE HAZARD SPECIFIC TO THIS SOURCE — READ BEFORE EDITING THE KEYS
# ─────────────────────────────────────────────────────────────────────────────
# A TITLE IS DUPLICATED, AND THE DUPLICATE IS ALSO A TITLE TRAP. Both facts land on
# the same pair of documents, which is why this is worse than the `bg` instance:
#
#   `死の恐れに打ち勝つ方法` ("How to overcome the fear of death") exists at TWO paths:
#     /a/eni5.html  1,788 ch — opening: 死の現実に挑む / "how do we face death? how can we
#                   overcome the fear of it?" A friend diagnosed with colon cancer at 16.
#                   ✅ The title is accurate for this one.
#     /a/why.html   5,052 ch — opening: 何で人生 大変なのか？ / "Why is life so hard?"
#                   Repeated natural disasters, epidemics, terror, child abuse, workplace
#                   harassment, school bullying. 🔴 THIS IS THE SUFFERING ARTICLE. Its
#                   title describes a completely different topic than its body.
#
# CONSEQUENCE FOR TOOLING: the `bg` check script keyed credits by TITLE and resolved
# them to paths. That pattern is BROKEN on this source — a title→path map for
# `死の恐れに打ち勝つ方法` silently keeps one document and drops the other, and there is
# a 50% chance it keeps the WRONG one. `.tmp-diag/phase5-ja-check.ts` therefore declares
# credits by PATH and uses the database to VALIDATE (path exists · resolves to exactly
# one document · language not null) rather than to resolve. Japanese paths are plain
# ASCII (`/a/foo.html`), so unlike `bg` there is no percent-encoding hazard in typing
# them. The script prints the duplicate-title warning on every run.
#
# /a/why.html IS CREDITED — to suffering, on its body. Fourth campaign source, fourth
# title trap. Titles remain unusable as evidence on this estate.

cases:

  # ── 1 ─────────────────────────────────────────────────────────── skeptic
  - id: "esja-skeptic-negaibou"               # topic: god-exists
    persona: skeptic
    q: "友人に「神を信じるなんて現実逃避でしょ」と笑われました。うまく言い返せなかったのですが、信じることに理屈はあるんでしょうか。"
    en: "A friend laughed at me — 'believing in God is just escapism.' I couldn't answer back. Is there any actual reasoning behind believing?"
    top_score: 0.661                          # clear of 0.75
    credits:
      - {path: "/a/atheist.html", rank: 1, score: 0.661, en: "Why I, an atheist, came to believe in God — Marilyn Adamson. She opens by admitting she used the question 'how do you KNOW God exists?' to embarrass Christian friends, got no objective evidence for months, and concluded God does not exist. Answers the escapism charge from inside it."}
      - {path: "/a/exi3.html",    rank: 3, score: 0.593, en: "Six clear proofs that God exists — Marilyn Adamson, 11.2k chars. The source's flagship apologetics article: earth's fine-tuning, DNA, the moral sense."}
    reworded: |
      ⚠️ REWORDED AFTER ROUND 2 — and NOT for a paraphrase smell (it never smelled).
      v1: "友人と飲んでいて「神を信じるなんて…」" ("over drinks, a friend laughed at me…")
      That incidental scene-setting pulled `/a/quench507.html` — 飲酒 心の渇きを潤すには？,
      an article about ALCOHOL — to rank 3 at 0.581, on pure surface-word overlap with
      「飲んで」. Not a boilerplate tail and not a title trap: a third failure mode, a
      LEXICAL ARTIFACT from colour in the question that carries no part of the ask.
      v2 deletes two characters. Result: 0.646 → 0.661, `/a/quench507.html` gone from the
      top 10 entirely, `/a/exi3.html` improved rank 4 → 3. Free fix.
      ⓘ Worth carrying to the remaining 42 suites: keep incidental nouns out of the
      question unless they are part of what is being asked.
    dropped_after_engine_check:
      - {path: "/a/dna.html", why: "DNA as evidence for God (Antony Flew's reversal), 3.2k chars. Missed the top 10. On re-reading, correctly: its subject is WHAT SPECIFIC EVIDENCE EXISTS, whereas this question is whether belief is escapism. Same call `bg` made when it dropped its own flagship 'Is there a God? Six candid reasons' from the crutch question. The evidence line is still represented by /a/exi3.html at rank 3."}
      - {path: "/a/collins.html", why: "Francis Collins on the gravitational constant and fine-tuning, 1.2k chars — a video transcript. Missed the top 10, and the same reasoning applies: a single-argument science piece, not an answer to the escapism charge."}
    rejected:
      - {path: "/a/eni6.html", rank: 2, why: "RANK 2 AND REJECTED — it is the tragedy/'where is God when disaster strikes' article, credited to case 3. Its relevance here is the shared closing move, not its subject."}
      - {path: "/a/easter.html",    rank: 7, why: "what it means to believe the resurrection — a different claim"}
      - {path: "/a/sawyer607.html", rank: 8, why: "HIV testimony. Boilerplate tail — see the SUMMARY note; this document surfaces in FOUR unrelated cases."}
      - {path: "/a/devil.html",     rank: 9, why: "does the devil exist? — a different existence question"}

  # ── 2 ────────────────────────────────────────────────────────── newcomer
  - id: "esja-newcomer-jinkaku"               # topic: know-god
    persona: newcomer
    q: "「神様」と聞いても、ぼんやりした大きな力みたいなものしか思い浮かびません。聖書の神には、性格とか人格みたいなものがあるんでしょうか。"
    en: "When I hear 'God' all I can picture is some vague big force. Does the God of the Bible have anything like a character or a personality?"
    top_score: 0.741                          # ⚠ the suite's closest call — see note
    credits:
      - {path: "/a/ideal.html", rank: 1, score: 0.741, en: "What kind of God does the Bible describe? — 12.9k chars, the longest article in the source. Opens 'what is your IDEAL God?' then works through the Bible's attributes, stating that this God 人格があり (has personhood) and seeks to communicate with people. Japanese twin of the Spanish /articulos/escoger.html and Russian /a/vibirat.html."}
      - {path: "/a/exi2.html",  rank: 2, score: 0.646, en: "The six characteristic traits of God the Bible describes — 'God is not hidden, not distant, not unapproachable; he wants a relationship and to be known personally.' Japanese twin of the Russian /a/ktoeto.html and the Bulgarian six-personal-traits article."}
      - {path: "/a/where.html", rank: 5, score: 0.581, en: "Where can God be found? — the flatland analogy: two people drawn on a sheet of paper cannot see you, only your fingertip when it enters their plane. God exists outside our dimensions, which is why he cannot be 'seen'. Answers the 'vague big force' framing directly. Twin of the Russian /a/gdyebog.html and Bulgarian 'Is God invisible?'."}
    note: |
      ⚠️ 0.741 IS THE HIGHEST TOP SCORE IN THIS SUITE and the one an operator should look
      at. It is clear of the 0.75 line, but only by 0.009, and the reason is real:
      /a/ideal.html's own text uses 人格 ("personhood"), the same word the question uses.
      I left it because (a) it is under the line, (b) `bg` kept 0.746 and 0.750 on the same
      reasoning, and (c) the question is a newcomer's framing of a vague force, not a
      restatement of the article's title (「聖書が語る神とは？」). If the operator wants
      margin, replacing 性格とか人格 with a plainer word would cost the /a/where.html credit,
      which sits at 0.581 and has the least headroom.
    rejected:
      - {path: "/a/jesus-in-islam.html", rank: 3, why: "credited to case 7 — the section that matches here is about Jesus' eternality, one attribute inside a Muslim-facing Q&A"}
      - {path: "/a/atheist.html",        rank: 4, why: "credited to case 1"}
      - {path: "/a/growing-up-mormon.html", rank: 6, why: "growing up Mormon — a testimony about leaving Mormonism"}
      - {path: "/a/holy-spirit.html",    rank: 7, why: "credited to case 10 — its subject is the Spirit's personhood specifically, which belongs to the Trinity question"}
      - {path: "/a/nick-vujicic.html",   rank: 9, why: "⚠️ THE HARDEST REJECT IN THE SUITE. A 1.7k-char video testimony from Nick Vujicic (born without arms or legs) whose opening is literally 'Do you know God? What do you think God is like? Why is God interested in us?' — this question's exact framing. Rejected because it never ANSWERS it: the body is Nick's relationship with God, not a description of God's character. Same call `ru` made when it dropped /a/znat.html — the relationship is not the same subject as what God is like."}

  # ── 3 ─────────────────────────────────────────── skeptic ⚠ SEE THE KEEP
  - id: "esja-skeptic-jiko"                   # topic: suffering
    persona: skeptic
    q: "去年、友人を事故で亡くしました。周りは「仕方ない」と言いますが、愛のある神がいるならなぜ止めてくれなかったのか、ずっと引っかかっています。"
    en: "Last year I lost a friend in an accident. People say 'it couldn't be helped', but if there is a loving God, why didn't he stop it? It has stuck with me ever since."
    top_score: 0.689
    credits:
      - {path: "/a/eni3.html",  rank: 1, score: 0.689, en: "Why is there suffering? — Stacy James, paralysed from the neck down in a university diving accident. 'Why did God allow such a tragedy to happen?' The closest possible match to the asker's situation. Japanese twin of the Russian /a/steysi2.html, credited for the same question shape."}
      - {path: "/a/eni6.html",  rank: 2, score: 0.676, en: "Is God there in the middle of tragedy? — Marilyn Adamson, 8.6k chars. Natural disasters, epidemics, famine, terror, unemployment, child abuse, violent crime."}
      - {path: "/a/gods-help.html", rank: 3, score: 0.644, en: "God's guidance in hard times — a 7:41 video narration. 'When tragedy strikes we ask, where is God?' Answers: knowing God does not remove suffering — wars still happen, epidemics still kill — but you do not walk it alone."}
      - {path: "/a/why.html",   rank: 4, score: 0.640, en: "🔴 TITLE TRAP — titled 死の恐れに打ち勝つ方法 ('How to overcome the fear of death'), and it is NOT that article. Body opens 何で人生 大変なのか？ ('Why is life so hard?') and works through disasters, epidemics, terror, child abuse, harassment and bullying. It is a suffering article. See the hazard block at the top: this same title is ALSO carried by /a/eni5.html, which genuinely IS the fear-of-death article."}
      - {path: "/a/is-god-good.html", rank: "NOT IN TOP 10", en: "Is God really good? — a 926-char transcript of a 1:45 video. Opens 神が良い方なら、なぜ苦しみがあるのでしょうか ('If God is good, why is there suffering? Why didn't God make people incapable of sin?') and answers with the free-will argument: God cannot make a square circle, and freedom without alternatives is a contradiction. KEPT DELIBERATELY — see below."}
    the_deliberate_keep: |
      🔴 /a/is-god-good.html DOES NOT RETRIEVE, AND I KEPT IT. This case scores 4/5 by design.

      It is not a bad credit and not a phrasing problem — it is the estate's known defect,
      measured. The document is 926 characters: a short video transcript with no room for
      the topical repetition longer articles get, so it loses on score to four longer
      articles about the same subject plus a queue of boilerplate tails. Its opening line
      is a more direct answer to this question than any of the four that DO retrieve.

      🟢 THE CROSS-LANGUAGE CASE FOR KEEPING IT IS NOW THREE SOURCES DEEP:
        · `zh-cn` /a/isgodgood.html   — rank 1 at 0.741 for the Chinese version (Part A, §0.9)
        · `bg`    Добър ли е Бог?      — outside the top 10, KEPT, case scores 3/4 (§0.11)
        · `ja`    /a/is-god-good.html — outside the top 10, KEPT, case scores 4/5 (here)
      Same article, same estate, same embedder, three different outcomes. Crediting it
      consistently is what makes that comparison readable at all. Guardrail #8 §2: "keep
      the honest phrasing and let the eval record the gap — a case that always passes
      measures nothing."
    rejected:
      - {path: "/a/ideal.html",    rank: 5, why: "credited to case 2 — the chunk that matched here is its atonement passage, mid-article"}
      - {path: "/a/exp6.html",     rank: 6, why: "credited to case 8 (prayer)"}
      - {path: "/a/exp301.html",   rank: 7, why: "credited to case 5 (anxiety)"}
      - {path: "/a/sawyer607.html", rank: 8, why: "HIV testimony — boilerplate tail"}
      - {path: "/a/nick-vujicic.html", rank: 9, why: "video testimony; its subject is knowing God, not why suffering is permitted"}
      - {path: "/a/atheist.html",  rank: 10, why: "credited to case 1"}

