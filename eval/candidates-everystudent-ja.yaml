    credits:
      - {path: "/a/purpose.html", rank: 1, score: 0.553, en: "Do you want to know your life's purpose? — the hammer parable: a new hammer sits in the toolbox, gets used to split firewood, fix a hubcap, fit a table leg, and is still unsatisfied. The estate's standard purpose article; twin of the Russian /a/smisl.html and Bulgarian hammer article."}
      - {path: "/a/value-of-philosophy.html", rank: 2, score: 0.483, en: "The value of philosophy — 'Why do we exist? What is life's purpose? What gives life fulfilment and meaning?' Socrates, Plato, Aristotle, Peter Kreeft. Twin of the Russian /a/filosofii.html and the Bulgarian 'fundamental questions of life'."}
      - {path: "/a/exp1.html", rank: 3, score: 0.463, en: "Becoming the person you want to be — Josh McDowell. Names his three lifelong questions: 私とは何者なのか / なぜこの世界に存在しているのか / どこに向かっているのか ('Who am I? Why do I exist? Where am I going?'). Japanese twin of the Spanish /articulos/lafuente.html and Russian /a/istochnik.html, both credited for this exact question shape."}
      - {path: "/a/exp2.html", rank: 4, score: 0.459, en: "The meaning of life, life's mission — three recent graduates on finding what they were for. Testimony-shaped, but its declared subject is 生きる意味、人生の使命 and it is written at students feeling exactly this."}
    note: |
      ⓘ 0.553 is the lowest top score in the suite, and it is not a defect. §0.7 measured
      the retrieval cutoff at 0.37 and this clears it comfortably; all four credits land
      at ranks 1–4 with no boilerplate tail between them, which is the cleanest result of
      any case here. Scores are not comparable across questions — landing on the right
      documents is the objective (§0.7's `know-god` reword makes the same point).
    rejected:
      - {path: "/a/why.html", rank: 5, why: "credited to case 3"}
      - {path: "/a/striving-for-success.html", rank: 6, why: "a student's testimony about over-striving for success and the stress she put on herself and her teammates. Adjacent, but its subject is over-effort, not emptiness."}
      - {path: "/a/a-purposeful-life.html", rank: "not returned", why: "NOT RETURNED AND NOT CREDITED, recorded so the next reviewer does not re-litigate it: a 1.9k-char video testimony (a baseball player, drugs, group fraud, then a pocket Bible outside the university canteen). Its subject IS finding purpose, but it is a story rather than an answer — the same distinction `ru` used to credit /a/steysi2.html and reject /a/steysi1.html."}
      - {path: "/a/kept-me-alive.html", rank: 8, why: "testimony about good-university/good-company success and core values"}
      - {path: "/a/loneliness.html",  rank: 9, why: "loneliness"}
