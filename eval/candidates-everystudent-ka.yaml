    en: "At university we were taught that ancient manuscripts changed shape in the hands of copyists over the centuries. Why should I accept the Bible as a historical source rather than just a collection of legends?"
    credits:
      - { path: "/a/bibliisa215.html", en: "Why you can believe the Bible (29.2k — the LONGEST document in the source, 20 chunks). Its opening is the whole answer: 'Ancient history supports the reliability of the Bible as a historical record. The Gospels give us numerous credible accounts of Jesus' life. Archaeology supports the biblical narrative. Textual research proves that the books of the Bible have not been altered since they were first written.' The only Bible-reliability article on this source.", rank: 1, score: 0.715 }
    top_score: 0.715
    rejected:
      - {path: "/a/mighma201.html",     rank: 2, why: "⚠️ BOUNDARY — THE REVIEWER MAY WANT TO OVERRIDE THIS. 'Beyond blind faith' (22.9k, Paul Little): the life of Jesus Christ, was he the Son of God, and why believing him is not blind faith. It argues from the historical record, so it is adjacent — but its SUBJECT is Jesus' identity, not whether the biblical TEXT survived transmission. Rejected on the text, on the same reasoning `hu` used to reject /a/hiten.html. The 0.151 gap behind rank 1 supports the call."}
      - {path: "/a/ratom107.html",      rank: 3, why: "the what-is-God-like article — credited to case 3. Matched on 'the God revealed in the Bible' in its opening line."}
      - {path: "/a/shetsvlili302.html", rank: 4, why: "Josh McDowell testimony — credited to case 4. See the MAGNET finding in the SUMMARY: this is its third of four appearances."}
    note: |
      🟢 THE CLEANEST CASE IN THE SUITE. Rank 1 at 0.715 with the next document
      0.151 behind, and only three own-source documents in the top 10 at all — the
      one topic on this source where a single article owns the answer outright.
