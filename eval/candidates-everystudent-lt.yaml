cases:

  # ── 1 ────────────────────── skeptic ⚠ SEE THE UNMOVABLE RANK-1 INTRUDER
  - id: "eslt-skeptic-apgaudinejimas" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "Draugai sako, kad tikėjimas Dievu tėra svajonė, kurią žmonės patys sau susigalvojo. Ar yra kokių nors apčiuopiamų dalykų – kad ir mokslo atradimų apie gyvybės ir visatos atsiradimą – kuriais tas tikėjimas remiasi, ar iš tiesų viskas tik prasimanyta?"
    en: "My friends say that believing in God is just a dream people made up for themselves. Are there any tangible things — scientific discoveries about the origin of life and of the universe, for instance — that this belief rests on, or is it really all just made up?"
    credits:
      - { path: "/a/visata.html", en: "'Ar Dievas sukūrė visatą?' (8.8k) — the Big Bang and the beginning of the universe, via Hubble's 1920s observation: 'our existence was started by something beyond time, space or matter… the realisation that our universe did not exist forever and had a beginning raises enormous challenges for scientists who do not believe in a Creator.'", rank: 2, score: 0.653 }
      - { path: "/a/egzistuoja.html", en: "'Ar Dievas yra?' — the source's flagship apologetics article (17.6k, Marilyn Adamson): 'six clear arguments confirming God's existence… no telling you \"you just have to believe\"'. The Lithuanian twin of `hu` /a/letezik.html and `es` /articulos/existe.html.", rank: 3, score: 0.637 }
      - { path: "/a/tikras.html", en: "'Ar Dievas yra tikras?' (5.2k) — the DNA article: the British philosopher Antony Flew, a leading spokesman for atheism, concluding in a December 2004 filmed interview that 'a higher intelligence is the only suitable explanation for the origin of life and the complexity of nature', then DNA as a written computer program. The Lithuanian twin of `hu` /a/dns.html — which in that suite was the credit that would NOT return; here it returns at rank 5.", rank: 5, score: 0.63 }
      - { path: "/a/kritikus.html", en: "'Ar krikščionybė išstovės prieš XXI a. kritikus?' (16.0k) — Josh McDowell on three false views of Christianity, and MISCONCEPTION #1 IS THIS QUESTION: 'Aklas tikėjimas' (blind faith). ⚠ NEAR-TITLE-TRAP: the title reads like a culture-war piece about critics; the body is a faith-versus-evidence argument.", rank: 6, score: 0.628 }
      - { path: "/a/gamtos.html", en: "'Gamtos dėsnių sugluminti mokslininkai' (7.8k) — why the laws of physics are constant everywhere, quoting the cosmologist Sean Carroll and James Trefil's universality principle. A second scientific-grounds document, distinct from the DNA one.", rank: 7, score: 0.626 }
    the_finding: |
      🔴 A NEW SHAPE OF THE REVERSE TITLE TRAP: the same document intrudes on a
      SECOND, UNRELATED topic — and it cannot be reworded away.

      `/a/koronaviruso.html` is rank 1 for this evidence question in ALL THREE
      rounds (0.687 → 0.690 → 0.665) even though it is the source's ANXIETY
      article and is credited as such on case 5. Two rewords of this question,
      moving it from emotional framing to grounds to origin-of-life specifics,
      changed the credits' ranks completely and never touched rank 1.

      I READ THE CHUNKS TO FIND OUT WHY, rather than assume. The Lithuanian
      coronavirus article embeds Marilyn Adamson's own conversion account, and
      that account is apologetics:
        • "Studijavau tokius didžiuosius protus, kaip Sartras, Platonas,
           Sokratas, Dostojevskis, Nyčė, Hjumas ir kiti. Galiausiai priėjau prie
           išvados, kad vien filosofijos nepakanka…"
           (I studied great minds — Sartre, Plato, Socrates, Dostoevsky,
           Nietzsche, Hume — and concluded philosophy alone is not enough)
        • "Daugelis žmonių čia sudeda viltis į mokslą…"  (many people put their
           hopes in science here)
        • "gyvybė Žemėje tiesiog negalėjo atsirasti atsitiktinai. Ir štai aš
           pakviečiau Dievą į savo gyvenimą…"
           (life on Earth simply could not have arisen by chance — so I invited
           God into my life)
      So the anxiety article genuinely contains the source's philosophy-,
      science- and origin-of-life vocabulary in three separate chunks. This is a
      CORPUS FACT, not a question defect, and it is worth recording as a distinct
      trap from §0.12 #3: a reverse-title-trap document that is also a
      CROSS-TOPIC intruder. Rejected here, credited on case 5 where its subject is.

      Effect on this case: credits at ranks 2,3,5,6,7 — coverage 5/5, recall@3
      2/5, precision@1 0. Do not read the 0 precision@1 as a broken question.
    reworded: |
      ⚠️ REWORDED TWICE, and round 1 is the clean specimen of FAILURE MODE #5.
      v1: "…tikėjimas Dievu tėra savęs apgaudinėjimas… ar viskas laikosi tik ant
           jausmo?" ("…just self-deception… or does it all rest on feeling
           alone?")
           → top 0.687, NO SMELL, and only 2 of 4 credits returned. The
           self-deception/feeling framing dragged the top 10 into emotional
           documents: rank 4 /a/sawyer.html (HIV testimony), rank 5
           /a/siaubingiems.html (child rape), rank 9 /a/ramybe.html (peace of
           mind), rank 10 /a/rysys.html (the Four Spiritual Laws tail). BOTH
           scientific-evidence articles fell out. Identical to the `tr`/`hu`/`pt`
           finding: ask for GROUNDS, not about feelings.
      v2: "…apčiuopiamų dalykų – mokslo atradimų, protu patikrinamų svarstymų…"
           → top 0.690, no smell, 4 of 4 returned at ranks 2,5,8,9.
      v3 (kept): names what the grounds would be about — the origin of life and
           of the universe — which is what the source's evidence shelf actually
           argues from. → top 0.665, no smell, **5 of 5 at ranks 2,3,5,6,7**.
    rejected:
      - { path: "/a/koronaviruso.html", rank: 1, why: "RANK 1 AND REJECTED in all three rounds — the anxiety article, credited to case 5. See the_finding above for the verified reason." }
      - { path: "/a/dramblys.html", rank: 4, why: "'Ar Dievas yra dramblys?' — the blind-men-and-the-elephant allegory. Its subject is religious pluralism ('all religions describe God equally well'), not whether there are grounds for believing at all. Belongs to the dropped `religions` topic." }
      - { path: "/a/nerodo.html", rank: 8, why: "'Kodėl Dievas nerodo įspūdingų stebuklų ir neįrodo pats savęs?' — a different objection: God's reticence, not the evidence question. Same call `hu` made on its twin /a/csodat.html." }
      - { path: "/a/kritikus2.html", rank: 9, why: "part 2 of the McDowell series — misconceptions 4–6, which are about the historical Jesus and the resurrection, not about scientific or philosophical grounds. Its part 1 IS credited." }
      - { path: "/a/tragedija.html", rank: 10, why: "the suffering article — a tail-adjacent match on 'why we can trust God'." }
    top_score: 0.664

  # ── 2 ─────────────────────────────────────────────────────────────── skeptic
  - id: "eslt-skeptic-rankrastis" # topic: bible-trust
    persona: skeptic
    topic: bible-trust
    q: "Man Biblija – tiesiog senovinė knyga, kurią rašė ir šimtmečiais ranka perrašinėjo žmonės. Kuo ji skiriasi nuo bet kurio kito antikos rankraščio? Kodėl kas nors ja turėtų remtis labiau nei kitais senais tekstais?"
    en: "To me the Bible is just an ancient book that people wrote and recopied by hand over centuries. What makes it different from any other manuscript from antiquity? Why should anyone rely on it more than on other old texts?"
    credits:
      - { path: "/a/biblija.html", en: "'Kodėl tu gali tikėti Biblija?' — the source's longest article (26.5k, 17 chunks). Its opening enumerates exactly this: ancient history supports the Bible's accuracy as a historical document, the gospels give multiple reliable accounts, archaeology supports the biblical narratives, and 'textual research confirms that the books of the Bible have not been changed since they were first written down'. The chunk that matched in discovery is the manuscript-transmission passage — translations made from the original Greek, Hebrew and Aramaic source texts, resting on thousands of ancient manuscripts.", rank: 1, score: 0.733 }
      - { path: "/a/islamas.html", en: "'Jėzus ir islamas' (20.3k) — six questions, and QUESTION 1 IS THIS ONE: 'Ar originali Biblijos versija buvo pakeista?' It answers that the Qur'an itself never claims the Bible was altered but honours the Torah, the Zabur and the Injil, and that Islam began in the 7th century, 600 years after Christ. The tahrif overlap already on record for `zh` `kk` `th` `bg` `hu` `ja` — §0.12: this is about PUBLISHING, not audience.", rank: 2, score: 0.713 }
    note: |
      ⓘ NO REWORD NEEDED — 0.733 at rank 1 and rank 2 on the first attempt, and
      that is because the shape was borrowed from `hu`, which needed THREE goes.
      `hu` smelled at 0.755 and then WORSE at 0.787 asking "is the text still the
      same as the original?", because on a source where two documents both open
      with that question, paraphrasing away from one lands on the other. `lt` has
      the same two documents (/a/biblija.html opens "How can we know that what is
      written in the Bible is true?", /a/islamas.html Q1 is "was the original
      version of the Bible changed?"). Starting from `hu`'s fixed shape — change
      the question from "is it unchanged?" to "what makes it different from any
      other old book?" — Lithuanian landed clean first time. The §0.12 lesson
      transferred exactly as `hu`'s trinity lesson transferred from `ru`/`bg`.
    rejected:
      - { path: "/a/kritikus2.html", rank: 3, why: "misconception #4, 'the historical Jesus is unknowable'. Close, and rejected on the text: its subject is whether historical method can reach Jesus, not whether the manuscript text is what was written. A boundary reject — see the REVIEWER note in the summary." }
      - { path: "/a/religiju.html", rank: 4, why: "how Jesus differs from other world religions — belongs to the dropped `religions` topic" }
      - { path: "/a/gyveno.html", rank: 5, why: "'Kaip žinoti, ar Jėzus kažkada iš tikrųjų gyveno žemėje?' (2.6k) — Tacitus and Josephus as extra-biblical witnesses. Its subject is whether JESUS existed, not whether the BIBLE's text is reliable. A boundary reject — see the REVIEWER note in the summary." }
      - { path: "/a/kritikus.html", rank: 6, why: "credited to case 1" }
      - { path: "/a/kas2.html", rank: 7, why: "credited to case 3" }
      - { path: "/m/istorija.html", rank: 8, why: "the testimony collection — a tail match, and one of only two appearances it makes anywhere in this suite" }
    top_score: 0.733

  # ── 3 ───────────────────────── newcomer 🔴 TWO TITLE TRAPS IN ONE CASE
  - id: "eslt-newcomer-migla" # topic: know-god
    persona: newcomer
    topic: know-god
    q: "Kai kas nors sako „Dievas“, man galvoje iškyla nebent kažkokia migla kažkur aukštai. Ar apie Jį apskritai galima kalbėti kaip apie asmenį – ar įmanoma pasakyti, kokio Jis būdo ir kaip Jis nusiteikęs žmonių atžvilgiu?"
    en: "When someone says 'God', all that comes into my head is some kind of haze somewhere up high. Can one speak of him as a person at all — is it possible to say what his character is and how he is disposed towards people?"
    credits:
      - { path: "/a/kas2.html", en: "'Kas2' (9.8k). 🔴 TITLE TRAP — the title is literally 'Who2' and names no subject whatsoever. This is part 4 of a four-part cosmological argument, and it is the part where the Eternal Someone is argued to be a PERSON rather than a machine: 'Amžinasis Kažkas nėra mechanizmas, kuris buvo kontroliuojamas ar užprogramuotas kitos išorinės jėgos.' Answers the 'or is he just a force' half directly. Same document family as `hu` /a/kicsoda2.html. It is RANK 1 for this question — a title-only reviewer would have discarded the best document in the source.", rank: 1, score: 0.696 }
      - { path: "/a/kasyra.html", en: "'Koks yra Dievas?' (4.0k) — 'Is he abstract and intangible? Or can he be known? SIX TRAITS OF GOD'S PERSONALITY': he is knowable, he is approachable, and 'we do not have to pull ourselves together and change first'. This is the estate's what-is-God-like article — the Lithuanian twin of `ru` /a/ktoeto.html, `hu` /a/milyen.html and `bg` 'Защо можем да разчитаме на Бог?'.", rank: 2, score: 0.691 }
      - { path: "/a/tikejimas.html", en: "'Ne aklas tikėjimas' (18.9k, Paul E. Little). 🔴 SECOND TITLE TRAP, in the opposite direction — 'Not blind faith' reads as an evidence/apologetics piece and a reviewer would file it under case 1. Its opening move is a what-is-God-like argument: 'We must know what he is like and what his attitude towards us is. Suppose we know that he exists — but what is he like? Like Adolf Hitler: capricious, vindictive, prejudiced and cruel? What a terrible picture of God that would be!' It then answers the question by pointing at Jesus. ⚠ BOUNDARY CREDIT — see boundary_credit below.", rank: 10, score: 0.599 }
    boundary_credit: |
      ⚠️ `/a/tikejimas.html` IS A BOUNDARY CREDIT AND ITS RANK WILL FLAP.
      Round 1 rank 9 (0.619), round 2 rank 10 (0.600), round 3 rank 10 (0.599).
      It sits on the k=10 edge, so a future run may show it in or out and that is
      tie-reordering, not a change in the engine — §0.10 recorded the same
      behaviour on `esru-newcomer-krest` and §0.12 on `eshu-skeptic-vagyalom`.

      The case FOR crediting it: the question asks whether anything concrete can
      be said about God's character and his attitude to people, and this document
      opens by posing that exact question and answering it. The case AGAINST: its
      declared subtitle is "Kas yra Jėzus? Ar Jis buvo Dievo Sūnus?" — its
      subject is Jesus' identity, and what-is-God-like is its framing move.
      I KEPT it, because the estate's answer to "what is God like" genuinely is
      "look at Jesus", and dropping it would hide that. OPERATOR MAY DROP — the
      case scores 3/3 with it and 2/2 without, so dropping costs nothing but the
      information.
    reworded: |
      ⚠️ REWORDED ONCE — FAILURE MODE #4, lexical artifact from incidental colour.
      v1: "…Ar krikščionys Jį apskritai laiko asmeniu, turinčiu charakterį, ar
           tiesiog kažkokia VISATOS JĖGA?" ("…or just some force of the universe?")
           → top 0.696, NO SMELL, all 3 credits returned — and it was still wrong.
           Rank 1 was /a/religijose.html, the WORLD-RELIGIONS article, because
           that is the document that discusses New Age "kosminė sąmonė" (cosmic
           consciousness). "Force of the universe" was scene-setting, exactly the
           `ja` "over drinks" shape, and it fetched the New Age comparison.
      v2 (kept): drops the "force of the universe" phrase and asks instead what
           his character is and how he is disposed towards people.
           → the world-religions article left the top 10 ENTIRELY, and
           /a/kas2.html went rank 4 → **rank 1**.
    rejected:
      - { path: "/a/islamas.html", rank: 3, why: "its chunk enumerating 'God is eternal, God is holy, God is truth, God is now' reads like a what-is-God-like passage, but the document is the six-question Islam FAQ. Credited to case 2. Same call `hu` made." }
      - { path: "/a/tragedija.html", rank: 4, why: "the suffering article — matched on 'why we can trust God', which is about God's reliability in crisis" }
      - { path: "/a/taiparne.html", rank: 5, why: "'Taip ar ne?' — another contentless title, and this one is NOT a trap: read, it is about the most important DECISION a person makes, and it opens on salmon swimming upstream versus a graduate choosing New York or Cleveland. Not a what-is-God-like article." }
      - { path: "/a/malda.html", rank: 6, why: "credited to case 6" }
      - { path: "/a/rysys.html", rank: 7, why: "'Pažinti Dievą asmeniškai' — the Four Spiritual Laws page. THIS IS THE TAIL ITSELF, and it is here on its own merits rather than as a stray match. Not credited: it is a 'begin a relationship' page, not a description of God's character." }
      - { path: "/a/dvasia.html", rank: 8, why: "credited to case 4" }
      - { path: "/a/trejybe.html", rank: 9, why: "credited to case 4" }
    top_score: 0.696

