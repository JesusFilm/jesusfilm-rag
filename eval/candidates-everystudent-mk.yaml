# Phase 5 PART B — golden suite DRAFT for `everystudent-mk` (Macedonian, 49 documents).
# Campaign #111, batch 2. Working record — NOTHING here has been written to
# eval/qa-golden.yaml. Guardrail #4 gates that on an explicit operator approval turn.
#
# Sizing: 49 ÷ 8 = 6.1 → 6 cases.
# Personas: skeptic 2 · newcomer 2 · seeker 1 · believer 1 — the §0.7 six-case split.
# Questions authored IN MACEDONIAN (Cyrillic), not translated from the English menu (§0.6).
#
# ─────────────────────────────────────────────────────────────────────────────
# CORPUS SHAPE — read this before judging any hit
# ─────────────────────────────────────────────────────────────────────────────
#   49 documents, ALL of them `/a/*.html`. **ZERO `/story/` testimonies — 0%.**
#   This is the smallest source in the campaign so far and the FIRST with no `/story/`
#   tree at all. Per §0.12 failure mode #1 — tail severity tracks testimony share —
#   that predicts a MILD tail, and that is exactly what was measured. See the SUMMARY:
#   this source is the low end of the range `hu` (24% testimony) sits at the top of.
#   Personal-testimony content exists but is filed as ARTICLES, not stories:
#   `/a/nadez607.html` (Steve Sawyer, HIV) and `/a/ateist-najde-bog.html`
#   (Marilyn Adamson, atheist). Both behave like testimonies in retrieval.
#   Null-language documents: 0 of 49 (guardrail #3a — nothing excluded).
#   Documents under 1,200 chars: 0 — this source has NO pure-tail pages (#2).
#   Duplicate titles: 1 — "Кој" names TWO different documents, /a/koj104.html and
#   /a/koj204.html (parts 3 and 4 of the cosmological series). Neither is credited,
#   but this is the exact hazard that bit Japanese: credits are declared by PATH.
#
# ⓘ PATHS ARE SHORT PLAIN ASCII (`/a/koje109.html`), NOT percent-encoded Cyrillic.
#   The task brief flagged that `bg` — the closest Cyrillic sibling, §0.11 — had
#   150–250 char percent-encoded Cyrillic paths and that hand-transcribing them was a
#   transcription-error factory. **`mk` does NOT have that shape.** The site is written
#   in Cyrillic but its slugs are Latin transliterations, so `bg`'s hazard #1 does not
#   transfer. Every path here was still copied from the openings dump rather than
#   retyped, and the check script re-verified all 16 against the database (16/16).
#
# DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-mk mk
#   → 42 distinct candidate documents of 49; all ten topics surfaced candidates.
# All 49 documents were then read from the database (title + opening ~900 chars)
# before anything was credited — guardrail #5. Judging by title would have been wrong
# in BOTH directions on this source; three traps are recorded below, one of them new.
#
# ENGINE-CHECKED THREE TIMES (guardrail #8 §2) — .tmp-diag/phase5-check.ts mk mk
#   Round 1: 0 smells (max 0.748) · 2 credits not returned · 15 credits
#   Round 2: 1 smell  (max 0.772) · 1 credit  not returned · 15 credits
#   Round 3: **0 smells (max 0.735)** · **1 credit not returned** · 16 credits
#            — and that one is a DELIBERATE keep, see `bog-realen` on case 1.
#   Round 2 is why there were three rounds, and it is a textbook instance of the
#   warning in the brief: fixing case 1's REACH over-corrected it into a 0.772
#   restatement. Reach and smell pull in opposite directions and one round cannot
#   settle both. Cases 2, 3, 5 and 6 were untouched and identical across all three
#   rounds — only cases 1 and 4 were reworded.
#
# MECHANICAL CHECKS — both green, run inside the check script so they cannot be skipped
#   Guardrail #8 §3: all 16 credited paths resolve to EXACTLY ONE document — 16/16.
#   Guardrail #3a:   no credited document has a null language — 16/16.
#   Short-credit warning (#2): none fired. The shortest credit is
#   `/a/video-dali-bog-e-dobar.html` at 1,477 chars — over the 1,200 line, and it is a
#   real free-will theodicy transcript, not a video promo plus an invitation prayer.
#
# TOPICS DROPPED (4 of 10) — and NONE of them for lack of content.
#   At n=6 the §0.7 split allows 2 skeptic · 2 newcomer · 1 seeker · 1 believer, so
#   four topics could not be sampled. This source genuinely carries all ten. The four
#   were chosen by DOCUMENT DEPTH, so the six that ran could each be judged against a
#   real shelf rather than a single page:
#     • `purpose`   (seeker)   — well carried: /a/mojata305.html (the hammer parable),
#       /a/vistinskiot303.html (three people who reached the summit and were empty) and
#       /a/izvorot302.html (Josh McDowell). Lost the ONE seeker slot to `anxiety` on
