  # ── 3 ─────────────────────────────────── newcomer 🔴 TITLE TRAP HERE
  - id: "esmk-newcomer-energija" # topic: know-god
    persona: newcomer
    topic: know-god
    q: "Кога луѓето ќе кажат „Бог“, мене ми се јавува слика на некаква магловита енергија некаде горе. Дали Тој е воопшто личност со која човек може да има врска?"
    en: "When people say 'God', the picture that comes to my mind is some hazy energy somewhere up there. Is he even a person one can have a relationship with?"
    credits:
      - { path: "/a/idealen-bog.html", en: "How to find the ideal God?! (15.0k). 🔴 TITLE TRAP: the title reads as a how-to-convert piece and names no subject. The body is the estate's six-attributes what-is-God-like article — 'The Bible reveals the following attributes of God… #1: He is greater than us… #2: He can be known personally — today it is popular to think that God is some kind of invisible force…'. That second point answers this question's exact objection.", rank: 1, score: 0.716 }
      - { path: "/a/koje109.html", en: "Who is God? (3.9k) — 'Who is God? What does he look like? SIX PERSONAL CHARACTERISTICS of God': he is a God who can be known, who can be approached, who calls us to speak with him. The short explicit twin of the article above — this source publishes BOTH, which is unusual for the estate.", rank: 2, score: 0.659 }
      - { path: "/a/kade-e-bog.html", en: "Where is God? (3.4k) — 'People say: show me God. But if God is invisible, how can he show himself?' The two-dimensional-paper analogy (a fingertip entering a flat world), then God existing outside our dimensions. Answers the 'hazy energy somewhere up there' half directly.", rank: 5, score: 0.644 }
    the_finding: |
      🔴 SIXTH SOURCE, SAME SYSTEMATIC TITLE TRAP — and `mk` states the pattern most
      clearly of any source so far, because it publishes BOTH halves of it.
      §0.12 #3 records "Why can we rely on / choose the God of the Bible?" as a title
      that is actually the six-attributes what-is-God-like article, seen on `bg` `tr`
      `fa` `pt` `cs`. On `mk` that article is `/a/idealen-bog.html`, titled "How to find
      the ideal God?!" — a title a reviewer files under conversion, and it is RANK 1 for
      the what-is-God-like question at 0.716. Meanwhile the honestly-titled version
      (`/a/koje109.html`, "Who is God?") also exists, at a quarter the length, and comes
      back at rank 2. **The trap is not that the estate hides this article; it is that
      the estate publishes it twice and localises only one of the two titles usefully.**
      A title-only reviewer credits the 3.9k page and misses the 15.0k one.
    rejected:
      - { path: "/a/koj204.html", rank: 3, why: "'Кој' — part 4 of the cosmological series. Rejected on its text: its subject is the properties of the Eternal Something (that it is not a machine, that it can be everywhere yet is distinct from us), which is an argument FOR a personal God's existence — a god-exists question, not a what-is-he-like one. ⚠️ THIS IS ONE OF THE TWO DOCUMENTS SHARING THE TITLE 'Кој'; crediting by title here would have been a coin flip." }
      - { path: "/a/povrzuvanje205.html", rank: 4, why: "the world-religions comparison. It does describe how each faith pictures God, but its subject is the comparison, not the Christian answer." }
      - { path: "/a/molitvi306.html", rank: 6, why: "the prayer article — credited to case 6" }
      - { path: "/a/bog-realen.html", rank: 7, why: "the DNA/Antony Flew article — credited to case 1, where it does NOT return. See the kept_miss there: it is retrievable, just not for the question it answers." }
      - { path: "/a/zapoznaj401.html", rank: 8, why: "'Know God personally' (6.0k) — the Four Spiritual Laws page, exactly the /a/personally.html shape from Part A. A begin-a-relationship page, matched on its tail." }
      - { path: "/a/dalipostoi101.html", rank: 9, why: "credited to case 1" }
      - { path: "/a/vistinskiot303.html", rank: 10, why: "'Real life' — the purpose article. Would have been a credit had `purpose` not been one of the four dropped topics." }
    note: |
      ⓘ FOUR DOCUMENTS ON THIS SOURCE ARE UNJUDGEABLE BY TITLE BY CONSTRUCTION, and on
      `mk` two of them collide outright. `/a/niwto102.html` ("Was there ever nothing?") →
