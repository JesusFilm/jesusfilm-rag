    topic: jesus-death
    q: "Христијаните што ги познавам зборуваат за крстот како да е пресвртница за целиот свет. За мене тоа е само уште едно погубување од пред две илјади години. Не ми е јасно што требало да постигне таа смрт."
    en: "The Christians I know talk about the cross as if it were a turning point for the whole world. To me it is just one more execution from two thousand years ago. I do not understand what that death was supposed to accomplish."
    credits:
      - { path: "/a/isus-umre.html", en: "Why did Jesus die? (13.1k) — a DEDICATED atonement article: 'Here is the meaning of Jesus' death and resurrection, and of his crucifixion.' Works through why the Jewish religious leaders, the Roman authorities and the crowd all wanted him dead, then what the death accomplished: 'all our sins grieve him… we cannot meet even our own standards, let alone his.'", rank: 1, score: 0.696 }
    the_finding: |
      🟢 NINTH CONFIRMATION THAT THE RUSSIAN ATONEMENT GAP IS CORPUS COMPOSITION.
      §0.12 settled this: 8 of 11 batch-1 sources have a dedicated "why did Jesus die?"
      article and rank it 1–5; `ru`, `zh-cn` and `mn` do not. `mk` HAS one, and after the
      reword below it is **rank 1 at 0.696**, coverage 1/1. Not re-opened, just counted.

      🟢 AND THE TAIL IS MILD HERE — WHICH IS THE PREDICTION §0.12 #1 MAKES.
      On `hu` (24% `/story/` testimonies) this same case had tail matches at ranks 1, 2
      AND 3 and the atonement article at rank 5. On `mk` (**0% testimonies**) the
      atonement article is rank 1 and the tail-shaped documents sit at ranks 3, 7 and 10.
      Same estate, same embedder, same question shape, opposite end of the range. The
      rule "tail severity tracks testimony share" now has a floor case as well as a
      ceiling case.
    reworded: |
      ⚠️ REWORDED ONCE, and it is a clean specimen of failure mode #4 (LEXICAL ARTIFACT
      FROM INCIDENTAL COLOUR — the Japanese "over drinks" defect).
      v1: "…Што всушност се сменило со тоа?" ("…What actually CHANGED because of it?")
          → top 0.650, no smell, credit returned at rank 2 — but RANK 1 was
          `/a/vistinskiot303.html`, the PURPOSE article ("Real life"), and rank 6 was
          `/a/izvorot302.html`, "The source of a CHANGED life". The single word "сменило"
          (changed) pulled both of the source's changed-life articles over the atonement
          article. Nothing about the question smelled; it simply retrieved the wrong shelf.
      v2 (kept): asks instead what that death was "требало да постигне" (supposed to
          accomplish), removing the change word entirely.
          → **0.650 → 0.696, and the credit moved rank 2 → RANK 1.** The purpose article
          fell to rank 5 and the changed-life article left the top 10 altogether.
    note: |
      🔑 The question deliberately does NOT contain "прошка за гревовите" (forgiveness of
      sins). §0.12 records that as the estate's trigger phrase — Turkish put it in and got
      Catholic-vs-Christian at rank 1 and marriage advice at rank 2, and removing it
