# evidence_tier: proposed `llm-translated` (nobody available reads Macedonian). This is
# a fact about the REVIEWER, not the language — if anyone on the team reads Macedonian
# and can sanity-check the translations, it should be `human-verified`. OPERATOR TO CONFIRM.

cases:

  # ── 1 ────────────────────────────────── skeptic ⚠ SEE THE KEPT MISS
  - id: "esmk-skeptic-zelba" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "Кај моите пријатели верувањето во Бог поминува како обична желба да постои нешто повеќе. Мене ме интересира дали нешто во самиот свет околу нас укажува дека тоа не е само желба."
    en: "Among my friends, believing in God passes as a plain wish that there is something more. What interests me is whether anything in the world around us indicates that it is not just a wish."
    credits:
      - { path: "/a/dalipostoi101.html", en: "Does God exist? (Marilyn Adamson, 18.6k) — the source's flagship apologetics article. Opens 'Wouldn't you like someone to prove to you just once that God exists? Without evasions and without statements like: you simply have to believe.' Then the six reasons, argued as evidence.", rank: 1, score: 0.735 }
      - { path: "/a/ateist-najde-bog.html", en: "How an atheist found God (Marilyn Adamson, 14.9k) — 'I methodically went through the FIVE OBJECTIVE REASONS why I believe God exists. So my faith in God was not founded on feelings, but on facts, on reasons.' Answers the wish-versus-grounds objection head-on.", rank: 2, score: 0.716 }
      - { path: "/a/zbuneti-naucnici-zakoni-priroda.html", en: "Scientists puzzled by the laws of nature (8.5k) — 'Why are the laws of nature so constant? Read why scientists are so puzzled by the laws of physics.' Coffee always cools, gravity is never random, the speed of light is constant; Sean Carroll quoted, then the order-of-the-universe argument. Squarely 'something in the world around us'.", rank: 6, score: 0.655 }
      - { path: "/a/bog-sozdade-univerzum.html", en: "Did God create the universe? (9.3k) — 'How did the universe begin to exist? Scientists confirm the Big Bang theory.' Hubble, the beginning of space, matter and time, and the problem a beginning poses for non-theist scientists. ADDED after round 2, where it returned uncredited at rank 9 and, on reading, plainly answers the question as asked.", rank: 8, score: 0.645 }
      - { path: "/a/bog-realen.html", en: "Is God real? (5.2k) — 'Science gives us all kinds of reasons to believe in God. Why does DNA matter?' The British philosopher Antony Flew, 'a leading spokesman for atheism', concluding that 'a super-intelligence is the only good explanation for the origin of life and the complexity of nature', then DNA as a written computer program. 🔴 KEPT DELIBERATELY, see below.", rank: NOT IN TOP 10 }
    kept_miss: |
      🔴 THE ONE CREDIT THAT DOES NOT RETURN, AND WHY IT IS KEPT (guardrail #8 §2).
      `/a/bog-realen.html` is this source's SCIENTIFIC-EVIDENCE article. The question
      asks, in as many words, whether anything IN THE WORLD AROUND US indicates that
      belief is more than a wish. Antony Flew reversing his atheism over the origin of
      life, and DNA read as a written program, is that answer. On reflection it does not
      answer some other question, so dropping it would be dishonest — I KEPT it.

      🟢 AND IT IS THE SECOND SOURCE TO DO THIS WITH THE SAME ARTICLE. `everystudent-hu`
      kept `/a/dns.html` on its own god-exists case for exactly this reason (§0.12, `hu`
      case 1): same estate, same Antony Flew / DNA piece, same failure to retrieve for a
      question that explicitly asks for worldly evidence. Two independent sources, two
      independent drafters, same document, same miss. That makes this a REPEATABLE
      retrieval gap in a specific article family rather than a one-source fluke — which
      is worth more to the eval than a clean 5/5 would have been.

      What it measures on `mk`: for a question asking what in the world points to God,
      the engine returns `/a/zowto731.html` at rank 3 (0.715, why God does not perform a
      spectacular miracle), `/a/molitvi306.html` at rank 4 (0.683, the prayer article)
      and `/a/koronavirus.html` at rank 5 (0.664, the anxiety article) AHEAD of the
      science piece. This case will score coverage 4/5, on purpose.

      ⚠️ It is a BOUNDARY credit and will flap. It sat at rank 7 (0.619) in the top 10
      of case 3 in the same run, i.e. it is retrievable, just not for this question.
      Do not read a future 5/5 as a change in the engine.
    reworded: |
      ⚠️ REWORDED TWICE — this case cost more work than the other five combined, and the
      reason is the one the brief predicted: REACH and SMELL pull in opposite directions.
      v1: "…Има ли зад тоа нешто цврсто, или сето тоа е само чувство?"
          ("…Is there anything solid behind it, or is the whole thing just a feeling?")
          → top 0.748, no smell, but only 2 of 4 credits returned. BOTH science articles
          missed. The fact-versus-feeling framing restates `/a/ateist-najde-bog.html`'s
          own line ("my faith was not founded on feelings, but on facts") almost word for
          word, so that one document absorbed the query and the rest of the top 10 filled
          with relational articles: the PRAYER article at rank 2 (0.713), the thirst
          article at rank 5, the anxiety article at rank 6. Failure mode #5 exactly.
          0.748 also sat 0.002 under the smell line, which is not a margin.
      v2: "…Дали има вистински причини да се мисли поинаку — нешто од светот околу нас…?"
          ("…Are there real reasons to think otherwise — something from the world around
          us…?") → top 0.772 🔴 PARAPHRASE SMELL, and 3 of 4 credits returned.
          Fixing reach broke smell: "вистински причини" restates BOTH credited articles'
          own wording — /a/dalipostoi101.html opens "reasons why one should believe in
          God" and /a/ateist-najde-bog.html says "the five objective reasons". On a
          source where two documents both use the word, paraphrasing toward it lands on
          both at once: they came back at 0.772 and 0.770.
      v3 (kept): drops the word "причини" (reasons) entirely and asks instead whether
          anything in the world "укажува" (indicates) that it is not just a wish, keeping
          the menu's wishful-thinking objection.
          → **0.748 → 0.772 → 0.735.** 4 of 5 credits returned, at ranks 1, 2, 6 and 8,
          and `/a/dalipostoi101.html` moved from rank 3 to rank 1. The cost is
          `/a/bog-realen.html`.
    rejected:
      - { path: "/a/zowto731.html", rank: 3, why: "'Why did God not perform some spectacular miracle to prove himself?' (3.2k Q&A). Rank 3 and rejected: its subject is God's RETICENCE about proving himself — Philip Yancey on God leaving us free to choose — not what evidence exists. Same call the `hu` suite made on its twin /a/csodat.html." }
      - { path: "/a/molitvi306.html", rank: 4, why: "the prayer article, at rank 4 for an evidence question. Credited to case 6. See the SUMMARY: this document is this source's universal matcher." }
      - { path: "/a/koronavirus.html", rank: 5, why: "the anxiety article — credited to case 5" }
      - { path: "/a/kade-e-bog.html", rank: 7, why: "credited to case 3. Its subject is God's invisibility, which is a what-is-God-like question, not an evidence one." }
      - { path: "/a/stabilnost301.html", rank: 9, why: "inner peace — credited to case 5" }
      - { path: "/a/povrzuvanje205.html", rank: 10, why: "the world-religions comparison, at rank 10 for an evidence question. Not credited to any case in this suite because `religions` was one of the four dropped topics." }
    top_score: 0.735

