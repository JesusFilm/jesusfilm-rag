# Phase 5 PART B — golden suite DRAFT for `everystudent-mn` (82 documents, Mongolian).
# Campaign #111, tier A source 4 of 14 (after zh-cn §0.8, ru §0.10, bg §0.11).
# Working record — NOTHING here has been written to eval/qa-golden.yaml.
# Guardrail #4 gates that on an explicit operator approval turn.
#
# Sizing: 82 docs ÷ 8 = 10.25, capped at 10 → 10 cases (§0.7 rule).
# Personas: skeptic 4 · newcomer 3 · seeker 2 · believer 1 — matches §0.7 exactly.
# Topics: all ten of the §0.7 approved menu, one case each.
# Questions authored IN MONGOLIAN, not translated word-for-word from the English menu.
#
# HOW THE CANDIDATES WERE FOUND
#   .tmp-diag/phase5-partb-discover.ts everystudent-mn mn
#   → 54 distinct candidate documents of 82, all ten topics covered.
# ALL 82 DOCUMENTS were then dumped from the database (path + title + char count +
# opening ~700 chars) and read — not just the 54 discovery hits, and not the 240-char
# snippets. §0.9's rule: judge the document by its OPENING, never its title and never
# the matched chunk. On this source that changed four judgements (see TITLE TRAPS below).
#
# ENGINE-CHECKED THREE TIMES (guardrail #8 §2) — .tmp-diag/phase5-mn-check.ts
#   Round 1: paraphrase smells 0 · credits not in top 10: 10 · 32 credits
#   Round 2: paraphrase smells 1 🔴 · credits not in top 10: 7 · 30 credits
#   Round 3: paraphrase smells 0 (max 0.738) · credits not in top 10: 5 · 30 credits ✅
#   Round 2's smell was a reword that BACKFIRED — reverted, recorded under case 6.
#
# MECHANICAL CHECKS — both green
#   Guardrail #8 §3: all 30 credited paths resolve to EXACTLY ONE document — 30/30.
#   Guardrail #3a:   no credited document has a null language — 30/30.
#   Source-level:    everystudent-mn has 82 documents, 0 with a null language,
#                    0 duplicated titles (unlike `bg`, whose title→path map collided).
#   30 credits over 30 DISTINCT documents — no document is credited twice.
#
# evidence_tier: llm-translated
#   Both the Mongolian questions and every English gloss below are model-produced and
#   have NOT been read by a Mongolian speaker. This is a fact about the REVIEWER, not
#   the language — matching everystudent-zh-cn / -ru / -bg. If anyone on the team reads
#   Mongolian and can sanity-check them, it should be `human-verified`. OPERATOR TO CONFIRM.

cases:

  # ── 1 ─────────────────────────────────────────────────────────── skeptic
  - id: "esmn-skeptic-notolgoo"               # topic: god-exists
    persona: skeptic
    q: "Найзууд маань Бурхан гэдэг зүгээр л хүний зохиосон зүйл гэж ярьдаг. Түүнийг үнэхээр байдаг гэж үзэх ямар нэг бодит үндэслэл, нотолгоо байдаг юм уу?"
    en: "My friends say God is just something people made up. Is there any real ground or evidence for holding that he actually exists?"
    top_score: 0.704                          # clear of 0.75
    credits:
      - {path: "/a/101Yertontsiyn.html", rank: 8, score: 0.673, en: "Is there a God? Six grounds for his existence — Marilyn Adamson. The canonical article; the Mongolian twin of the Russian /a/estli.html"}
      - {path: "/a/100erdemted.html",    rank: 4, score: 0.696, en: "Laws of nature that astonished scientists — constants, the speed of light, the earth's rotation: why is the universe this ordered?"}
      - {path: "/a/100yertontsiig.html", rank: 7, score: 0.680, en: "Did God create the universe? — the Big Bang, a singular beginning point, and what has to be outside time and space to cause it"}
      - {path: "/a/100boditoi.html",     rank: "NOT IN TOP 10", en: "Is God real? — Antony Flew, the leading atheist philosopher, driven to 'a Super-Intelligence is the only good explanation', and the DNA argument. Directly answers 'people made it up'. KEPT DESPITE THE MISS — see note."}
    rejected:
      - {path: "/a/213Zaan.html",   rank: 1, why: "RANK 1 AND REJECTED. Title reads 'Where does this widespread commonality come from?' — the body is 'Is God an ELEPHANT?', the blind-men-and-the-elephant pluralism piece. Credited to case 9. 🔴 TITLE TRAP — see the header note."}
      - {path: "/a/107Yaagaad.html", rank: 2, why: "credited to case 2 — its subject is what God is LIKE, not whether he exists"}
      - {path: "/a/109Yertontsiyn.html", rank: 4, why: "credited to case 2, same reason"}
      - {path: "/a/100buteev.html", rank: 6, why: "'Who created God?' — answers a counter-objection to the cosmological argument, not 'what grounds are there'. A different question."}
      - {path: "/a/601Emgenelt.html", rank: 5, why: "the disaster/grief article (credited to case 3). Its opening paragraph happens to define who God is, which is why it keeps surfacing across five topics."}
    dropped_after_engine_check:
      - {path: "/a/731Hiyzh.html", why: "'Why doesn't God do a miracle to prove himself?' — credited in rounds 1–2, DROPPED in round 3. On re-reading, its subject is why the evidence is not more dramatic, which is a different objection from 'is there any evidence'. It belongs to a 'why is God hidden' question this suite does not carry."}
    reworded: |
      REWORDED AFTER ROUND 1 — guardrail #8 §2, and it is the §0.7 `know-god` lesson again:
      the reword LOWERED the score and was still the right call.
      v1: "…Найзууд маань Бурханд итгэдэг хүмүүсийг зүгээр л өөрсдийгөө ТАЙВШРУУЛААД
           байгаа юм гэж ярьдаг…"  ("…are just COMFORTING themselves…")  top 0.708
      v1 was not a paraphrase smell, it was worse: the word "comfort" pulled the whole
      comfort/testimony shelf. Its top 10 was /a/300amgalan.html (peace), /a/710Boorhanig.html,
      /a/603Bid.html (grief), /a/306Ezen.html (prayer), /a/601Emgenelt.html (disaster) and
      /a/501Dotno.html (SEX AND INTIMACY, rank 9) — while /a/101Yertontsiyn.html, the
      six-reasons article this question exists to find, was nowhere in the top 10.
      v2 drops all comfort language and asks for grounds. Result: 0.708 → 0.704 (lower),
      but /a/101Yertontsiyn.html enters at rank 8 and /a/100yertontsiig.html at rank 7.
      Landing on the right document is the objective; score is not.
    note: |
      /a/100boditoi.html IS KEPT DESPITE MISSING. It is the estate's "is God real"
      article — the Antony Flew conversion and the DNA-as-information argument — and it
      is the single most on-point answer to "my friends say God was made up". It is
      buried at k>10 by four articles it outranks on subject. Same treatment as
      /a/personally.html in Part A: credit it and let the eval record the gap.

  # ── 2 ────────────────────────────────────────────────────────── newcomer
  - id: "esmn-newcomer-yamarhuu"              # topic: know-god
    persona: newcomer
    q: "«Бурхан» гэхээр надад ямар нэгэн бүрхэг хүч л төсөөлөгддөг болохоос өөр юу ч ойлгогддоггүй. Тэр яг ямархуу нэгэн юм бэ?"
    en: "When I hear 'God' all I picture is some vague force; nothing else comes to mind. What is he actually like?"
    top_score: 0.716
    credits:
      - {path: "/a/109Yertontsiyn.html", rank: 1, score: 0.716, en: "Who is God? What can he be compared to? God's six distinctive characteristics — and he can be known personally. ⚠ The SLUG says 'Yertontsiyn' ('of the universe'); the article is the who-is-God piece. Slug is not evidence either."}
      - {path: "/a/107Yaagaad.html",     rank: 2, score: 0.715, en: "Why choose the God of the Bible? — 'we each picture God as whatever is most complete to us', then #1: God's nature, an incomparably greater God. 21k chars. The Mongolian twin of the Russian /a/vibirat.html. ⚠ SLUG says 'Yaagaad' ('why'), TITLE says 'God's nature'."}
      - {path: "/a/110Ezen.html",        rank: 4, score: 0.685, en: "'Show me God' — is God invisible, a hidden Lord? The flatland analogy: two-dimensional people on a paper cannot see you touching it. Answers the 'vague force somewhere' framing head-on. Twin of the Russian /a/gdyebog.html."}
      - {path: "/a/204Hen2.html",        rank: 6, score: 0.684, en: "'Who 2' — closes the cosmological series: the Eternal One cannot be found by us, so to be known he must 'limit' himself. Exactly why an impersonal force is the wrong picture. ⚠ Title is literally the two characters 'Who 2'."}
    rejected:
      - {path: "/a/601Emgenelt.html", rank: 3, why: "the disaster article again. Its opening does ask 'Who is God?' and answer it — that is the boilerplate-style overlap, not its subject. Credited to case 3."}
      - {path: "/a/100erdemted.html", rank: 6, why: "credited to case 1 — evidence FOR God, not what God is like"}
      - {path: "/a/710Boorhanig.html", rank: 7, why: "credited to case 9 — which God you call on, not what he is like"}
    swapped_after_engine_check:
      - {dropped: "/a/104Hen.html", added: "/a/204Hen2.html", why: "Round 1 credited /a/104Hen.html ('Who', part 3 of the series) and it missed the top 10 while /a/204Hen2.html sat uncredited at rank 5. Re-reading both settled it on CONTENT, not on the score: 104 argues the Eternal Something must be self-sufficient and greatest — a god-exists argument. 204 asks what that One must do to be knowable — a know-god argument. The swap corrects a misassignment the check exposed."}

  # ── 3 ─────────────────────────────────────────────────────────── skeptic
  - id: "esmn-skeptic-osol"                   # topic: suffering
    persona: skeptic
    q: "Өнгөрсөн жил найз маань осолд орж нас барсан. Сайн Бурхан байдаг юм бол яагаад үүнийг зөвшөөрсөн юм бэ гэдгийг надад хэн ч тайлбарлаж чадахгүй байна."
    en: "Last year my friend died in an accident. Nobody can explain to me why, if there is a good God, he allowed that."
    top_score: 0.726
    credits:
      - {path: "/a/605Tegvel.html",    rank: 4, score: 0.697, en: "So why do bad things happen? — Stacy James. 'If God is always good and all-powerful, why doesn't he do something?' The ARGUMENT article. Twin of the Russian /a/steysi2.html."}
      - {path: "/a/602Yaagaad.html",   rank: 5, score: 0.697, en: "Why is life so hard? — why cancer, why earthquakes that destroy whole cities. Twin of the Russian /a/pochemu.html."}
      - {path: "/a/711Tagalzah.html",  rank: 6, score: 0.688, en: "Q/A: Why did God create people who would reject him? — the free-will theodicy; its own opening asks 'why does he allow suffering and testing?'. ADDED after round 1, where it sat uncredited at rank 6."}
      - {path: "/a/603Bid.html",       rank: 8, score: 0.677, en: "What now? — from bereavement to healing. Opens 'have you faced a natural disaster, or a close friend leaving this world? Did you get an answer from God about why?' — the asker's exact situation."}
      - {path: "/a/601Emgenelt.html",  rank: "NOT IN TOP 10", en: "Where is God when fear, natural disaster and grief come? Finding inner strength, reducing distress and fear. The estate's grief article. KEPT — see note."}
      - {path: "/a/702Gayzovlon.html", rank: "NOT IN TOP 10", en: "Q/A: Doesn't the existence of suffering mean God doesn't care? — the asker's objection stated as the article's own question. Twin of the Russian /a/stradaniy.html, which retrieved at rank 6 there. KEPT."}
    rejected:
      - {path: "/a/607Naydvar.html",  rank: 1, why: "RANK 1 AND REJECTED. An HIV/haemophilia testimony — living hopefully with a terminal diagnosis. A title-and-score reviewer credits this; the text says it is a life story, not an answer to 'why did God allow it'. This document surfaced under FIVE of the ten topics in discovery — the strongest boilerplate-tail signal in the source."}
      - {path: "/a/604Saa.html",      rank: 4, why: "Stacy James's paralysis testimony. Her ARGUMENT is /a/605Tegvel.html, which is credited; this is the story. Exactly the ru steysi1/steysi2 split."}
      - {path: "/a/712Ovchniyg.html", rank: 2, why: "Q/A: why does God allow illness? Borderline — it is a genuine theodicy Q/A, but its subject is disease in the body and its answer is 'the Bible does not tell us why'. The asker lost someone in an accident. Rejected on subject; a reviewer could reasonably disagree."}
      - {path: "/a/514Zalhmaar.html", rank: 7, why: "depression and suicidal thoughts — a different subject"}
      - {path: "/a/608Daraa.html",    rank: 9, why: "what happens after death — the afterlife, not the problem of evil"}
    note: |
      TWO CREDITS DELIBERATELY MISS, and they are the measurement.
      /a/601Emgenelt.html and /a/702Gayzovlon.html are the two documents in this source
      whose SUBJECT is this question — grief, and 'does suffering prove God doesn't
      care'. Both sit outside the top 10 while two personal testimonies
      (/a/607Naydvar.html rank 1, /a/604Saa.html rank 4) sit above them. This case
      scores 4/6 by design. Do not "fix" it by crediting the testimonies.

  # ── 4 ───────────────────────────────────────────────────────────── seeker
  - id: "esmn-seeker-zorilgo"                 # topic: purpose
    persona: seeker
    q: "Өдөр бүр адилхан өнгөрч, эцэст нь юунд ч хүрэхгүй юм шиг санагддаг. Хүн ер нь юуны тулд амьдардаг юм бэ? Надад ямар нэг зорилго байх учиртай юу?"
    en: "Every day passes the same and in the end it feels like it reaches nothing. What do people live for anyway? Am I supposed to have some purpose?"
    top_score: 0.677
    credits:
      - {path: "/a/303Zhinhene.html",     rank: 1, score: 0.677, en: "Real life — three people who found satisfaction, acceptance and purpose. Opens with the man who reached the summit he had aimed his whole life at, and it was not enough."}
      - {path: "/a/305Miniy.html",        rank: 4, score: 0.620, en: "What is my life's purpose? — the hammer parable: a hammer in a toolbox is not being what it is for. Twin of the Russian /a/smisl.html."}
      - {path: "/a/302Oorchlogdson.html", rank: 5, score: 0.614, en: "The source of a changed life — Josh McDowell: 'Who am I? Why am I here in this world? Where am I going?' Twin of the Russian /a/istochnik.html and the Spanish /articulos/lafuente.html, both credited for this same question shape."}
    rejected:
      - {path: "/a/509Monhiyn.html", rank: 10, why: "⚠ WAS RANK 1 BEFORE THE REWORD, at 0.628. It is 'Eternal beauty' — a fashion model who discovered that focusing on outward looks is a trap. Its opening reflects on 'what have I become, looking back at my life', which is why it matched an emptiness question. Its subject is beauty and self-worth."}
      - {path: "/a/500gyeroinoos.html", rank: "top-10 pre-reword", why: "'The way out of heroin' — its opening literally asks 'were these ten years of my life all wasted?'. An addiction testimony."}
      - {path: "/a/704Yaagaad.html", rank: 9, why: "Q/A: why do I need God to be happy? — its asker OPENS by saying they have already found happiness. The opposite premise."}
      - {path: "/a/608Daraa.html",   rank: 6, why: "'you're 18–24 at college — then what?' reads like a life-trajectory piece, but the subject is what happens after death"}
      - {path: "/a/211Oyoooon.html", rank: 7, why: "an astrology/occult conversion testimony"}
    reworded: |
      REWORDED AFTER ROUND 1 — guardrail #8 §2.
      v1: "Өдөр бүр орой болоход энэ өдөр юунд ч хүрсэнгүй юм шиг санагддаг.
           Би яг юуны төлөө амьдарч байгаа юм бол?"    top 0.628
      v1 was pure emotional emptiness with no purpose vocabulary, so it retrieved the
      emptiness TESTIMONIES: /a/509Monhiyn.html (beauty) at rank 1,
      /a/500gyeroinoos.html (heroin) at rank 5, /a/514Zalhmaar.html (suicide) at rank 10 —
      while /a/305Miniy.html, the purpose article itself, was not in the top 10.
      v2 keeps the emptiness but adds the actual question ("what do people live for —
      am I supposed to have a purpose?"). Result: 0.628 → 0.677, still clear of 0.75,
      and all three credits now retrieve (305 enters at rank 4, 303 climbs 2 → 1).
      This is the mirror image of case 1: there the reword lowered the score, here it
      raised it. In both, what moved was WHICH DOCUMENT came back.

  # ── 5 ───────────────────────────────────────────────────────────── seeker
  - id: "esmn-seeker-tvgshvvr"                # topic: anxiety
    persona: seeker
    q: "Онцгой болсон юм байхгүй атал би бараг байнга дотроо түгшиж, сандарч байдаг. Үүнд итгэл ямар нэгэн байдлаар тус болох уу?"
    en: "Nothing particular has happened, yet I am anxious and on edge almost all the time. Can faith help with that in any way?"
    top_score: 0.686
    credits:
      - {path: "/a/313Doroy.html",   rank: 2, score: 0.683, en: "Jesus: support for the weak — a Princeton student on being wrung out by coursework stress ('what use is putting hope in a dead carpenter?') and what changed"}
      - {path: "/a/300amgalan.html", rank: 4, score: 0.681, en: "Peace in an unstable world — 'whatever happens in the future, you can be at peace and confident.' The estate's peace article; twin of the Russian /a/pokoy.html."}
    rejected:
      - {path: "/a/306Ezen.html",       rank: 1, why: "RANK 1 AND REJECTED — it is the prayer article, credited to case 8. Its closing section on 'unanswered' prayer and God's care is what matched."}
      - {path: "/a/500gyeroinoos.html", rank: 5, why: "🔴 BOILERPLATE TAIL — a heroin-addiction testimony"}
      - {path: "/a/500gyeilyesbi.html", rank: 6, why: "🔴 BOILERPLATE TAIL — 'Gay, lesbian people and God's love'. Precisely the §0.9 specimen: an article on sexuality retrieving for an anxiety question because of the shared closing gospel-summary chunk."}
      - {path: "/a/514Zalhmaar.html",   rank: 7, why: "depression and suicidal thoughts — a different clinical subject from free-floating anxiety, and the same call ru made on /a/sigaretoy.html"}
      - {path: "/a/601Emgenelt.html",   rank: 10, why: "its TITLE contains 'reducing distress and fear', but its OPENING is entirely 'where is God when trouble comes'. It is the grief article; credited to case 3, not here. Judged on the opening, per §0.9."}
      - {path: "/a/309Hetih.html",      rank: "not returned", why: "'Overload and the class timetable' — practical time-management for a university course load. The asker says nothing in particular has happened."}
    content_gap: |
      🟡 `everystudent-mn` HAS NO CHRONIC-ANXIETY ARTICLE. Russian has one
      (/a/chakr.html — a woman's account of years of anxiety, depression, Buddhism, yoga
      and a USD200 energy-healing course) and Bulgarian has one ("How do we cope with
      anxiety?"). Mongolian's only two anxiety-adjacent articles are both ACADEMIC
      STRESS pieces (/a/309Hetih.html, /a/313Doroy.html), and the credited
      /a/300amgalan.html is the general peace article. This case is the thinnest in the
      suite at 2 credits and it is a corpus-composition fact, not a retrieval defect.

  # ── 6 ────────────────────────────────────────────── newcomer ⚠ SEE NOTE
  - id: "esmn-newcomer-zagalmai"              # topic: jesus-death
    persona: newcomer
    q: "Христэд итгэгчид Есүсийн үхлийг маш чухалчилдаг нь ойлгомжтой. Гэхдээ Түүний үхэл яг юуг өөрчилсөн юм бэ гэдэг нь надад ойлгогдохгүй байна."
    en: "It is clear Christians treat Jesus' death as very important. But I do not understand what exactly his death changed."
    top_score: 0.703
    credits:
      - {path: "/a/717Itgeh.html",     rank: 3, score: 0.662, en: "Q/A: what does it mean to 'believe' in Jesus? — 'we must grasp that Jesus died for our sins… what he did on the cross is the ONLY way our sins are forgiven.' The atonement taught as the answer's substance."}
      - {path: "/a/401Yertontsiy.html", rank: "NOT IN TOP 10", en: "Knowing God personally — the Four Spiritual Laws in Mongolian, with the cross as the bridge across the gap our own effort cannot cross. The Mongolian twin of the Chinese /a/personally.html and the Russian /a/uznat.html. KEPT — see note."}
    rejected:
      - {path: "/a/201Moohar.html",       rank: 1, why: "RANK 1 AND REJECTED, and it is a TITLE TRAP. Title: 'What made Jesus special? From the story of Jesus' life…'. Body: Paul E. Little, 'More than blind faith — is Jesus really God? The historical facts about Jesus Christ are not superstition'. Its subject is Jesus' deity and historicity, not what his death accomplished."}
      - {path: "/a/302Oorchlogdson.html", rank: 2, why: "🔴 BOILERPLATE TAIL — the Josh McDowell testimony, credited to case 4"}
      - {path: "/a/206Yesys.html",        rank: 5, why: "BORDERLINE, considered carefully. Its body does state 'Jesus paid the price for sin on the cross, so our sins are forgiven and we are freed from eternal death' — a real atonement paragraph. But its OPENING, and therefore its subject, is 'How is Jesus different from the world religions?'. Credited to case 9, per §0.9's judge-on-the-opening rule."}
      - {path: "/a/718Bidend.html",       rank: "not returned", why: "Q/A: what does Jesus offer us? — a list of benefits (light, satisfaction, eternal life). What he gives, not what his death did."}
      - {path: "/a/203Arvan.html",        rank: 6, why: "why the twelve disciples faced death — resurrection evidence, a different argument"}
      - {path: "/a/601Emgenelt.html",     rank: 4, why: "the disaster article, a fourth topic in which it surfaces"}
    reworded: |
      🔴 A REWORD WAS TESTED IN ROUND 2 AND REVERTED — it is worth keeping because it is
      the clearest paraphrase smell the campaign has produced.
      v2: "Есүс бидний оронд үхсэн гэж хэлдэг. Гэхдээ яагаад хэн нэгэн үхэх ёстой байсан
           юм бэ? Бурхан зүгээр л уучилж болоогүй юм уу?"
          ("They say Jesus died in our place. But why did anyone have to die? Could God
           not have just forgiven?")                          → top 0.751 🔴 SMELL
      That last clause restates /a/724Herev.html's own opening almost word for word
      ("Бурхан үнэхээр нүглийг өршөөдөг л юм бол … зүгээр л уучилж болдоггүй юм уу?"),
      so the engine returned /a/711Tagalzah.html 0.751, /a/701Ezeniyg.html 0.746 and
      /a/724Herev.html 0.733 — three "why doesn't God just forgive" Q/As — and BOTH
      credits fell out of the top 10, including /a/717Itgeh.html which v1 had at rank 3.
      The reword cost a credit AND tripped the smell. v1 is kept unchanged.
      ⚠ NOTE FOR OTHER SUITES: this v2 wording is almost exactly what `bg` used
      successfully (`esbg-newcomer-krast`). It works there because Bulgarian HAS a
      crucifixion article to land on. The same phrasing on a source that lacks one just
      finds the forgiveness Q/As. Phrasing is not portable across sources.
    content_gap: |
      🟡 `everystudent-mn` HAS NO ARTICLE WHOSE SUBJECT IS THE ATONEMENT — no
      "why did Jesus die" / "the crucifixion" page. This is the THIRD language to show
      it (Chinese /a/personally.html at rank 15 in Part A, Russian `esru-newcomer-krest`
      with both credits missing in §0.10). Mongolian is the least bad of the three:
      /a/717Itgeh.html is a Q/A whose ANSWER is the atonement, and it retrieves at rank 3,
      so this case scores 1/2 rather than the Russian 0/2.
      /a/401Yertontsiy.html is KEPT AND EXPECTED TO MISS for the same reason
      /a/personally.html was kept in Part A: it is the document that actually answers,
      and crediting a boilerplate tail instead is the exact error the finding is about.
      ⓘ Bulgarian remains the control (§0.11): it has a crucifixion article and returns
      it at rank 3, so this is corpus composition, not a systemic retrieval defect.

  # ── 7 ─────────────────────────────────────────────────────────── skeptic
  - id: "esmn-skeptic-bibli"                  # topic: bible-trust
    persona: skeptic
    q: "Библийг мянга мянган жилийн өмнө бичээд, гараар хуулж ирсэн гэдэг. Тэгээд одоо байгаа зүйл нь анхных нь хэвээрээ гэдгийг хэн яаж мэдэх юм бэ?"
    en: "They say the Bible was written thousands of years ago and copied by hand. So how does anyone know what we have now is still what it originally was?"
