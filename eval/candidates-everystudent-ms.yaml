      - { path: "/a/100alamsemesta.html", en: "Did God create the universe? (9.9k) — the cosmological-evidence article. Hubble, the Big Bang confirmed as a singular beginning of space, time and matter, and Hume conceding 'I never asserted so absurd a proposition as that anything might arise without a cause.'", rank: 1, score: 0.702 }
