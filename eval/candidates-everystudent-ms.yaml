  - id: "esms-skeptic-anganangan" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "Kawan-kawan saya semua fikir kepercayaan kepada Tuhan itu cuma angan-angan. Saya sendiri bukan jenis yang mudah percaya — kalau memang ada sebab yang munasabah untuk menerima bahawa Tuhan itu benar-benar ada, saya mahu tahu apa sebab-sebabnya, termasuk dari sudut sains."
