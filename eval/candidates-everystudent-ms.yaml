      - { path: "/a/100rasional.html", en: "How do rational people believe in God? (3.7k) — a former atheist on the logical reasoning that leads someone to God: 'the trouble is, I am more the analytical type, and I had a lot of questions that could not just be brushed aside.' The question's 'I am not the type who believes easily' is this article's own starting position.", rank: 3, score: 0.694 }
      - { path: "/a/101wujud.html", en: "Does God exist? Six simple explanations for believing God really exists (Marilyn Adamson, 20.7k) — the source's flagship apologetics article. Opens 'Wouldn't you want someone to show you the evidence for God's existence? Without coercion. Without the statement, you just have to believe.'", rank: 4, score: 0.688 }
      - { path: "/a/100hukumalam.html", en: "Scientists puzzled by the laws of nature (8.6k) — why are the laws of nature so unvarying? Gravity stable and never random, the speed of light constant, the earth turning in 24 hours. Quotes cosmologist Sean Carroll: 'the laws of physics are patterns nature follows without exception.' The regularity-of-nature argument as its own document.", rank: 5, score: 0.685 }
      - { path: "/a/106dna.html", en: "DNA shows that God exists (5.7k) — Dr Antony Flew, a leading spokesman for atheism, on video in December 2004: 'a super-intellect is the only good explanation for the origin of life and the complexity of nature.' Then DNA as a written computer program. The scientific-evidence article the question explicitly asks for.", rank: 10, score: 0.589 }
