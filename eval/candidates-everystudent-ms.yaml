    en: "I understand Christians consider Jesus' death and resurrection a big deal, but I do not understand what it does. If he really was innocent, why was he executed on a cross like a criminal, and what did that event settle?"
    credits:
      - { path: "/a/300mengapamati.html", en: "Why did Jesus die? (11.8k) — a DEDICATED atonement article. Opens 'This is about the death and resurrection of Jesus Christ, the crucifixion of Jesus Christ. Crucifixion was the punishment reserved for the worst criminals.' Then the Passover lamb dying in their place, why that forgiveness was only temporary and had to be repeated yearly, and John's 'Behold the Lamb of God who takes away…'. The question's 'executed like a criminal' is this document's own opening move.", rank: 3, score: 0.666 }
    the_finding: |
      🔴 A NEW ESTATE FINDING — THE TAIL SEVERITY RULE IN §0.12 IS NOT THE WHOLE STORY.
      §0.12 states the boilerplate tail's severity "tracks the testimony share":
      `hu` is 24% `/story/` and had tails at ranks 1, 2 AND 3; `pt` has zero
      testimonies and kept its atonement article at rank 1.

      **`everystudent-ms` has ZERO testimonies and the tail still owns the top of
      this case.** Even at the best of four rounds, with the atonement article
      pulled up to rank 3, the top 10 reads:

        rank  1  0.695  /a/700tawarkan.html      what Jesus offers us — benefits page
        rank  2  0.674  /a/mengenali-Tuhan.html  the Four Spiritual Laws page
        rank  3  0.665  /a/300mengapamati.html   ← THE ANSWER
        rank  4  0.660  /a/107sempurna.html      what God is like
        rank  5  0.656  /a/300berhubung.html     world religions
        rank  6  0.646  /a/607harapan.html       living with hope
        rank  7  0.641  /a/503janjitemu.html     DATING advice
        rank  8  0.640  /a/601tragedi.html       where is God in tragedy
        rank  9  0.629  /a/502perkahwinan.html   MARRIAGE advice
        rank 10  0.627  /a/301kedamaian.html     peace of mind

      Dating at rank 7 and marriage at rank 9 for "what did the crucifixion
      settle" are pure tail matches, and there is not one testimony in the source
      to blame. **The correct statement is that severity tracks how many documents
      carry the invitation tail, and testimonies are only the most reliable
      carriers of it — not the only ones.** On a 100%-article source every article
      still closes with it, so the tail is just as dense; it is simply spread
      across articles instead of stories. Recommend §0.12 failure mode #1 be
      amended with this.

      🟢 THE ATONEMENT GAP FINDING HOLDS. `everystudent-ms` HAS a dedicated
      "why did Jesus die?" article, it retrieves, and the case scores 1/1. That is
      now 9 of 12 sources with one (`ru`, `zh-cn`, `mn` are still the three
      without). §0.12 says do not re-open it; this suite does not.
