  # ── 4 ───────────────────────────── skeptic 🔴 AN ESTATE HYPOTHESIS CONFIRMED
  - id: "esms-skeptic-disalin" # topic: bible-trust
    persona: skeptic
    topic: bible-trust
    q: "Alkitab ditulis beribu tahun dahulu dan disalin dengan tangan berkurun-kurun lamanya, dan ramai berkata teksnya sudah diubah sejak itu. Dari sudut sejarah, apa yang membezakan tulisan itu daripada mana-mana dokumen purba yang lain?"
    en: "The Bible was written thousands of years ago and copied by hand for centuries, and many people say its text has been altered since. Historically, what sets that writing apart from any other ancient document?"
    credits:
      - { path: "/a/215alkitab.html", en: "Can you trust the Bible? (24.4k — the source's LONGEST document). 'Learn who wrote the Bible and how it was written. The history of the Bible that makes it so unique among the sacred texts… written over 1,500 years by 40 writers. Unlike other religious writings, the Bible reads as a factual news account of real events, places, people and dialogue. Historians and archaeologists have repeatedly confirmed its authenticity.' The matched chunk is the archaeology section: the Hittites 'did not exist' until hundreds of references to their civilisation were found; Belshazzar was not a real king of Babylon, until he was.", rank: 1, score: 0.72 }
      - { path: "/a/700pertentangan.html", en: "Are there contradictions in the Bible? (3.1k) — 'Question: are there contradictions in the Bible? Although some claim the Bible is full of contradictions, this is not actually true.' Works the differing wording of the sign over the cross across Matthew, Mark and John as its specimen. Directly about whether the text survived transmission intact, which is the asker's objection.", rank: 2, score: 0.563 }
    the_finding: |
      🟢 THIS CASE CONFIRMS §0.12's CORRECTION, ON THE HARDEST POSSIBLE TEST CASE.
      §0.12 corrected an earlier generalisation in this file: the
      `bible-trust`/*tahrif* pattern is about **publishing, not audience** — Japan
      (not Muslim-majority) routes it through an Islam article; Iran and Czechia
