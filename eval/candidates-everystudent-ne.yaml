# ─────────────────────────────────────────────────────────────────────────────
# SUMMARY
# ─────────────────────────────────────────────────────────────────────────────
# 4 cases · 6 credits · 6 distinct documents (no document credited twice)
# Personas: skeptic 2 · newcomer 1 · seeker 1 — matches the §0.7 4-case row exactly.
# Paraphrase smells: 0 in every round. Suite ceiling 0.684; two cases sit at 0.58–0.59.
# Credits that do not retrieve: 0. Credits dropped after the engine check: 1.
# evidence_tier: llm-translated (operator to confirm).
#
# ── WHY FOUR CASES AND NOT MORE ─────────────────────────────────────────────
# 20 documents is close to enumeration, so the four topics chosen are the four whose answer
# documents are the most clearly DISTINCT — one dedicated article each, no overlap:
#   god-exists  → /a/is-there-a-god.html + /a/atheist.html
#   bible-trust → /a/bible.html
#   jesus-death → /a/why-did-jesus-die.html
#   purpose     → /a/purpose-in-life.html + /a/source.html
#
# SIX TOPICS DROPPED. Only ONE is a real content gap; the other five are size, and each has
# a genuine article that a future expansion of this suite should use:
#
#   🔴 religions   — CONTENT GAP, and it is the finding for this source. `everystudent-ne`
#                    publishes NO world-religions comparison and NO Islam article. English
#                    discovery returned only /a/source.html (0.484, the Josh McDowell
#                    testimony) and /a/ideal-god.html (0.467, the tail magnet) — no document
#                    on this source compares Christianity with Hinduism, Buddhism or Islam.
#                    The estate's `/a/205` world-religions article (German /artikel/hochsten,
#                    Swahili /a/kuunganishwa, Hungarian /a/istenkereses, French /a/205divin)
#                    IS NOT LOCALISED HERE. ⚠️ Nepal is ~81% Hindu, so the audience-based
#                    prior would have predicted this topic to be the source's strongest.
#                    It is its only absent one. Audience predicts nothing; check the shelf.
#                    Manufacturing a case here would have been a guardrail #3a defect.
#
#   know-god     — dropped for SIZE. /a/who-is-god.html (5.5k, the six-attributes article)
