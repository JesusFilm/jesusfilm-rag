# Phase 5 PART B — golden suite DRAFT for `everystudent-pt` (75 documents, suaescolha.com).
# Campaign #111, tier A. Working record — NOTHING here has been written to
# eval/qa-golden.yaml. Guardrail #4 gates that on an explicit operator approval turn.
#
# Sizing: 75 ÷ 8 = 9.4, floor 4, cap 10 → 10 cases (§0.7 rule). No topic dropped.
# Personas: skeptic 4 · newcomer 3 · seeker 2 · believer 1 — matches §0.7 exactly.
# Topics: all ten of the §0.7 approved menu, one case each.
# Questions authored IN BRAZILIAN PORTUGUESE, not translated from the English menu (§0.6).
#
# CORPUS SHAPE — read this before judging any hit
#   75 documents, ALL of them `/a/*.html` articles. No `/story/` shelf — unlike
#   `everystudent-hu`, where 24% of the source was personal testimony. The testimonies
#   here live inside the article namespace (/a/ateia.html, /a/esperanca.html,
#   /a/segredo.html, /a/blues.html, /a/heroina.html, /a/astrologia.html), so the path
#   gives no warning and each one had to be read.
#   Null-language documents: 0 of 75 (guardrail #3a — nothing excluded).
#   Duplicate titles: 0 (the hazard that bit `bg` does not exist here).
#   Shortest document: /a/pratos.html at 1,421 chars — see PURE-TAIL CHECK in the SUMMARY.
#
# DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-pt pt
#   → 56 distinct candidate documents of 75, all ten topics covered.
# Every candidate was then read from the database (title + opening ~800–900 chars +
# character length) before anything was credited — guardrail #5, failure mode B, and
# specifically because of the boilerplate-tail trap recorded in §0.9.
#
# ENGINE-CHECKED TWICE (guardrail #8 §2) — .tmp-diag/phase5-pt-check.ts
#   Round 1: 0 paraphrase smells (max 0.736) · 3 credits not returned · 27 credits
#   Round 2: 0 paraphrase smells (max 0.736) · 1 credit not returned  · 28 credits
#            — and that one is a DELIBERATE keep, see `consolo` below.
#   Only two rounds were needed because no question smelled on the first pass. The
#   round-2 work was all REACH: one question reworded after an A/B of four variants
#   (.tmp-diag/phase5-pt-ab.ts), one credit swapped.
#   FRAGILITY: no credit returns at rank 8, 9 or 10. The lowest returning credit is
#   /a/quem2.html at rank 7. Nothing in this suite is one tie-reorder from falling out.
#
# MECHANICAL CHECKS — both green, run inside the check script so they cannot be skipped
#   Guardrail #8 §3: all 28 credited paths resolve to EXACTLY ONE document — 28/28.
#   Guardrail #3a:   no credited document has a null language — 28/28.
#   No document is credited by more than one case.
#
# Credits are declared by PATH and titles are resolved from the database (the `hu`
# pattern, not the `bg` one): everystudent-pt paths are short plain ASCII while the
# titles carry Portuguese accents and curly quotes, so the title is the transcription
# risk here.
#
# evidence_tier: proposed `llm-translated`. This is a fact about the REVIEWER, not the
# language — if anyone on the team reads Portuguese and can sanity-check the questions,
# it should be `human-verified`. OPERATOR TO CONFIRM.

cases:

  # ── 1 ─────────────────────────────── skeptic ⚠ SEE THE KEPT MISS + THE REWORD
  - id: "espt-skeptic-consolo"                # topic: god-exists
    persona: skeptic
    q: "Meus amigos acham que crer em Deus é só imaginação. Existe alguma coisa sólida por trás disso, do lado da ciência ou da razão, ou é só o que a pessoa sente?"
    en: "My friends think believing in God is just imagination. Is there anything solid behind it, on the science or reason side, or is it only what a person feels?"
    top_score: 0.692                          # clear of 0.75
    credits:
      - {path: "/a/ateia.html",       rank: 1, score: 0.692, en: "How an atheist found God — Marilyn Adamson. 'How do you know God exists?' … 'Obviously God was completely made up.' Then the Golden Gate Bridge analogy: it is the bridge's construction, not how you feel about it, that gets you across. Answers the fact-versus-feeling half head-on."}
      - {path: "/a/provas.html",      rank: 2, score: 0.678, en: "Can you prove God exists? — Gregory E. Ganssle, PhD, on why 'you can't prove God exists' has itself been raised to the level of unquestioned dogma since Kant"}
      - {path: "/a/deusexiste.html",  rank: 4, score: 0.663, en: "Does God exist? Six clear reasons why concluding God exists is not blind faith (Marilyn Adamson) — the source's flagship apologetics article, 21.7k chars, the second-longest document in the corpus"}
      - {path: "/a/universo.html",    rank: 5, score: 0.659, en: "Did God create the universe? — the Big Bang as a singular beginning, and what it costs a non-theist scientist. 10.5k chars"}
      - {path: "/a/natureza.html",    rank: 7, score: 0.629, en: "Laws of nature leave scientists baffled — why the speed of light, gravity and cooling coffee never vary, quoting cosmologist Sean Carroll. The fine-tuning argument"}
      - {path: "/a/deus-e-real.html", rank: "NOT IN TOP 10", en: "DNA proves God is real — Antony Flew, a leading spokesman for atheism, concluding 'super-intelligence is the only good explanation for the origin of life', then DNA as a computer program. 🔴 KEPT DELIBERATELY, see below."}
    kept_miss: |
      🔴 THE ONE CREDIT THAT DOES NOT RETURN, AND WHY IT IS KEPT (guardrail #8 §2).
      /a/deus-e-real.html is this source's SCIENTIFIC-EVIDENCE article. The question
      explicitly asks whether there is anything solid "do lado da ciência" (on the
      science side). This document is that answer, so dropping it would be dishonest —
      it does not answer a different question, it answers this one and loses.

      It missed in ALL FOUR wordings tested in the A/B, including the two that pulled
      /a/natureza.html and /a/universo.html in. So this is not phrasing.

      What it measures: for a question that names science, the engine returns
      /a/coronavirus.html (the ANXIETY article) at rank 3 / 0.666 — ahead of the
      DNA article entirely. This case will score coverage 5/6, on purpose. Same
      treatment `eshu-skeptic-vagyalom` gave /a/dns.html in §0.10-era Hungarian and
      `esbg-skeptic-katastrofa` gave its know-god credit in §0.11.

      ⚠ THIS IS THE SAME ARTICLE. The Hungarian /a/dns.html and the Portuguese
      /a/deus-e-real.html are the estate's one Antony-Flew-and-DNA piece under
      localised slugs, and it failed to retrieve for the god-exists question in BOTH
      languages. Two sources, one behaviour — worth stating as a pattern, not an
      accident.
    reworded: |
      ⚠️ REWORDED ONCE, after an A/B of four variants (.tmp-diag/phase5-pt-ab.ts).
      v1: "…é só um consolo emocional. Existe algum fato concreto por trás disso, ou
           no fim é tudo sentimento?" ("…just emotional comfort. Is there any concrete
           fact behind it, or in the end is it all feeling?")
           → top 0.694, no smell, but only 3 of 6 credits returned. "Consolo emocional"
           dragged the top 10 onto the emotional-comfort shelf: rank 2 was
           /a/coronavirus.html (anxiety), rank 6 /a/tragedia.html, rank 8 /a/feliz.html,
           rank 9 /a/oracoes.html, rank 10 /a/seguranca.html. Failure mode D — an
           incidental emotional noun moved the engine onto the wrong shelf. A
           question-design defect, not a corpus defect.
      v3 (tested, rejected): "…trata a fé como uma escolha pessoal, tipo gosto de
           música…" → top 0.627 but rank 1 became /a/agora.html ("Can't I enjoy myself
           now and deal with God later?"). 3 of 6. THE CLEAN SPECIMEN OF FAILURE MODE E:
           the LOWEST top score of the four variants was also the WORST question.
      v4 (tested, rejected): "…Tem alguma coisa no mundo à nossa volta que aponte pra um
           criador?" → 5 of 6 at 0.664, but pushed /a/ateia.html from rank 1 to rank 7
           and pulled /a/criou.html ("Who created God?", a different objection) to 3.
      v2 (KEPT): names science and reason as the alternative to feeling.
           → **0.692, 5 of 6 credits at ranks 1, 2, 4, 5, 7.** Best reach of the four,
           no smell, and the highest-value document (/a/ateia.html) stays at rank 1.
    rejected:
      - {path: "/a/coronavirus.html", rank: 3, why: "RANK 3 AND REJECTED — the general-ANXIETY article (credited to case 5). Its 'A Ciência aponta para uma solução' section and the author's line about not wanting to be fooled into believing something unreal are what match. Top-3 is not evidence."}
      - {path: "/a/milagres.html",    rank: 6, why: "'Why are there no visible, obvious miracles today?' — its subject is why God does not perform a stunning public miracle, a different objection. Same call the `ru` suite made on /a/chudo.html."}
      - {path: "/a/criou.html",       rank: 8, why: "'Who created God?' — the infinite-regress objection, not the is-there-evidence question"}
      - {path: "/a/quemdeus.html",    rank: 9, why: "credited to case 2"}
      - {path: "/a/ondedeus.html",    rank: 10, why: "'How do you find an invisible God?' — the flatland analogy. Dropped from case 2 (see there); its subject is God's invisibility, not evidence for him."}

  # ── 2 ────────────────────────────── newcomer 🔴 TITLE TRAP + FOUR-PART SERIES
  - id: "espt-newcomer-energia"               # topic: know-god
    persona: newcomer
    q: "Quando as pessoas falam de Deus, a imagem que me vem é uma energia vaga em algum lugar. Ele é alguém de verdade, com personalidade, ou é só uma força?"
    en: "When people talk about God, the image that comes to me is a vague energy somewhere. Is he someone real, with a personality, or is he just a force?"
    top_score: 0.676
    credits:
      - {path: "/a/deusdabiblia.html", rank: 1, score: 0.676, en: "Why choose the God of the Bible? — 18.8k chars. 🔴 TITLE TRAP: the title reads like a which-religion piece. The BODY is a systematic what-is-God-like article, sectioned by attribute: 'A natureza de Deus: um Deus que é maior do que nós', 'um Deus que pode ser conhecido pessoalmente'. Portuguese twin of the Russian /a/vibirat.html, credited there for this same question."}
      - {path: "/a/quemdeus.html",     rank: 3, score: 0.637, en: "Who is God? — 'Uma descrição de como Deus realmente é'. The SIX-ATTRIBUTES article: he can be known, he is approachable, and so on. Portuguese twin of the Russian /a/ktoeto.html, the Hungarian /a/milyen.html and the Bulgarian 'Защо можем да разчитаме на Бог?'"}
      - {path: "/a/quem2.html",        rank: 7, score: 0.588, en: "Who (part 2) — 🔴 TITLE NAMES NOTHING. This is where the Eternal Something is argued to be a PERSON: 'a Alguma Coisa Eterna tem vontade própria; conseqüentemente ela é pessoal… deve ser Alguém Eterno.' It then handles invisibility ('é muito provável que Alguém Eterno seja invisível'). It answers 'is he someone real with a personality, or just a force' more directly than any other document in the source. Portuguese twin of the Hungarian /a/kicsoda2.html, credited there for this same question."}
    dropped_after_engine_check:
      - path: "/a/ondedeus.html"
        why: "'How do you find an invisible God?' — the two-dimensional-people-on-paper analogy, the Portuguese twin of the Russian /a/gdyebog.html, which IS credited in the `ru` suite for this topic. Dropped here because its SUBJECT is why God is hard to SEE, not what he is LIKE, and it missed the top 10 on the round-1 check. /a/quem2.html was credited in its place and covers the invisibility point inside a personhood argument, which is what this question actually asks. OPERATOR MAY OVERRIDE — this is the one place this suite diverges from the Russian precedent."
    note: |
      ⓘ FOUR DOCUMENTS ON THIS SOURCE ARE UNJUDGEABLE BY TITLE BY CONSTRUCTION, and it
      is the SAME four-part series §0.10-era Hungarian recorded:
        /a/nada.html         "Será que o Nada alguma vez existiu?"  (Was there ever Nothing?)
        /a/algumacoisa.html  "Alguma Coisa"                          (Something)
        /a/quem.html         "Quem"                                  (Who)
        /a/quem2.html        "Quem (parte 2)"                        (Who, part 2)
      A cosmological argument published as four documents with sequential titles that
      name no subject. Only the last is credited, and only because its body was read.
      /a/quem.html is REJECTED for this case: its subject is whether the Eternal
      Something is ONE or MANY — a god-exists question. The personhood conclusion is in
      part 2. Crediting both would credit one argument twice.
    rejected:
      - {path: "/a/mulher.html",  rank: 2, why: "RANK 2 AND REJECTED — 'Could God be a woman?' Its subject is God's GENDER and why he chose to reveal himself as 'He', not whether he is personal. Same call the `hu` suite made on /a/no.html."}
      - {path: "/a/divino.html",  rank: 4, why: "credited to case 9"}
      - {path: "/a/islamismo.html", rank: 5, why: "credited to case 7"}
      - {path: "/a/espirito.html", rank: 6, why: "credited to case 10"}
      - {path: "/a/tragedia.html", rank: 8, why: "credited to case 3"}
      - {path: "/a/comum.html",   rank: 9, why: "'What do you have in common with God?' — read in full. It IS an argument that God is personal (we think, feel, communicate, create, imagine because we are made in his image), but its subject is what HUMANS are, not what God is like, and rank 9 is the fragility zone. Rejected on the text and on the rank. The closest borderline call in this suite."}

  # ── 3 ─────────────────────────────────────────────────────────────── skeptic
  - id: "espt-skeptic-acidente"               # topic: suffering
    persona: skeptic
    q: "No ano passado um amigo meu morreu num acidente idiota. Até hoje ninguém consegue me explicar como um Deus bom deixa uma coisa dessas acontecer."
    en: "Last year a friend of mine died in a stupid accident. To this day nobody can explain to me how a good God lets something like that happen."
    top_score: 0.694
    credits:
      - {path: "/a/coisasruins.html",  rank: 1, score: 0.694, en: "Why do bad things happen? — 'Why do people get cancer? Why are there earthquakes that destroy whole cities?' Then: your parents divorce, the girl down the street is abducted, a relative gets cancer. The closest match in the source to the asker's situation. 10.4k chars"}
      - {path: "/a/tragedia.html",     rank: 2, score: 0.654, en: "Where is God in the middle of tragedy? (Marilyn Adamson, 14.4k) — 'Where can we find strength to deal with fears, tragedies, disasters and terrorist attacks? What exactly can we count on God for?'"}
      - {path: "/a/porqueadorar.html", rank: 3, score: 0.652, en: "Why worship a God who allows terrible things to happen? — framed around the rape of a child, and answering with free will: 'não é culpa de Deus que certas pessoas escolheram pegar as coisas boas que ele criou e corrompê-las'"}
    rejected:
      - {path: "/a/esperanca.html",  rank: 4, why: "Steve Sawyer's testimony — a haemophiliac who contracted HIV and hepatitis C from untested blood and spent his remaining years speaking on campuses. Its subject is how he personally kept hope, not why a good God allows it. Same call the `ru` suite made on /a/steysi1.html and the `hu` suite on /a/sawyer.html — this is the same author in three languages."}
      - {path: "/a/deusdabiblia.html", rank: 5, why: "credited to case 2. Its matched chunk IS about God permitting bad things as part of a larger plan, but the document is the what-is-God-like article."}
      - {path: "/a/ateia.html",      rank: 6, why: "credited to case 1"}
      - {path: "/a/video-ajuda-de-Deus.html", rank: 7, why: "⚠ 'God's help in hard times' — a 6.4k VIDEO TRANSCRIPT of /a/tragedia.html (14.4k), which is already credited. The two openings are near-identical ('Quando a tragédia acontece, muitas vezes perguntamos: Deus, onde estás?' vs 'Onde está Deus?'). Crediting a document and its own abridged video twin measures the same text twice and inflates the denominator. Exactly the /a/isten-segitsege.html call in `hu`. Second source, same duplication."}
      - {path: "/a/pessoasboas.html", rank: 8, why: "'Can good people end up in hell?' — judgment, a different question. NOTE: unlike everystudent-es (§0.9), this source DOES carry hell articles — /a/inferno.html and /a/pessoasboas.html — they simply are not the answer here."}
      - {path: "/a/oracoes.html",    rank: 9, why: "credited to case 8"}
      - {path: "/a/coronavirus.html", rank: 10, why: "credited to case 5"}

  # ── 4 ───────────────────────────────────────────────────────────────── seeker
  - id: "espt-seeker-vazio"                   # topic: purpose
    persona: seeker
    q: "Todo dia é igual e à noite eu deito com a sensação de que nada daquilo serviu pra nada. Pra que eu estou aqui, afinal?"
    en: "Every day is the same and at night I lie down feeling that none of it was good for anything. What am I here for, after all?"
    top_score: 0.627
    credits:
      - {path: "/a/proposito.html", rank: 1, score: 0.627, en: "What is my purpose in life? — the hammer parable told at length: a hammer with a soul, left in the toolbox, then used for the wrong thing, and still unsatisfied"}
      - {path: "/a/vida.html",      rank: 2, score: 0.594, en: "Real life — three people on where they found fulfilment, acceptance and purpose. The mountaineer who reached the summit and was disappointed, the footballer depressed after winning the World Cup. 17.0k chars"}
      - {path: "/a/filosofia.html", rank: 4, score: 0.576, en: "The value of philosophy — 'Porque estamos aqui? Qual é o nosso propósito? O que nos traz realização, dá sentido à vida?' (Socrates, Plato, Peter Kreeft)"}
      - {path: "/a/segredo.html",   rank: 6, score: 0.565, en: "The secret of a changed life (Josh McDowell) — 'Você já se flagrou dizendo pra você mesmo: Eu odeio a minha vida?' … 'Quem sou eu? Por que estou aqui no mundo? Pra onde eu vou?' Portuguese twin of the Spanish /articulos/lafuente.html, the Russian /a/istochnik.html, the Hungarian /a/forrasa.html and the Bulgarian 'Казвали ли сте си някога мразя живота си?', all credited for this same question shape"}
    rejected:
      - {path: "/a/blues.html",  rank: 3, why: "'Ninth-storey blues' — a first-person account of emotional pain, alcohol, addiction and suicidal thoughts, 27.8k chars. ⚠ FOURTH LANGUAGE, SAME MISFIRE: the Spanish /articulos/blues.html, the Russian /a/sigaretoy.html and the Hungarian /a/blues.html ALL retrieved for the EMPTINESS question rather than a depression one. Four sources, one quirk — this is now a property of the article, not of any one corpus."}
      - {path: "/a/depois.html", rank: 5, why: "'What happens when you die?' — it opens with exactly this asker's life-trajectory feeling ('Você se forma. Arruma um emprego… OK! Mas, E DEPOIS?') but its subject is the afterlife. Close, and rejected on the text."}
      - {path: "/a/feliz.html",  rank: 7, why: "'Why do I need God to be happy?' — the asker there HAS found happiness and is asking why God would add anything. This asker has not. Opposite premise."}
      - {path: "/a/heroina.html", rank: 8, why: "'Free from heroin' — an addiction testimony"}
      - {path: "/a/coisasruins.html", rank: 9, why: "credited to case 3"}
      - {path: "/a/ateia.html",  rank: 10, why: "credited to case 1"}
    note: |
      ⓘ /a/sede.html ("Sacie sua verdadeira sede" — "Quench your real thirst") was
      checked for this case and is NOT a purpose article. It is about ALCOHOL as a
      substitute for real intimacy and friendship. This is the exact document the `hu`
      suite dropped from its purpose case under the localised title /a/szomjadat.html.
      Second source, same trap, and the title is just as misleading in Portuguese.

  # ── 5 ────────────────────────────────────── seeker 🔴 REVERSE TITLE TRAP × 2
  - id: "espt-seeker-ansiedade"               # topic: anxiety
    persona: seeker
    q: "Vivo com uma ansiedade que quase não passa, mesmo quando não tem nada de concreto errado. A fé oferece alguma coisa pra isso?"
    en: "I live with an anxiety that almost never lets up, even when nothing concrete is actually wrong. Does faith offer anything for that?"
    top_score: 0.705
    credits:
      - {path: "/a/coronavirus.html", rank: 1, score: 0.705, en: "Coronavirus and anxiety (Marilyn Adamson, 10.6k). 🔴 REVERSE TITLE TRAP: the title reads as a dated 2020 piece a reviewer would strike out. The BODY broadens in its FIRST paragraph and never goes back — 'você pode também sentir ansiedade por alguma outra ameaça… violência, sensação de medo, racismo, guerras, crise política, pobreza, agressão sexual, escravidão humana, desastres naturais, finanças pessoais, doenças, instabilidade no emprego, relacionamentos estressantes, vícios.' This is the source's general anxiety article. Portuguese twin of the Hungarian /a/koronavirus.html, credited there for this same question."}
      - {path: "/a/chakras.html",     rank: 3, score: 0.659, en: "Anxiety and chakra healing — Rachel Fatyanov, who fought loneliness, depression and anxiety, went through Zen Buddhism, yoga, New Age and occult practice, daily horoscopes, mediums, palm readers, meditation and crystal/energy healing, and paid nearly USD200 for an online chakra-healing course that PROMISED happiness forever. ⚠ A TITLE-ONLY reviewer rejects this as New Age content. Its subject IS chronic anxiety. Portuguese twin of the Russian /a/chakr.html and the Hungarian /a/csakra.html, credited in both."}
      - {path: "/a/seguranca.html",   rank: 4, score: 0.658, en: "Security in an unstable world (18.5k) — 'Em tempos de incertezas, como se pode ter segurança ao invés de preocupação e ansiedade?'"}
    the_finding: |
      🟢 THIS CASE IS THE THIRD INDEPENDENT DEMONSTRATION THAT TITLES ARE UNUSABLE.
      Two of its three credits are documents a title-only reviewer would strike out:
      one looks like an expired pandemic notice, the other looks like New Age
      promotion. Read, they are the two best anxiety documents in the source. The
      same two documents played the same role in `ru` and `hu`. Golden guardrail #5.
    rejected:
      - {path: "/a/oracoes.html",  rank: 2, why: "RANK 2 AND REJECTED — the prayer article (credited to case 8). Its matched chunk is the unanswered-prayer / illness / financial-trouble passage, which is anxiety-adjacent, but the document's subject is prayer."}
      - {path: "/a/tragedia.html", rank: 5, why: "credited to case 3. Its subject is crisis and disaster; anxiety with nothing objectively wrong is not a disaster. Same call the `ru` suite made on /a/gdebog.html and the `hu` suite on /a/faj.html."}
      - {path: "/a/biblia.html",   rank: 6, why: "the 40.5k Bible-reliability article at rank 6 for an anxiety question — a tail/length artifact. Credited to case 7."}
      - {path: "/a/conhecer.html", rank: 7, why: "'What is it like to know God?' — its opening lists what God offers someone who feels alone, but its subject is what a relationship with God IS. Same call the `hu` suite made on /a/kapcsolat.html."}
      - {path: "/a/coisasruins.html", rank: 8, why: "credited to case 3"}
      - {path: "/a/video-ajuda-de-Deus.html", rank: 9, why: "the video twin of /a/tragedia.html — see case 3"}
      - {path: "/a/ateia.html",    rank: 10, why: "credited to case 1"}
    note: |
      ⓘ CONTENT OBSERVATION, NOT A GAP. Like `everystudent-hu` and unlike `everystudent-bg`,
      this source has NO article whose title is anxiety in the abstract. It answers the
      topic through a pandemic-framed general-anxiety article, a security article and a
      New-Age-framed testimony. The topic is covered; the shelf is shaped differently.
      Worth knowing before comparing the two sources' numbers.

  # ── 6 ────────────────────── newcomer 🟢 THE THIRD CONTROL FOR THE RUSSIAN GAP
  - id: "espt-newcomer-cruz"                  # topic: jesus-death
    persona: newcomer
    q: "Meus amigos cristãos falam da cruz como se aquilo tivesse mudado tudo. Pra mim é só uma execução que aconteceu há dois mil anos."
    en: "My Christian friends talk about the cross as if it changed everything. To me it is just an execution that happened two thousand years ago."
    top_score: 0.645
    credits:
      - {path: "/a/morreu.html", rank: 1, score: 0.645, en: "Why did Jesus die? — 'Entenda aqui por que Jesus foi crucificado. Por que ele morreu e ressuscitou?' A DEDICATED atonement article, 16.3k chars, opening on crucifixion as the execution reserved for the worst criminals and working through what that death accomplished."}
    the_finding: |
      🟢 PORTUGUESE IS THE THIRD CONTROL FOR THE RUSSIAN GAP, AND IT AGREES WITH
      BULGARIAN AND HUNGARIAN — but it is the STRONGEST of the three.

      `esru-newcomer-krest` credits two documents and NEITHER retrieves, because
      `everystudent-ru` has no article whose subject is the atonement. Bulgarian has one
      and returns it at rank 3. Hungarian has one and returns it at rank 5. Portuguese
      has one and returns it at **rank 1**, coverage 1/1, with no reword needed.

      FOUR sources, same estate, same embedder, same topic menu. State this whenever the
      Russian expected-miss comes up: the Russian result is corpus composition, not a
      systemic retrieval defect.

      🔴 THE BOILERPLATE TAIL IS STILL VISIBLE UNDERNEATH, though it did not win here.
      Ranks 2, 4 and 5 are all tail matches — a purpose article, a McDowell testimony and
      the Four-Spiritual-Laws video — and rank 8 is the ALCOHOL article. The tail was
      verified on this source, not assumed: /a/toxica.html (nine lies of pornography) and
      /a/intimidade.html (sex and intimacy) both close with the identical invitation
      prayer ("abro a porta da minha vida e O recebo como meu Salvador e Senhor. Obrigado
      por perdoar os meus pecados…"), and /a/casamento.html (marriage) closes with the
