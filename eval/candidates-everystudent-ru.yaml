      - {path: "/a/istochnik.html", rank: 5, score: 0.552, en: "The source of a changed life (Josh McDowell) — 'Who am I? Why am I on earth? Where do I go after death?' Russian twin of /articulos/lafuente.html, credited for the SAME question shape in Part A"}
      - {path: "/a/nastoy.html",    rank: 6, score: 0.527, en: "Real life — three people who reached the summit and were still empty"}
