  # ── 10 ───────────────────────────────────────────────────────── newcomer
  - id: "esru-newcomer-troye"                 # topic: trinity
    persona: newcomer
    q: "В церкви молятся то Иисусу, то Отцу, то Духу. Я никак не пойму — это один и тот же или всё-таки разные?"
