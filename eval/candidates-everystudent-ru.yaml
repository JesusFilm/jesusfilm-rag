  # ── 3 ─────────────────────────────────────────────────────────── skeptic
  - id: "esru-skeptic-avariya"                # topic: suffering
    persona: skeptic
    q: "У меня прошлым летом погиб друг — нелепая авария. И никто не может объяснить, почему добрый Бог такое допускает."
