      - {path: "/a/krasoti.html", rank: 4, why: "beauty and self-esteem"}

  # ── 5 ───────────────────────────────────────────────────────────── seeker
  - id: "esru-seeker-trevoga"                 # topic: anxiety
    persona: seeker
    q: "Меня почти постоянно потряхивает от тревоги, даже когда объективно всё нормально. Может ли вера тут вообще чем-то помочь?"
