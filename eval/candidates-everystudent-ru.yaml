    top_score: 0.738
    credits:
      - {path: "/a/troitsu.html",    rank: 1, score: 0.738, en: "Could you explain the Trinity?"}
      - {path: "/a/svyatoyduh.html", rank: 2, score: 0.638, en: "Who is the Holy Spirit? — 'a person fully equal with God the Father and God the Son… the third person of the Trinity'"}
    reworded: |
      ⚠️ THIS QUESTION WAS REWORDED AFTER THE FIRST ENGINE CHECK — guardrail #8 §2.
      v1: "Говорят, что Бог один, но при этом всё время упоминают Отца, Сына и Духа.
           Получается, их всё-таки трое?"  → top score 0.807 🔴 PARAPHRASE SMELL.
      It restated /a/troitsu.html's own opening ("the Bible clearly speaks of God the
      Father, God the Son and God the Holy Spirit… and shows there is only one God").
      v2 reframes it as something a newcomer NOTICES in a church service rather than
      the doctrinal formula. Result: **0.807 → 0.738, still rank 1.** The target is
      still found; the softball is gone.

