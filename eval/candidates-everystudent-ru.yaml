      - {path: "/a/gdyebog.html", rank: 5, score: 0.587, en: "Where is God? — the flatland analogy: God exists outside our dimensions, which is why he is hard to 'see'. Answers the 'vague force somewhere' directly"}
    dropped_after_engine_check:
