      - {path: "/a/estli.html",       rank: 5, score: 0.633, en: "Is there a God? Six direct grounds for God's existence (Marilyn Adamson)"}
      - {path: "/a/dokazivat.html",   rank: 4, score: 0.635, en: "Can you prove God exists? — Gregory Ganssle, PhD, on why 'you can't prove it' is itself a dogma"}
      - {path: "/a/rukovodstvo.html", rank: 3, score: 0.641, en: "A guide to finding faith — written at the agnostic who would rather not look"}
