      - {path: "/a/chudo.html",    rank: 2, why: "why God does not perform a stunning miracle — a different objection"}
      - {path: "/a/yaroslav.html", rank: 8, why: "personal testimony"}

  # ── 2 ────────────────────────────────────────────────────────── newcomer
