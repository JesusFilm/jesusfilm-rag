    top_score: 0.661
    credits:
      - {path: "/a/chakr.html",           rank: 2, score: 0.656, en: "Anxiety and chakra healing — a woman who suffered loneliness, depression and anxiety, went through Buddhism, yoga, New Age, psychics and USD200 energy-healing courses, and what she found instead. ⚠ A TITLE-ONLY reviewer would reject this as New Age content. Its subject IS chronic anxiety."}
      - {path: "/a/pokoy.html",           rank: 3, score: 0.631, en: "Peace of mind in an unstable world — how to have inner peace and not give in to worry"}
      - {path: "/a/pomoshch-ot-Boga.html", rank: 7, score: 0.613, en: "God's help in hard times"}
    rejected:
      - {path: "/a/gdebog.html", rank: 1, why: "RANK 1 AND REJECTED — it is the disaster article (credited to case 3). Chronic anxiety with nothing objectively wrong is not a disaster. Top-1 is not evidence."}
      - {path: "/a/pitaniem.html", rank: 8, why: "eating disorders"}

  # ── 6 ────────────────────────────────────────────── newcomer ⚠ SEE NOTE
  - id: "esru-newcomer-krest"                 # topic: jesus-death
    persona: newcomer
    q: "Почему нельзя было просто простить людей? Зачем понадобилось, чтобы Иисус умер на кресте?"
    en: "Why couldn't he just forgive people? Why did Jesus have to die on a cross?"
    top_score: 0.734
    credits:
      - {path: "/a/dovyeryat.html", rank: "NOT IN TOP 10", en: "What does it mean to 'trust' Christ? — 'we need forgiveness of our sins and to understand that Jesus died for them. Only through his death on the cross can we be forgiven.' The atonement as the document's SUBJECT."}
      - {path: "/a/uznat.html",     rank: "NOT IN TOP 10", en: "Knowing God personally — the Four Spiritual Laws in Russian; the cross as the bridge"}
    operator_decision_required: |
      🔴 NEITHER CREDIT RETRIEVES. As written this case will score recall@10 = 0 —
      the campaign's first hard-miss case. That is not an accident and not a bad
      question: it is the boilerplate-tail defect, measured.

      `everystudent-ru` has NO article whose subject is what the cross accomplished.
      The atonement is taught INSIDE the two "begin a relationship with God" pages
      above — which are exactly the pages the shared closing invitation-prayer chunk
      buries. The engine instead returns the tails of /a/nastoy.html (0.734),
      /a/reinkarn.html (0.715), /a/katolikom.html (0.706), /a/zhizni.html, /a/soyed.html.

      TWO phrasings were tested, both failed the same way:
        v1 "…I don't understand what exactly it changed"        → both credits missed
        v2 "…why did Jesus have to die on a cross?"  (kept)     → both credits missed
      So this is not phrasing. It is the same defect Part A found in Chinese with
      /a/personally.html at rank 15 — now confirmed independently in a second language.

      OPTIONS:
        (a) KEEP AS IS — recommended. It is the only case in the campaign that
            measures the estate's biggest retrieval defect. Same treatment
            /a/personally.html got in Part A.
        (b) DROP the case — the suite becomes 9 cases and the defect goes unmeasured.
        (c) Credit /a/nastoy.html at rank 1 — REJECTED by me: crediting a tail is
            the exact error the finding is about.

