# Sources 1–3 produced one trap each (§0.7 /a/hochsten.html, §0.8 /a/yesno.html,
# §0.11 "Why can we rely on God?"). everystudent-sk produced FOUR, and two of them
# are the rank-1 and rank-2 hits of the SAME case.
#
# 1. /vznik-vesmiru-4  "Kto? (Vznik vesmíru IV.)"  → "Who? (Origin of the universe IV)"
#    Reads as cosmology. IS the personhood-of-God argument. RANK 1 for know-god.
# 2. /vznik-vesmiru-3  "Niekto (Vznik vesmíru III.)" → "Someone (Origin of the universe III)"
#    Same trap, same series. RANK 2 for know-god. A title-only reviewer files both
#    under god-exists and this case ends up with three credits instead of five.
# 3. /zmenil-sa-mi-zivot "Zmena života: Chcel som dokázať, že Boh neexistuje"
#    → "I wanted to prove God doesn't exist". Reads as an apologetics testimony.
