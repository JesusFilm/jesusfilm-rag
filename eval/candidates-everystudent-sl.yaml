#   1. THE TITLE TRAP CAN BE A DUPLICATED SUBTITLE, AND THEN IT IS UNBEATABLE BY REWORDING.
#      /a/zakajizbratiboga.html and /a/alibogobstaja.html open with the SAME SENTENCE, because
#      vsakstudent.com pasted one article's metadata onto the other. One of them is the
#      six-reasons-God-exists article; the other is the God's-attributes article. Every
#      phrasing that raises one raises the other identically, so the god-exists case can reach
#      rank 2 and no higher. The fix that worked was to match the answer article's BODY rather
#      than its metadata (rank 5 → rank 2). Reviewers comparing `sl`'s numbers against other
#      sources should discount this case's rank by one.
#
#   2. CORPUS SIZE DOES NOT SET THE SMELL CEILING — ANSWER-DOCUMENT SIZE DOES. 23 documents,
#      and round 1 produced 0.783, higher than any of the 14 tier-B sources ever reached. The
#      answer document was a 3.3k / 2-chunk Q&A. Expect smells on short single-subject Q&A
#      documents on every source; the "smaller subcorpora score lower" expectation is wrong.
#
#   3. AT 17% TESTIMONY THE MAGNET IS THE BROADEST ARTICLE, NOT THE INVITATION PAGE. The
