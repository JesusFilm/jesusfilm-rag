#   🔴 The breadcrumb category string is PREPENDED TO CHUNK 0 OF EVERY DOCUMENT.
#   So the literal phrase "Kuunganishwa na Mungu" opens the body of SIX of the 13
#   documents (biblia, imani, kwa-nini-yesu-alikufa, kumjua, utatu-mtakatifu — plus it is
