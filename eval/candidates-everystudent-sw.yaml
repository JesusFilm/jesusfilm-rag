#
# ─── DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-sw sw ───────────
#   → 12 of 13 documents surfaced; all TEN §0.7 topics reached, each at rank 1 on a
#     DIFFERENT document. This source has near-perfect topical coverage for its size —
#     the constraint here is the 4-case floor, not the corpus.
#   Every one of the 13 documents was then read from the database (title + opening
