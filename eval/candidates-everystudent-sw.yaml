# 🔴 THE 0.75 SMELL LINE IS REACHABLE HERE, WHICH CONTRADICTS THE BATCH-2 EXPECTATION.
#   The brief's guidance — carried from Persian and from all 14 tier-B sources — is that
#   0.75 is unreachable and every round should go to reach. On `everystudent-sw` the very
#   first in-language check came back at **0.791** and the reword took it to **0.814**.
#   The English discovery probe for that same topic was 0.612, so in-language ran +0.20
#   over discovery — far beyond the ~0.08 gap `uk` measured.
#   🔑 The reason is corpus SIZE, and it should be expected on every small source left in
#   the campaign: with 13 documents there is exactly ONE article per topic and no
