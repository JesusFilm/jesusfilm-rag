cases:

  # ── 1 ─────────────────────────────────────────────────────────────── skeptic
  - id: "essw-skeptic-hadithi" # topic: bible-trust
    persona: skeptic
    q: "Bibi yangu husoma Biblia kila asubuhi na anasema kila neno ndani yake ni kweli. Mimi nilisoma historia shuleni na najua maandishi ya kale mara nyingi huchanganya mambo yaliyotokea na hadithi za kubuni. Kwa nini hiki kiwe tofauti na yale?"
    en: "My grandmother reads the Bible every morning and says every word in it is true. I studied history at school and I know that ancient writings often mix things that happened with invented stories. Why would this one be different from those?"
    credits:
      - { path: "/a/biblia.html", en: "Why you can believe the Bible (23.4k chars, 15 chunks — the LARGEST document on this source). Opens on who wrote the Bible and how: '1,500 years, 40 writers… unlike other religious writings the Bible reads as a factual account of real events, places, people and conversations. Historians and archaeologists have repeatedly confirmed its accuracy.' The chunk discovery matched is the archaeology section — the Hittites 'did not exist' until hundreds of references to their remarkable civilisation were found, Belshazzar 'was not a real king of Babylon'. This is the source's dedicated Bible-reliability article.", rank: 1, score: 0.656 }
      - { path: "/a/imani.html", en: "⚠ CREDITED ON ITS CHUNK 3, NOT ON ITS TITLE OR ITS SUBJECT — read the note below. The document as a whole is the deity-of-Christ article, but chunk 3 is a self-contained manuscript-reliability argument and it is the second such argument this source carries: 'modern archaeology confirms that there are four biographies of Christ written within the lifetime of the people who saw, heard and followed Jesus. These gospels are full of firm evidence and detail confirming that they were eyewitnesses,' then the late William F. Albright of Johns Hopkins, that there is no reason to believe any Gospel was written after AD 70. That answers the question's 'is there any way to verify it' directly and from a different angle than /a/biblia.html (dating and eyewitnesses, rather than archaeology of the events).", rank: 2, score: 0.569 }
    boundary: |
      ⚠️ FOR THE REVIEWER — `/a/imani.html` IS THE ONE BOUNDARY CREDIT IN THIS SUITE.
      Judged by SUBJECT, this document is "Is Jesus God? Was Jesus Christ only a prophet,
      or God?" — a deity-of-Christ article, and it is REJECTED on exactly that basis in
      case 3 below, where the question is about the cross. It is credited here because one
      of its fourteen chunks makes a standalone Gospel-dating-and-eyewitness argument,
      which is the second half of the bible-trust answer and is not in /a/biblia.html.
      Crediting a document for a section rather than for its subject is the looser call,
      and the reviewer may prefer to drop it and let this case run 1/1 on /a/biblia.html
      alone. I credited it because the question asks how an ordinary person could VERIFY,
      and this chunk is the source's only answer about the manuscripts themselves.
    reworded: |
      ⚠️ REWORDED TWICE, and round 2 got WORSE — the same trajectory `hu` case 7 recorded.
      v1: "…kitabu kilichoandikwa na watu na kunakiliwa kwa mkono karne baada ya karne.
           Kwa nini nikubali kwamba maneno yaliyomo leo ni yale yale yaliyoandikwa
           mwanzoni?" ("…written by people and copied by hand century after century. Why
           should I accept the words in it today are the ones written at the beginning?")
           → top 0.791 🔴 SMELL. It restates /a/biblia.html's own opening frame, which is
           "see who wrote the Bible and how it was written… 1,500 years, 40 writers".
      v2: "…Kuna njia yoyote ya mtu wa kawaida kuthibitisha kama yaliyoandikwa humo
           yalitokea kweli?" ("…is there any way for an ordinary person to verify that
           what is written there actually happened?")
           → top 0.814 🔴 SMELL, WORSE. Paraphrasing away from the origin story landed on
           the article's THESIS instead ("historians and archaeologists have repeatedly
           confirmed its accuracy"). Both v1 and v2 were paraphrases of the same objection.
      v3 (kept): changes WHICH OBJECTION is being made — from "was it preserved / can it
           be verified?" to "ancient writings mix history with legend, why is this one
           different?" — and sets it in a lived scene (grandmother, school history class)
           that dilutes the Bible-vocabulary density.
           → **0.791 → 0.814 → 0.656.** Both credits kept, now ranks 1 and 2.
      This is the `uk` refinement of §0.12 confirmed a second time: reach and smell fight
      each other when the fix is a paraphrase, and move together when the fix changes the
      objection. Two paraphrase rounds bought nothing; one objection change fixed it.
    rejected:
      - { path: "/a/je-kuna-mungu.html", rank: 3, why: "'Is there a God?' — six reasons God exists. The scene mentions a believing grandmother, so the existence article matches, but the question is about a book's historical reliability." }
      - { path: "/a/amani.html", rank: 4, why: "the peace-of-mind article — one of this source's two magnets, at rank 4 for a manuscript question. A tail-shaped match, not an answer." }
      - { path: "/a/kumjua.html", rank: 5, why: "the Four Spiritual Laws page. Its opening does say 'God has made clear in the Bible how we can know him', which is why it matches; it makes no reliability claim." }
      - { path: "/a/kuunganishwa.html", rank: 6, why: "credited to case 2" }
      - { path: "/a/utatu-mtakatifu.html", rank: 7, why: "the Trinity article — matched on 'the Bible speaks clearly about…'" }
    top_score: 0.656

  # ── 2 ────────────────────────────────── skeptic 🔴 THE SYSTEMATIC TITLE TRAP
  - id: "essw-skeptic-uhakika" # topic: religions
    persona: skeptic
    q: "Kazini kwangu kuna Waislamu na kuna Wahindu, na kila mmoja anaeleza imani yake kwa uhakika ule ule kama Wakristo ninaowajua. Kwa nini nifikiri kwamba mmoja wao anaijua kweli kuliko wengine?"
    en: "At my workplace there are Muslims and there are Hindus, and each one explains their faith with the same certainty as the Christians I know. Why should I think that one of them knows the truth better than the others?"
    credits:
      - { path: "/a/kuunganishwa.html", en: "🔴 TITLE TRAP, CONFIRMED ON THIS SOURCE BY READING IT. The title is 'Kuunganishwa na Mungu' — 'Connecting with God' — which names no subject and reads like a generic invitation page; a title-only reviewer files it under conversion and loses the best document in the source. The BODY is the estate's /a/205 world-religions comparison: 'we look at the major world religions… Hinduism, New Age, Buddhism, Islam and Christianity… at the end we explain how the teachings of Jesus differ from those religions.' It then works through karma and rebirth, New Age self-divinity, Nirvana, Allah as 'a mighty and strict judge, merciful to those who follow him depending on the good deeds of their life', and Christianity's one eternal God who offers each person a personal relationship. Same article as the German /artikel/hochsten.html, the Hungarian /a/istenkereses.html and the French /a/205divin.html (§0.7).", rank: 1, score: 0.667 }
    note: |
      ⓘ NO REWORD NEEDED — 0.667 at rank 1 on the first try, and that is because the
      `hu` lesson was applied before the first check rather than after it. `hu` v1 listed
      "Hinduism, Buddhism and Islam" and hit 0.813, the worst smell in that suite, because
      /a/kuunganishwa.html's twin opens with exactly that list in exactly that order — and
      the Swahili article does the same ("Uhindu, Enzi Mpya, Ubudha, Uislamu, na Ukristo").
      This question therefore names only TWO faiths, in the reverse of the article's order,
      and puts them in a workplace rather than in a list. It is also the reason the two
      named are Muslims and Hindus rather than Muslims and Buddhists: both are in the
      article, and both are the communities a Swahili-speaking East African reader actually
      works alongside. Guardrail #6 — the question has to be one a real user would ask.
    rejected:
      - { path: "/a/je-kuna-mungu.html", rank: 2, why: "RANK 2 AND REJECTED — 'Is there a God?', the six-reasons apologetics article. It argues that God exists, not which account of him is right. The nearest miss in the suite." }
      - { path: "/a/imani.html", rank: 3, why: "'Is Jesus God? Every major religion honours him. Was he only a prophet, or God?' — the closest thing this source has to a second religions credit, and I judged it out: its SUBJECT is Jesus' deity argued from the Jewish trial and Roman sources, and the comparative line is one opening sentence, not the article's argument. Same call the `hu` suite made on /a/iszlam.html. ⚠ THE REVIEWER MAY OVERTURN THIS — see the summary." }
      - { path: "/a/utatu-mtakatifu.html", rank: 4, why: "the Trinity article — matched on one-God-versus-many, which is the shape of the Islamic objection, not a comparison of religions" }
      - { path: "/a/amani.html", rank: 5, why: "magnet — the peace article, no comparative content" }
      - { path: "/a/biblia.html", rank: 6, why: "credited to case 1" }
      - { path: "/a/sala-zetu.html", rank: 7, why: "magnet — the prayer article, first-person account plus tail" }
      - { path: "/a/kumjua.html", rank: 8, why: "the Four Spiritual Laws page — pure tail match" }
    top_score: 0.667

  # ── 3 ──────────────────────── newcomer ⚠ THE BOILERPLATE-TAIL TEST FOR THIS SOURCE
  - id: "essw-newcomer-msalaba" # topic: jesus-death
    persona: newcomer
    q: "Wakristo wananiambia Yesu alikufa badala yangu, lakini sielewi jambo hilo hata kidogo. Mimi sikumwomba mtu yeyote afe kwa ajili yangu, wala sistahili hilo. Kifo cha mtu mmoja kinawezaje kulipa kosa la mwingine?"
    en: "Christians tell me Jesus died in my place, but I do not understand that at all. I did not ask anyone to die for me, and I do not deserve it either. How can one person's death pay for another's wrongdoing?"
    credits:
      - { path: "/a/kwa-nini-yesu-alikufa.html", en: "Why did Jesus die? (13.1k chars, 8 chunks) — a DEDICATED atonement article. Its own subtitle: 'this article explains what caused Jesus Christ to be crucified, his death and resurrection, and what it was all about.' It works through who demanded his death (the Jewish religious leaders, the Roman government and the crowd), then what the death was for. `everystudent-sw` therefore does NOT have the `ru`/`zh-cn`/`mn` atonement gap — at 13 documents it still carries the article. Recording that, per §0.12: the gap is corpus composition, and this is the smallest source yet to disprove it for itself.", rank: 1, score: 0.678 }
    the_finding: |
      🟢 THE BOILERPLATE TAIL DOES NOT WIN ANYWHERE ON THIS SOURCE — including here, the
      case where §0.12 says it bites hardest. On `hu` this same topic returned tails at
      ranks 1, 2 AND 3 with the atonement article at rank 5. Here the atonement article is
      rank 1 at 0.678 and this source's verified tail-carrier, /a/kumjua.html (the Four
      Spiritual Laws page — "First Law: God loves you… Third Law: Jesus Christ paid the
      penalty for our sins"), is rank 3 at 0.652. Across all four cases in this suite NO
      tail-carrier and NEITHER magnet takes rank 1 of anything.

      🔑 WHY, and it is worth carrying to the remaining sources: this source has 0%
      testimony BY DOCUMENT — there is not one document here whose genre is a personal
      account. The `ms`/`mk` correction to §0.12 says a 0%-testimony source is not safe
      because one document usually absorbs the whole tail load. That did happen — the load
      is on /a/kumjua.html and, to a lesser degree, on the two magnets — but at 13
      documents each topic has exactly ONE dedicated article and no near-duplicates, so the
      real answer always has a clear lexical field of its own to win on. **Small corpora
      protect against the tail and expose you to paraphrase smell instead** — which is the
      inverse of the large-source pattern and matches what happened to case 1 above.
    reworded: |
      ⚠️ REWORDED TWICE, and the second reword is the most transferable single trick found
      in this suite.
      v1: "…kwangu ni mauaji tu yaliyotokea miaka elfu mbili iliyopita. Kifo cha mtu mmoja
           kilitimiza nini kwa ajili yangu?" → 0.564 top, credit at RANK 2 behind
           /a/imani.html by 0.006. LEXICAL ARTIFACT (failure mode #4): "miaka elfu mbili
           iliyopita" is verbatim in /a/imani.html's opening ("miaka 2,000 iliyopita, Mtoto
           alizaliwa katika zizi"), so the phrase handed rank 1 to the deity article.
      v2: dropped that phrase, added "kinanihusu vipi mimi ninayeishi leo" ("how does it
           concern me, living today") → got WORSE, credit fell to RANK 3. The
           relevance-to-me clause pulled /a/misiba.html ("where is God in hard times",
           whose whole subject is what you can rely on God for) up to rank 2.
      v3 (kept): 🔑 I counted, across all 13 documents, which words occur in the atonement
           article and NOWHERE else. Exactly one useful one came back: **`kustahili`**
           ("to deserve") — 1 chunk in /a/kwa-nini-yesu-alikufa.html, 0 chunks in the other
           twelve. It sits in the substitution passage: "Yesu, ambaye hakutenda dhambi,
           alilipa dhambi zetu msalabani. Sio haki. **Hatukustahili** yeye kuchukua nafasi
           yetu." Building the question's objection around not deserving it ("wala
           sistahili hilo") flipped the case from rank 2 to **rank 1**, 0.670 → 0.678,
           while /a/imani.html fell 0.707 → 0.655.
           → **rank 2 → rank 3 → RANK 1.** One word, measured rather than guessed.
      ⓘ The check is cheap and repeatable and no earlier suite records it: for a credit
      that keeps losing to a near-neighbour, ask the database which vocabulary is unique to
      the credited document, then build the objection around it. It is the reach-side
      counterpart to the smell-side rule about not restating an article's title.
      🔴 Constraint honoured throughout: "msamaha wa dhambi" (forgiveness of sins), the
      estate's trigger phrase, is NOT in this question — §0.12's Turkish finding.
    rejected:
      - { path: "/a/imani.html", rank: 2, why: "RANK 2 AND REJECTED, and it was rank 1 for both earlier versions. 'Is Jesus God?' — 21.2k chars of deity argument that includes the full crucifixion narrative (the scourging, the blasphemy trial, the centurion), which is why any cross question retrieves it. Its subject is WHO Jesus was, not what his death accomplished. Same call `hu` made on /a/hiten.html. It IS credited in case 1, for a different chunk and a different reason." }
      - { path: "/a/kumjua.html", rank: 3, why: "the Four Spiritual Laws page and this source's verified tail-carrier. It states the substitution in one line ('Jesus Christ paid the penalty for our sins for us') but it is a how-to-begin page, not an explanation of the cross. Same call the `hu` suite made on /a/bizni.html and the `bg` suite before it. Rank 3 is as high as the tail gets anywhere in this suite." }
      - { path: "/a/kuunganishwa.html", rank: 4, why: "credited to case 2. It matches because its comparative section discusses what each religion requires as a sacrifice for sin — genuinely adjacent, but it is a survey, not an account of the cross." }
      - { path: "/a/misiba.html", rank: 5, why: "'Where is God in hard times?' — was rank 2 for v2 of this question. Suffering, not atonement." }
      - { path: "/a/biblia.html", rank: 6, why: "credited to case 1" }
      - { path: "/a/amani.html", rank: 7, why: "magnet" }
    top_score: 0.678

  # ── 4 ────────────────────────────────────────── seeker ⚠ THE MAGNET TEST
  - id: "essw-seeker-haikuacha" # topic: purpose
    persona: seeker
    q: "Kila siku naamka, nafanya kazi, narudi nyumbani na kulala, na jioni nahisi kwamba siku nzima haikuacha kitu chochote. Nashindwa kuona maisha yangu yanaelekea wapi wala kama yana maana yoyote."
    en: "Every day I wake up, I work, I come home and sleep, and in the evening I feel that the whole day left nothing behind. I cannot see where my life is heading, or whether it has any meaning at all."
    credits:
      - { path: "/a/kusudi.html", en: "What is my purpose in life? — the hammer parable, told at length: a hammer is made to drive nails; imagine one that is never used and just sits in the toolbox; now imagine that hammer with a soul and self-awareness. Day after day it stays in the box, unhappy without knowing why. Someone takes it out to break branches and it is delighted — held, carried, striking — but at the end of the day it still has not fulfilled what it was made for. This is the SMALLEST document in the source (3,330 chars, 2 chunks) and it is the only one whose subject is what life is for.", rank: 1, score: 0.58 }
    the_finding: |
      🟢 THE SMALLEST DOCUMENT IN THE SOURCE BEATS THE BIGGEST MAGNET, CLEANLY.
      /a/kusudi.html is 3,330 chars and 2 chunks. /a/amani.html is 15,251 chars, 11 chunks,
      and is the document discovery surfaced for FOUR separate topics. On this question the
      2-chunk article takes rank 1 at 0.580 and the magnet is rank 2 at 0.510 — a 0.070
      gap, the widest rank-1-to-rank-2 margin in the suite. Length is not what wins here.
      ⓘ This case is also the only place in the suite where /a/utafutaji.html appears at
      all (rank 4, 0.442). That document — dating, love and the search for real friendship —
      is the estate article §0.12 lists as a confirmed repeat tail-carrier, and it is the
      ONLY one of the 13 that the English discovery pass never surfaced for any topic. It
      surfaces here and only here, on the emptiness question. That is the fourth language
      in which the estate's emptiness question pulls its dating/despair shelf (`es` `ru`
      `hu` `bn` did it with /a/blues.html, which this source does not carry). It does not
      win, and it is not credited.
    rejected:
      - { path: "/a/amani.html", rank: 2, why: "RANK 2 AND REJECTED, and it is the closest boundary call in the suite. 'Peace of mind in an unstable world' genuinely contains an emptiness-after-achievement passage — 'everything I set out to do and achieve at university came true, and I still was not satisfied. Something was missing and I had nowhere else to go', then Becky: 'how often have you thought that if you just had that piece of clothing, or that partner, or got to visit that place, your life would be happy and complete? And how often have you bought that shirt… and left emptier than you started?' That is close to /a/valddi.html, which the `hu` suite DID credit for this topic. I rejected it because `hu`'s document is a dedicated article about people who reached the summit and were still empty, whereas here the passage is an illustration inside an article whose subject is confidence about the FUTURE. `everystudent-sw` has no dedicated emptiness article. ⚠ THE REVIEWER MAY OVERTURN THIS — it is the one rejection I would most expect to be argued with." }
      - { path: "/a/imani.html", rank: 3, why: "credited to case 1 — the deity article, matched on 'his life changed the course of history'" }
      - { path: "/a/utafutaji.html", rank: 4, why: "'Relationships and the search for friendship' — the dating article. See the finding above." }
      - { path: "/a/kumjua.html", rank: 5, why: "the Four Spiritual Laws page — its 'God has a wonderful plan for your life' opening is why it matches a purpose question. Tail." }
      - { path: "/a/misiba.html", rank: 6, why: "hard times — a different condition from an empty routine" }
      - { path: "/a/kwa-nini-yesu-alikufa.html", rank: 10, why: "credited to case 3" }
    top_score: 0.58

