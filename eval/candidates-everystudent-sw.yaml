#   Round 1: 1 paraphrase smell (0.791) · 0 credits missing · 4 credits
#   Round 2: 1 paraphrase smell (0.814 — WORSE) · 0 credits missing · 5 credits
#   Round 3: 0 smells (max top score 0.707) · 0 credits missing · 5 credits
#            — clean, but case 3's credit sat at rank 2 behind a near-neighbour.
#   Round 4: 0 smells (max top score 0.678) · 0 credits missing · 5 credits
