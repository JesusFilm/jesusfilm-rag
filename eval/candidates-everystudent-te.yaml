cases:

  # ── 1 ─────────────────────────────────────────────────────────────── skeptic
  - id: "este-skeptic-ooha" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "నా స్నేహితులంతా దేవుడు అనేది మనుషులు కల్పించుకున్న ఊహ మాత్రమే అంటారు. దీనిని ఖండించడానికి శాస్త్రపరంగా గాని తర్కపరంగా గాని గట్టి ఆధారాలు ఏమైనా ఉన్నాయా?"
    en: "All my friends say God is just an idea people invented. Is there any solid evidence at all, scientific or logical, to refute that?"
    top_score: 0.701
    credits:
      - { path: "/a/created.html", rank: 1, score: 0.701, en: "Who created God? — the LOGICAL-GROUNDS answer. Everything that began to exist has a cause: a book has an author, music has a composer. The steady-state theory gave way to the Big Bang, so our space-time-energy creation has a singular beginning and therefore a creator; God is in a different category and has to be. ⚠️ BOUNDARY CREDIT: at 1,911 chars / 1 chunk it is the SMALLEST document in the source. It is above the 1,200-char pure-tail floor and the check script did not flag it, and its opening is argument all the way through with no invitation prayer — but the operator should know it is thin." }
      - { path: "/a/isthere.html", rank: 2, score: 0.697, en: "Does God exist? — 'Six straightforward reasons to believe God exists.' The source's flagship apologetics article at 17,185 chars: the complexity of our planet, information in DNA, the moral law. Its own framing answers the 'wishful thinking' charge head-on: 'no compulsion, no you-just-have-to-believe.'" }
      - { path: "/a/Godreal.html", rank: 3, score: 0.669, en: "Is God real? — the SCIENTIFIC-EVIDENCE article. The British philosopher Dr Antony Flew, for decades the leading spokesman for atheism, reversing on the evidence in a December 2004 interview: 'a great intelligence is the only good explanation for the origin of life and the complexity of nature.' Then DNA laid out against binary computer code." }
    note: |
      🟢 THE CLEANEST CASE IN THE SUITE. Ranks 1, 2 and 3 are the three credits, in
      the order a reader would want them: the logical argument, the six-reasons
      flagship, the scientific evidence. Nothing had to be reworded.

      Why it worked, in one line: the question asks for GROUNDS, not for comfort.
      Failure mode #5 says emotional framing retrieves emotional documents; the
      inverse held. Naming the two KINDS of grounds wanted — "శాస్త్రపరంగా గాని
      తర్కపరంగా గాని" ("scientific or logical") — is what pulled /a/Godreal.html
      (science) and /a/created.html (logic) in alongside the obvious flagship,
      and it did so without restating any of their titles.
    rejected:
      - { path: "/a/miracles.html", rank: 4, score: 0.653, why: "'Why does God not perform a great miracle and prove himself?' (3,122 ch) — RANK 4 AND REJECTED. Its subject is God's RETICENCE and the free choice to believe or not (Philip Yancey), not whether there is evidence. Its own text even defers on this point: 'yes, there are strong and philosophical proofs — see the article on God's existence', i.e. it points AT /a/isthere.html rather than being it. Same call the `hu` suite made on /a/csodat.html." }
      - { path: "/a/connecting.html", rank: 5, score: 0.631, why: "the world-religions comparison — credited to case 2" }
      - { path: "/a/source.html", rank: 6, score: 0.609, why: "🔑 THE MAGNET. Josh McDowell's changed-life testimony. Credited to case 4, where its actual subject lies." }
      - { path: "/a/reallife.html", rank: 7, score: 0.608, why: "three personal accounts — credited to case 4" }
      - { path: "/a/prayers.html", rank: 8, score: 0.607, why: "the prayer article, at rank 8 for an evidence question. Tail-adjacent match. It is the answer document for the DROPPED prayer topic." }
      - { path: "/a/devil.html", rank: 9, score: 0.607, why: "'Who is Satan?' — matched on the shared 'does X exist / is X real' shape. A different subject." }
      - { path: "/a/tragedy.html", rank: 10, score: 0.597, why: "where is God in tragedy — the answer document for the DROPPED suffering topic" }

  # ── 2 ─────────────────────────── skeptic 🔴 THE WORST TITLE TRAP ON THIS SOURCE
  - id: "este-skeptic-margam" # topic: religions
    persona: skeptic
    topic: religions
    q: "మా ఇంట్లో అందరూ గుడికి వెళ్తారు, నా సహోద్యోగి ఒకరు మసీదుకు వెళ్తారు. ప్రతి ఒక్కరూ తమ మార్గమే సరైనదని అదే నమ్మకంతో చెబుతారు. మరి క్రైస్తవులు చెప్పేది వీటన్నిటికంటే ఎందుకు వేరుగా ఉంటుంది?"
    en: "Everyone in my house goes to the temple, and one of my colleagues goes to the mosque. Every one of them says their own path is the right one, with exactly the same conviction. So why would what Christians say be any different from all of these?"
    top_score: 0.696
    credits:
      - { path: "/a/connecting.html", rank: 1, score: 0.696, en: "🔴 THE TITLE TRAP. Title 'Connecting with God', slug connecting.html — both read as a conversion page. The BODY is the estate's world-religions comparison (15,431 ch): 'The world's major religions and their beliefs about God — Hinduism, Buddhism, Islam, Christianity and the New Age.' Then the contrast plainly: 'Hindus believe in a series of gods and goddesses. Buddhists say there is no deity at all. New Age followers believe they themselves are God. Muslims believe in a mighty but unknowable God.' Closes by setting Jesus' teaching against the rest. Telugu twin of the Hungarian /a/istenkereses.html and the German /artikel/hochsten.html." }
      - { path: "/a/jesusislam.html", rank: 7, score: 0.564, en: "Jesus and Islam (21,783 ch — the LARGEST document in the source). Six questions Muslims and others ask about Jesus, answered: was the Bible altered, does one religion supersede another, is it blasphemy to say God has a Son, did Jesus die on the cross, why not see Jesus as a prophet. Covers the mosque half of the question. ⚠️ BOUNDARY CREDIT — see the note below." }
    note: |
      ⚠️ ONE DELIBERATE DIVERGENCE FROM THE `hu` SUITE, AND THE OPERATOR MAY REVERSE IT.
      `eshu-skeptic-ugyanaz` REJECTED the Hungarian Islam article for this topic, on
      the ground that its own preamble disclaims comparison — and the Telugu preamble
      says the same thing: "సవాళ్ళు లేవు. ఏ రీతిగాను ఏ మతమును గూర్చిన విమర్శలు ఉండవు"
      ("no challenges; no criticism of any religion in any way").

      I credited it here anyway, for a corpus reason rather than a doctrinal one:
      `hu` had a SECOND dedicated comparison article (/a/kulonbseg.html, "what is the
      difference between Christianity and other world religions") to credit instead.
      `te` has none. /a/connecting.html and /a/jesusislam.html are the only two
      documents on this source that set the Christian claim against another faith's,
      and the question explicitly puts a Muslim colleague in the scene. Rejecting it
      would leave the mosque half of the question with no answer key at all.

      It returns at rank 7 / 0.564 — genuinely the weaker of the two, which is the
      honest result. OPERATOR: dropping it makes this a 1/1 case; keeping it makes it
      2/2 and records that te's Islam article does real comparative work.
    the_finding: |
      🔴 THE BOILERPLATE TAIL IS PLAINLY VISIBLE IN THIS CASE'S REJECTS.
      For a question about world religions, the top 10 contains, uncredited:
        rank 2  0.665  /a/source.html      the Josh McDowell testimony — THE MAGNET
        rank 4  0.577  /a/gaylesbian.html  gay/lesbian people and God's love
        rank 8  0.562  /a/intimacy.html    the search for sex and intimacy
      An article about sexual intimacy at rank 8 for "how is Christianity different
      from Hinduism" is a pure template match, and /a/gaylesbian.html is the SAME
      DOCUMENT FAMILY that produced the original §0.9 finding in Chinese and misfired
      again in Hungarian. Third language, same article, same defect.
    rejected:
      - { path: "/a/source.html", rank: 2, score: 0.665, why: "🔑 RANK 2 AND REJECTED — THE MAGNET. Its 'Christianity is not a religion' passage matches, and its chunk here is McDowell recoiling from a girl who answered him with the word 'Jesus' ('I was fed up with religion, fed up with church, fed up with the Bible'). It is a testimony, not a comparison. Credited to case 4." }
      - { path: "/a/isthere.html", rank: 3, score: 0.580, why: "credited to case 1" }
      - { path: "/a/gaylesbian.html", rank: 4, score: 0.577, why: "gay/lesbian people and God's love, at rank 4 for a world-religions question. Textbook boilerplate-tail match — and the third language in which this same article family misfires (§0.9 Chinese, `hu`, now `te`)." }
      - { path: "/a/reallife.html", rank: 5, score: 0.572, why: "three personal accounts — credited to case 4" }
      - { path: "/a/tragedy.html", rank: 6, score: 0.568, why: "the tragedy article — answer document for the DROPPED suffering topic" }
      - { path: "/a/intimacy.html", rank: 8, score: 0.562, why: "'The search for sex and intimacy', at rank 8 for a world-religions question. Pure tail match; the plainest specimen of the defect in this suite." }
      - { path: "/a/finding.html", rank: 9, score: 0.555, why: "peace of mind — answer document for the DROPPED anxiety topic" }
      - { path: "/a/prayers.html", rank: 10, score: 0.554, why: "the prayer article — answer document for the DROPPED prayer topic" }

  # ── 3 ────────────────────────────────────────────────────────────── newcomer
  - id: "este-newcomer-siluva" # topic: jesus-death
    persona: newcomer
    topic: jesus-death
    q: "నా క్రైస్తవ స్నేహితులు సిలువ గురించి చాలా గొప్పగా మాట్లాడతారు. కానీ నాకు అది రెండు వేల సంవత్సరాల క్రితం జరిగిన ఒక మరణ శిక్ష లాగే కనిపిస్తుంది. ఆయన చనిపోవడం వల్ల అసలు ఏమి సాధించబడింది?"
    en: "My Christian friends talk about the cross as if it were something enormous. To me it just looks like an execution that happened two thousand years ago. What was actually accomplished by his dying?"
    top_score: 0.697
    credits:
      - { path: "/a/whydid.html", rank: 1, score: 0.697, en: "Why did Jesus die? — 'What was the purpose of Jesus' death? Why did Jesus have to die for us?' A DEDICATED atonement article, 7,558 ch, working through the blasphemy charge, Isaiah 53 quoted at length, and the annual Passover lamb as the temporary substitute the cross replaced." }
    the_finding: |
      🟢 TELUGU DOES **NOT** REPRODUCE THE HUNGARIAN TAIL DISPLACEMENT ON THIS TOPIC,
      AND THAT IS THE USEFUL RESULT.
      On `hu`, ranks 1, 2 and 3 were all tail matches and the dedicated atonement
      article sat at rank 5. On `te` the atonement article is RANK 1 at 0.697 and the
      tail carriers sit below it:

        rank 1  0.697  /a/whydid.html      ← THE ANSWER
        rank 2  0.684  /a/faith.html       is Jesus God? — his DEITY, not the cross
