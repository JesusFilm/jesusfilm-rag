          → **0.669 → 0.716 → 0.677**, and `/a/106Godreal.html` moved rank 10 → rank 4.
    rejected:
      - { path: "/a/coronavirus.html", rank: 1, why: "RANK 1 AND REJECTED — the anxiety article. See the_finding. Its subject is what to do with worry, not whether there are grounds to believe." }
      - { path: "/a/100Godrealvid.html", rank: 2, why: "RANK 2 AND REJECTED — this is /a/106Godreal.html's own video twin (3,426 ch), the Antony Flew / DNA argument retold as a dramatised student conversation. Not credited, following the `hu` rule that a document and its own video twin measure the same argument twice. ⚠️ OPERATOR: this is the closest call in the suite — the twin OUTRANKS its parent article (0.667 vs 0.639) and its prose is genuinely different, not a transcript. Crediting it is defensible." }
