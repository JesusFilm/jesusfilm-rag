      - { path: "/a/101isthere.html", en: "Does God exist? Six straightforward reasons (Marilyn Adamson), 20.3k chars — the source's flagship apologetics article. Its opening names exactly this asker: 'perhaps you are someone who would like somebody to show you the evidence that God exists, once, with no pressure and no you-have-to-believe.'", rank: 5, score: 0.628 }
      - { path: "/a/106Godreal.html", en: "Does God exist? — what the structure of DNA points to. Antony Flew, the British philosopher who spent years as a leading spokesman for atheism, concluding on a 2004 videotaped interview that 'only something highly intelligent is a good explanation for the origin of life and the complexity of nature'; then DNA set out as a written computer program against binary code. This is the source's checkable-evidence article and the direct Thai counterpart of hu /a/dns.html.", rank: 4, score: 0.637 }
      - { path: "/a/100universe.html", en: "Did God create the universe? — Big Bang cosmology, Edwin Hubble in the late 1920s, and the argument that a universe with a single beginning needs a cause outside time, space and matter. States its own purpose as giving a reader grounds rather than a demand to believe.", rank: 3, score: 0.651 }
    the_finding: |
      🔴 THE STRONGEST REVERSE-TITLE-TRAP RESULT IN THE CAMPAIGN SO FAR, AND IT IS ALSO
      A TEXTBOOK FAILURE MODE #6 — the case scores a clean 0.677 with no smell, and the
      document at rank 1 is still the wrong one.

        rank 1  0.677  /a/coronavirus.html   ← the ANXIETY article
        rank 2  0.667  /a/100Godrealvid.html ← the DNA article's own video twin
        rank 3  0.652  /a/100universe.html   ← credited
        rank 4  0.639  /a/106Godreal.html    ← credited
        rank 5  0.629  /a/101isthere.html    ← credited, and it is the FLAGSHIP article

      `/a/coronavirus.html` is titled "Coronavirus COVID-19 — how do we deal with
      anxiety?", which reads as an expired 2020 notice. On `hu` `pl` `sq` `tr` `pt` `es`
      this same article is the source's general ANXIETY article and is credited at rank 1
      for the anxiety topic (§0.12). **On Thai it is something more: the source's
      cross-topic magnet.** The discovery pass surfaced it for FIVE of the ten topics —
      god-exists, suffering, purpose, anxiety AND prayer — more than any other document.
      Reading it explains why: after the pandemic opening it broadens permanently
      ("terrorism, climate change, ethnic conflict, war, poverty, harassment, slavery,
      natural disasters, money, illness, job security, strained relationships, addiction")
      and then carries a full conversion narrative — "when I was searching for real peace
      I met a friend… it made me wonder whether God actually exists" — which is why it
      outranks the apologetics articles on an evidence question.

      🔑 IT IS NOT AN ARTEFACT OF MY WORDING. It was rank 1 across THREE different
      question wordings: 0.669 with no mention of science, 0.716 with "I studied science",
      0.677 with the settled version. **A property of the source, not of the question.**
      This is the single most useful thing this suite records, and it is exactly what
      guardrail #8 #2 says to record rather than paper over.
    reworded: |
      ⚠️ REWORDED TWICE, and the reason is worth keeping.
      v1: "…I want to know whether there are reasons or checkable information that
           actually support it, not just a private feeling."
          → top 0.669, no smell, but only 2 of 3 credits returned. `/a/106Godreal.html`
            — the DNA article, the one document on this source whose whole subject is
            checkable evidence — did not reach the top 10 at all.
      v2: "…I studied science, so I want to know whether there is anything on the
