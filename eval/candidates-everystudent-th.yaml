  # ── 1 ──────────────────────── skeptic 🔴 THE REVERSE TITLE TRAP, AT ITS WORST
  - id: "esth-skeptic-lakthan" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "เพื่อนๆ ของผมบอกว่าคนที่เชื่อเรื่องพระเจ้าก็แค่คิดเข้าข้างตัวเอง เพราะอยากให้มีอะไรสักอย่างอยู่ข้างบน ผมเรียนสายวิทย์มา เลยอยากรู้ว่าเรื่องที่เราเรียนกัน ทั้งจุดกำเนิดของจักรวาลและรหัสพันธุกรรมในเซลล์ มันมีอะไรที่ตรวจสอบได้จริงๆ ไหมที่ชี้ไปทางนั้น ไม่ใช่แค่ความรู้สึกส่วนตัว"
    en: "My friends say people who believe in God are only flattering themselves, because they want something to be up there. I studied science, so I want to know whether the things we actually study — the origin of the universe, the genetic code in a cell — hold anything checkable that points that way, or whether it is only a private feeling."
