# evidence_tier: proposed `llm-translated` (nobody available reads Turkish). This
# is a fact about the REVIEWER, not the language. OPERATOR TO CONFIRM.

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ HAZARDS SPECIFIC TO THIS SOURCE — read before editing the keys
# ─────────────────────────────────────────────────────────────────────────────
# 1. 🔴 TITLE TRAP — FOURTH SOURCE, FOURTH INSTANCE, and it is the same article
#    as Bulgaria's. `/makaleler/tanrikimdir.html` is titled
#    "Tanrı'ya Neden Güvenebiliriz?" = "Why can we trust God?", but its body opens
#    "Rab neye benzer? Rabbin kişilik özellikleri nelerdir?" ("What is God like?
#    What are God's personality traits?") and lists SIX personal attributes. It is
#    the know-god article, filed under trust by its title. Note the SLUG is honest
#    — `tanrikimdir` literally means "who is God" — so on this source the slug and
#    the title disagree and the slug is the truthful one. Exact twin of
#    `Защо можем да разчитаме на Бог?` (§0.11) and of `/artikel/hochsten.html` (§0.7).
#
# 2. ASCII paths, unlike `bg`. `/makaleler/*.html`, plain, no percent-encoding.
#    One path is MIXED CASE — `/makaleler/KutsalRuh.html` and
#    `/makaleler/Rabiyimidir.html`. Do not lower-case them when transcribing.
#
# 3. THE PROMISCUOUS DOCUMENT: `/makaleler/rehber.html` ("İnancın Rehberi",
#    Guide to Faith) appears in the top 10 of SIX of the ten cases — god-exists
#    (rank 1), know-god (3), suffering (9), anxiety (**rank 1**), prayer (6),
#    religions (9). This is the Turkish equivalent of the Japanese testimony that
#    surfaced in four unrelated cases. It is credited in exactly ONE case
#    (god-exists, where the Russian twin /a/rukovodstvo.html is also credited) and
#    rejected in the other five. Its opening is a meandering meditation on the
#    search for meaning, which is why it matches almost anything emotional.
#
# 4. `/makaleler/imanakil.html` ("What is the relationship between faith and
#    reason?") is the runner-up promiscuous document — top 10 in five cases
#    (god-exists, suffering, anxiety, religions, trinity), credited in NONE. Its
#    subject is a Christian philosopher reconciling revelation and inquiry, not
#    an answer to any of the five questions that retrieve it.

cases:

  # ── 1 ─────────────────────────────────────────────────────────── skeptic
  - id: "estr-skeptic-kanit"                  # topic: god-exists
    persona: skeptic
    q: "Arkadaşlarımın hepsi Tanrı'ya inanmayı bir temenniden ibaret görüyor. Elle tutulur bir dayanağı var mı bunun?"
    en: "All my friends see believing in God as nothing more than wishful thinking. Is there anything tangible to back it up?"
    top_score: 0.704                          # clear of 0.75
    credits:
      - {path: "/makaleler/varmi.html",    rank: 1, score: 0.704, en: "Is there a God? — Reasons to believe. 22.0k chars, the source's flagship apologetics article: 'everyone would like someone to produce a simple proof of God's existence — real evidence instead of \"you just have to believe\"'"}
      - {path: "/makaleler/ispatlar.html", rank: 2, score: 0.691, en: "Can you prove God's existence? — why 'you can't prove it' has itself been elevated into a dogma since Kant. Turkish twin of the Russian /a/dokazivat.html"}
      - {path: "/makaleler/rehber.html",   rank: 3, score: 0.687, en: "A guide to faith — written at the person who suspects there might be more but would rather not look. Turkish twin of the Russian /a/rukovodstvo.html, credited for this same question shape. ⚠ See hazard 3: this is the promiscuous document, credited HERE ONLY"}
      - {path: "/makaleler/ateist.html",   rank: 7, score: 0.651, en: "How an atheist found God — 17.3k chars, a first-person account by someone who kept asking believers 'how do you know God exists?' and got 'well, we just know'. Answers the wishful-thinking charge on its own terms"}
    rejected:
      - {path: "/makaleler/kutsalkitap.html", rank: 4, score: 0.684, why: "the Bible-reliability article — credited to case 7. A different objection"}
      - {path: "/makaleler/dualar.html",      rank: 5, score: 0.683, why: "the prayer article — credited to case 8"}
      - {path: "/makaleler/imanakil.html",    rank: 6, score: 0.659, why: "faith-and-reason philosophy for Christians, not evidence for a skeptic. See hazard 4 — top 10 in five cases, credited in none"}
      - {path: "/makaleler/ichuzur.html",     rank: 8, score: 0.629, why: "inner peace — credited to case 5"}
      - {path: "/makaleler/korona.html",      rank: 9, score: 0.626, why: "credited to case 5"}
      - {path: "/makaleler/kaynak.html",      rank: 10, score: 0.623, why: "credited to case 4"}
    reworded_and_what_it_bought: |
      ⚠️ REWORDED AFTER ROUND 1 — and this is FAILURE MODE C (the lexical artifact),
      caught in the wild for the second time on this estate.
      v1: "Çevremdekiler inancı, kendi başına ayakta duramayanların tutunduğu bir şey
           olarak görüyor…" ("the people around me see faith as something clung to by
           those who can't stand on their own") → top 0.583, NOT a smell — but
           `varmi.html` AND `ateist.html` both fell out of the top 10, and the list
           filled with /makaleler/ichuzur.html (inner peace, rank 2),
           /makaleler/yalnizlikla.html (loneliness, rank 6) and /makaleler/korona.html
           (coronavirus fear, rank 7). The COPING vocabulary — "can't stand", "cling to"
           — drove retrieval, not the subject. Same mechanism as the Japanese
           "over drinks" case, but caused by an emotional register rather than a noun.
      v2 (kept) asks for GROUNDS instead of diagnosing the believer.
      Result: **0.583 → 0.704, and 2/4 credits → 4/4 credits.** The best single
      reword in this suite. Lesson for the remaining suites: an emotionally-framed
      question retrieves emotionally-framed documents regardless of topic.

  # ── 2 ────────────────────────────────────────────────────────── newcomer
  - id: "estr-newcomer-nasilbiri"             # topic: know-god
    persona: newcomer
    q: "Tanrı deyince aklıma uzaklarda duran belirsiz bir güç geliyor. Aslında nasıl biri?"
    en: "When someone says God, what comes to mind is some vague force standing far away. What is he actually like?"
    top_score: 0.656
    credits:
      - {path: "/makaleler/idealtanri.html",  rank: 1, score: 0.656, en: "Finding the ideal God — 18.6k chars, the qualities we would expect a real God to have, enumerated '#1: God is greater than us', '#2: God can be known personally'. Twin of Bulgaria's 'In search of the ideal God'"}
      - {path: "/makaleler/boyutlar.html",    rank: 2, score: 0.643, en: "How do we find an invisible God? — the flatland analogy (two-dimensional people on a sheet of paper who can only see your fingertip). Answers the 'vague force far away' image directly. Twin of the Russian /a/gdyebog.html and Bulgaria's 'Is God invisible?'"}
      - {path: "/makaleler/tanrikimdir.html", rank: 5, score: 0.604, en: "🔴 TITLE TRAP — titled 'Why can we trust God?' but the body opens 'What is God like? What are God's personality traits?' and lists SIX personal attributes. THIS IS THE KNOW-GOD ARTICLE. A title-based reviewer files it under trust and never credits it here. Its slug (`tanrikimdir` = 'who is God') is the honest half. Twin of Bulgaria's `Защо можем да разчитаме на Бог?`"}
    rejected:
      - {path: "/makaleler/rehber.html",   rank: 3, score: 0.622, why: "the promiscuous guide-to-faith article (hazard 3) — credited to case 1"}
      - {path: "/makaleler/dualar.html",   rank: 4, score: 0.620, why: "RANK 4 AND REJECTED — the prayer article, matching on its 'have you ever known someone who really trusted God?' opening. About praying to God, not what God is like"}
      - {path: "/makaleler/trajedi.html",  rank: 6, score: 0.576, why: "the tragedy article — credited to case 3. Its 'God who exists and longs to be known' passage is a boilerplate-adjacent match"}
      - {path: "/makaleler/uclubirlik.html", rank: 7, score: 0.574, why: "the Trinity article — credited to case 10. Answers how God is three-and-one, not what he is like"}
    not_credited_deliberately:
      - {path: "/makaleler/rableiliski.html", en: "What is having a relationship with God like? — did not retrieve at all. Its subject is what a RELATIONSHIP with God is like, not what God is like. Identical call to the Russian /a/znat.html, which §0.10 dropped for the same reason. Consistent across both sources."}

  # ── 3 ─────────────────────────────────────────────────────────── skeptic
  - id: "estr-skeptic-kaza"                   # topic: suffering
    persona: skeptic
    q: "Geçen yıl bir arkadaşımı kazada kaybettim. O günden beri bunun iyi bir Tanrı fikriyle nasıl bağdaştığını çözemiyorum."
    en: "I lost a friend in an accident last year. Since then I can't work out how that squares with the idea of a good God."
    top_score: 0.614
    credits:
      - {path: "/makaleler/trajedi.html",     rank: 1, score: 0.614, en: "Where is God in the middle of tragedy? — 15.1k chars. 'How do we stand up against the terrorist attacks on our society, the terrible tragedies in our lives, the anxiety, the anger, the hatred, the destruction?'"}
      - {path: "/makaleler/Rabiyimidir.html", rank: 5, score: 0.596, en: "Is God good? — a 1.4k video transcript opening 'Is God good? If so, why is there pain and evil?', then the free-will argument. Turkish twin of the Chinese /a/isgodgood.html (rank 1 for this question shape in Part A) and Bulgaria's `Добър ли е Бог?`. NOTE: in Bulgarian this document did NOT retrieve; in Turkish it does, at rank 5"}
      - {path: "/makaleler/zor.html",         rank: 8, score: 0.583, en: "Why is life so hard? — 'How do we explain the evil we see in this world? Terror attacks, sex trafficking, racism, hunger…' and the wake-up list: our parents divorce, a girl is abducted, a relative gets cancer"}
    rejected:
      - {path: "/makaleler/umut2.html", rank: 2, score: 0.614, why: "RANK 2 (tied on score with rank 1) AND REJECTED — 'How to be hopeful', Steve's journey from HIV rage to hope. Its subject is COPING, not theodicy. The asker is not asking how to feel better, he is asking how the facts fit together"}
      - {path: "/makaleler/olum.html",  rank: 3, score: 0.605, why: "'How to face death' — fear of one's own mortality. Same call §0.9 made on the Spanish /articulos/inevitable.html"}
      - {path: "/makaleler/huznu.html", rank: 4, score: 0.603, why: "'Ninth-floor blues' — 28.4k depression-and-suicide testimony. Turkish twin of the Russian /a/sigaretoy.html and Spanish /articulos/blues.html, BOTH of which retrieved for the wrong question in their own sources too. Third independent sighting of the same cross-source quirk"}
      - {path: "/makaleler/korona.html", rank: 6, score: 0.596, why: "credited to case 5"}
      - {path: "/makaleler/ateist.html", rank: 7, score: 0.593, why: "conversion testimony — credited to case 1"}
    dropped_after_engine_check:
      - path: "/makaleler/tapinma.html"
        en: "Why should I believe in a God who allows terrible things to happen?"
        why: >
          On its title this is the single most on-point document in the source, and it did NOT
          retrieve in the top 10. Reading it settles the question rather than raising it: the
          article is framed ENTIRELY around child abuse ("Question: why should I believe in a
          God who allows terrible things like child abuse?") and answers via human free will —
          i.e. why God permits people to do evil to each other. An accidental death is nobody's
          evil choice, so the article answers a different question. DROPPED rather than
          credited-and-missed. Same call `bg` made on "Is there a God?" for its crutch case.

  # ── 4 ───────────────────────────────────────────────────────────── seeker
  - id: "estr-seeker-bosluk"                  # topic: purpose
    persona: seeker
    q: "Her günün sonunda geriye hiçbir şey kalmamış gibi hissediyorum. Yıllardır böyle. Bütün bunlar ne için?"
    en: "At the end of every day I feel like nothing is left of it. It has been like this for years. What is all of this for?"
    top_score: 0.631
    credits:
      - {path: "/makaleler/yasaminanlami.html", rank: 1, score: 0.631, en: "'Gerçek Yaşam' (Real Life) — 15.6k chars. ⚠ MILD TITLE/SLUG MISMATCH: the slug says 'meaning of life', the title says 'Real Life'. Body: 'The real meaning of life. These three perspectives show where it can be found' — the man who climbed his mountain and was empty at the summit. Turkish twin of the Russian /a/nastoy.html"}
      - {path: "/makaleler/simdi.html",         rank: 3, score: 0.616, en: "Is there more to this life? — 'Hey! You, looking at the screen! Another moment of your life just went by.' Written at exactly this feeling. Twin of Bulgaria's 'Is there more to this life?'"}
      - {path: "/makaleler/yasamamaci.html",    rank: 4, score: 0.546, en: "What is my life's purpose? — the hammer parable (a hammer with a soul, locked in the toolbox, that breaks kindling and is still unfulfilled). Twin of the Russian /a/smisl.html"}
      - {path: "/makaleler/kaynak.html",        rank: 8, score: 0.532, en: "The source of a changed life — 'Have you ever said to yourself, I hate my life?' Josh McDowell's 'Who am I? Why am I on this earth? Where am I going?'. Turkish twin of the Spanish /articulos/lafuente.html, the Russian /a/istochnik.html and the Bulgarian 'Have you ever said I hate my life?' — all credited for this same question shape"}
      - {path: "/makaleler/felsefe.html",       rank: "NOT IN TOP 10", en: "The importance of philosophy — opening: 'Neden buradayız? Amacımız ne? Hayata doyum ve anlam katan şeyler nedir?' ('Why are we here? What is our purpose? What gives life satisfaction and meaning?'). Socrates, Plato, Aristotle, Peter Kreeft. KEPT DELIBERATELY, see below"}
    kept_as_an_honest_miss: |
      `/makaleler/felsefe.html` does not retrieve, and it is KEPT. Guardrail #8 §2:
      "keep the honest phrasing and let the eval record the gap — a case that always
      passes measures nothing." The document's own opening asks the asker's question
      almost verbatim, so this is not a mis-credit; it is the engine missing a correct
      answer. Its Bulgarian twin ("The fundamental questions of life") retrieved at
      rank 4 for the same question shape, so the miss is specific to `tr`.
      This case will score coverage 4/5, on purpose.
    rejected:
      - {path: "/makaleler/huznu.html",        rank: 2, score: 0.620, why: "RANK 2 AND REJECTED — the depression/suicide testimony again (see case 3). Third source in which this article retrieves for the EMPTINESS question rather than the depression one"}
      - {path: "/makaleler/yasamdansonra.html", rank: 6, score: 0.542, why: "'What happens after we die?' — mortality is not the same question as purpose. Same call `bg` made at its rank 2"}
      - {path: "/makaleler/seks.html",         rank: 7, score: 0.537, why: "🔴 BOILERPLATE TAIL — 'Why my views on dating changed', a 20.2k article listing 10 reasons to save sex for marriage. It has no bearing on the meaning of life; its closing gospel summary is what matched. This same article also lands in the top 10 of the anxiety and prayer cases"}
      - {path: "/makaleler/spiritualizm.html",  rank: 9, score: 0.526, why: "the anxiety/chakra testimony — credited to case 5"}
      - {path: "/makaleler/marcia-montenegro.html", rank: 10, score: 0.520, why: "🔴 BOILERPLATE TAIL — 'Astrology, Zen and psychic abilities', a New Age testimony. Also lands in the top 10 of god-exists, jesus-death and religions"}

  # ── 5 ───────────────────────────────────────────────────────────── seeker
  - id: "estr-seeker-kaygi"                   # topic: anxiety
    persona: seeker
    q: "Ortada somut bir sebep yokken bile içimde sürekli bir tedirginlik var. İman bu konuda gerçekten bir şey sunuyor mu?"
    en: "Even when there is no concrete reason, there is a constant unease inside me. Does faith really offer anything for this?"
    top_score: 0.668
    credits:
      - {path: "/makaleler/ichuzur.html",     rank: 3, score: 0.642, en: "Finding inner peace in an uncertain world — 17.8k chars. 'Whatever happens in the world or in our own individual lives, is there somewhere we can find balance?' The source's dedicated peace article"}
      - {path: "/makaleler/korona.html",      rank: 5, score: 0.638, en: "⚠️ REVERSE TITLE TRAP — 'Coping with coronavirus fear'. A title-only reviewer bins this as a dated 2020 page. Its own opening generalises immediately: 'you may also be anxious because of OTHER threats. Every day we face different sources of stress. The list is long — terror, climate change, racism, wars, government failure, poverty, sexual assault, slavery, natural disasters, financial problems, illness, job security, stressful relationships, addiction.' 16.5k chars. Exactly the Japanese COVID-page finding, independently confirmed"}
      - {path: "/makaleler/spiritualizm.html", rank: "NOT IN TOP 10", en: "⚠️ REVERSE TITLE TRAP #2 — 'Anksiyete & Çakra İyileşmesi' (Anxiety & Chakra Healing). A title-only reviewer bins this as New Age content. Its opening: 'Throughout my university years and long after, I struggled with LONELINESS, DEPRESSION, ANXIETY and pessimism' — then Buddhism/Zen, yoga, New Age self-help, daily horoscopes, fortune-tellers, meditation, crystals and energy healing, and what she found instead. It is the ONLY document in this source whose opening subject is chronic anxiety. Turkish twin of the Russian /a/chakr.html. KEPT DELIBERATELY, see below"}
    kept_as_an_honest_miss: |
      🔴 THIS IS THE SUITE'S MOST INFORMATIVE RESULT AND IT SHOULD NOT BE HIDDEN.
      The one Turkish document actually ABOUT chronic anxiety does not retrieve for
      the chronic-anxiety question. Its Russian twin /a/chakr.html retrieved at
      rank 2 for the same question shape (§0.10). The difference is length: the
      Turkish version is 3.6k chars against 16.5k (korona) and 17.8k (ichuzur), so
      it is out-competed by longer documents that mention peace in passing.

      I did NOT reword to rescue it. Adding "meditation" or "crystals" to the
      question would pull it on surface-word overlap — that is failure mode C, the
      exact defect case 1 was reworded to remove. The honest question is the one a
      person with unexplained anxiety actually asks, and it misses. Case scores 2/3.
    rejected:
      - {path: "/makaleler/rehber.html",  rank: 1, score: 0.668, why: "🔴 RANK 1 AND REJECTED — the guide-to-faith article (hazard 3), matching on its 'we are all searching for meaning' opening. Chronic anxiety is not a search for meaning. Top-1 is not evidence"}
      - {path: "/makaleler/dualar.html",  rank: 2, score: 0.646, why: "the prayer article — credited to case 8"}
      - {path: "/makaleler/trajedi.html", rank: 4, score: 0.641, why: "RANK 4 AND REJECTED even though its own subtitle names 'endişe' (anxiety). It is the tragedy article, credited to case 3 — and anxiety with nothing objectively wrong is not a tragedy. Identical call §0.10 made on the Russian /a/gdebog.html at rank 1"}
      - {path: "/makaleler/seks.html",    rank: 10, score: 0.585, why: "🔴 BOILERPLATE TAIL — the dating article again"}

  # ── 6 ────────────────────────────────────────────────────────── newcomer
  - id: "estr-newcomer-carmih"                # topic: jesus-death
    persona: newcomer
    q: "Hristiyanlar İsa'nın çarmıhta ölmesine çok büyük bir anlam yüklüyor ama bu ölümün tam olarak neyi değiştirdiğini anlayamıyorum."
    en: "Christians attach enormous significance to Jesus dying on the cross, but I can't work out what exactly that death changed."
    top_score: 0.701
    credits:
      - {path: "/makaleler/isanedenolmus.html", rank: 2, score: 0.683, en: "Why did Jesus die? — 16.6k chars, a DEDICATED atonement article: 'everything about the death, resurrection and crucifixion of Jesus Christ'. Works the Old Testament lamb sacrifice, why a yearly sacrifice was only a temporary forgiveness, and what the cross settled permanently"}
    the_finding: |
      🟢 TURKEY SIDES WITH BULGARIA, NOT RUSSIA — third data point on the atonement gap.
      §0.10 recorded that `esru-newcomer-krest` cannot retrieve because `everystudent-ru`
      has NO article whose subject is the atonement. §0.11 showed Bulgaria HAS one and it
      retrieves. Turkish has one too — `isanedenolmus.html`, 16.6k chars — and it retrieves
      at rank 2. Two of three tier-A sources checked carry a dedicated atonement article.
      The Russian result is corpus composition, confirmed twice over, not a defect of the
      embedder or of the estate.
    reworded_and_the_finding_inside_it: |
      🔴 REWORDED AFTER ROUND 1, AND THE ROUND-1 FAILURE IS THE CLEANEST SPECIMEN OF THE
      BOILERPLATE-TAIL TRAP THIS CAMPAIGN HAS PRODUCED SINCE §0.9's `xinzhu`.
      v1: "Günahlarımın affedilmesi için neden birinin ölmesi gerekmiş, bunu anlamıyorum.
           Tanrı öylece affedemez miydi?" ("I don't understand why someone had to die for
           my sins to be forgiven. Couldn't God just forgive?") → top **0.755 🔴 SMELL**.

      And the smell was NOT my question restating an article. It was the TAIL:

        | rank | score | document                    | what the document is about        |
        |-----:|------:|-----------------------------|-----------------------------------|
        |    1 | 0.755 | /makaleler/katolik.html     | Catholic vs Christian             |
        |    2 | 0.695 | /makaleler/evlilik.html     | marriage advice, 21.8k chars      |
        |    3 | 0.693 | /makaleler/neden-farklidir  | the five world religions          |
        |    6 | 0.671 | /makaleler/samimiyet.html   | sex and the search for intimacy   |
        |    9 | 0.660 | /makaleler/umut2.html       | living with HIV                   |
        |  **4**|**0.689**|**/makaleler/isanedenolmus**|**THE ATONEMENT ARTICLE**       |

      Marriage advice and a sex-and-intimacy article outranked the atonement article on a
      question about the atonement. The cause is exact: the phrase "günahlarımın
