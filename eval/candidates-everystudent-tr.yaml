#
# ⚠️ SIZING — OPERATOR DECISION WANTED. 71 ÷ 8 = 8.9, which rounds to 9 cases.
# This draft carries TEN, one per §0.7 topic, and here is the case for it:
#   • All ten topics are answered by a DEDICATED Turkish document — verified by
#     reading the opening of all 71 documents from the database, not by title.
#     No topic had to be manufactured. (Contrast `ti` in §0.7, which genuinely
#     lacks five of the ten.)
