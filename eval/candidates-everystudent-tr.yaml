#
# DISCOVERY: .tmp-diag/phase5-partb-discover.ts everystudent-tr tr
#   → 30 distinct candidate documents of 71, all ten topics covered.
#   ⚠️ That 30/71 is the THINNEST discovery pool of the campaign so far
#      (`ru` 66/95, `bg` 58/84, `zh-cn` 51/128). The English discovery probe is a
#      weaker scaffold for Turkish — its top score across all ten topics was
#      0.621. The in-Turkish questions below reach much further (max 0.739), so
#      the thin pool is a property of the PROBE, not of the corpus. Several
#      credited documents below never appeared in discovery at all.
#
# 🔴 EVERY ONE OF THE 71 DOCUMENTS was read from the database (title + opening
# 700–750 chars) before any credit was assigned — guardrail #5. Not a sample of
# candidates: all 71. This is what caught the title trap in case 2 and the two
# reverse traps in case 5.
#
# ENGINE-CHECKED TWICE (guardrail #8 §2) — .tmp-diag/phase5-tr-check.ts
#   Round 1: 27 declared → 2 paraphrase smells (0.755, 0.755), 7 credits not in top 10.
#   Round 2: **0 paraphrase smells** (max top score 0.739), 3 credits not in top 10.
#   Final:   26 credits — one of those 3 (`guven.html`) was then dropped on the
#            text. Removing a credit cannot change retrieval, so round 2's ranks
#            and scores stand as measured; no third run was performed.
#
# MECHANICAL CHECKS — both green
#   Guardrail #8 §3: all 26 credited PATHS resolve to EXACTLY ONE document — 26/26.
#   Guardrail #3a:   no credited document has a null language — 26/26.
#
# 🔴 A CORRECTION TO THE `bg` CHECK TEMPLATE, CARRIED OUT HERE.
# `.tmp-diag/phase5-bg-check.ts` declares credits by TITLE and resolves them to
# paths via the database. That is unsafe: `everystudent-ja` has a DUPLICATED title
# naming two different documents, one of which is a title trap, so a title→path
# map has a 50% chance of silently crediting the wrong one. `phase5-tr-check.ts`
# declares credits BY PATH — the thing `eval-metrics.ts` actually matches on — and
# uses the database only to VALIDATE (one document per path, non-null language).
# Titles are printed for humans and are never load-bearing. Future suites should
# copy the `tr` script, not the `bg` one.
