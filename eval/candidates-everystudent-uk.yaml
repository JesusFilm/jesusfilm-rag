cases:

  # ── 1 ─────────────────────────────────────────────────── skeptic · REWORDED ONCE
  - id: "esuk-skeptic-nauka"            # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "Мої друзі впевнені, що віра в Бога тримається лише на вихованні та емоціях, а наука вже давно пояснює світ і без Нього. Чи є взагалі що на це відповісти?"
    en: "My friends are sure that belief in God rests only on upbringing and emotion, and that science has long since explained the world without him too. Is there anything at all to say in reply?"
    credits:
      - { path: "/a/isnuye.html", en: "'Does God exist?' — Marilyn Adamson's six-arguments article, 15.7k chars and the source's flagship apologetics piece. Its own opening is the question asked here: 'Have you ever wanted to hear hard, convincing evidence for God's existence? No excuses. No \"you just have to believe\".' Then the complexity of the planet, the universe's design, the moral sense.", rank: 4, score: 0.645 }
      - { path: "/a/spravzhniy.html", en: "'Is God real?' — the DNA-code article. Antony Flew, 'a committed atheist' who took part in every kind of debate, concluding on television in December 2004 that 'a supreme Intelligence is the only rational explanation for the origin of life and the complexity of nature'. Then DNA laid out as a four-letter computer program. This is the source's SCIENTIFIC-EVIDENCE document and it answers the 'is there anything solid' half directly.", rank: 5, score: 0.641 }
      - { path: "/a/ateyistka.html", en: "'How an atheist found God' — Marilyn Adamson's own account: 'I could not simply believe. There are people who believe in God but nobody knows why. God was obviously an invention… there was no objective evidence.' She then works through the evidence rather than a feeling. Answers the fact-versus-feeling framing head-on, the same way `hu` /a/ateista.html does.", rank: 2, score: 0.668 }
      - { path: "/a/vsesvit.html", en: "'Did God create the universe?' — the cosmological-beginning article: Hubble, the recession of the galaxies, the Big Bang as a single beginning of matter, space and time, and why a universe with a beginning is a problem for atheist scientists.", rank: 1, score: 0.696 }
      - { path: "/a/pantelyku.html", en: "'The laws of nature have baffled scientists' — why the universe obeys unvarying law everywhere (Sean Carroll and James Trefil's 'principle of universality' are both quoted), and why scientists tend to pass over that fact. A fourth, distinct evidential argument — order, not complexity or origin.", rank: 3, score: 0.664 }
    reworded: |
      ⚠️ REWORDED ONCE, and this single case is the whole §0.12 failure-mode-#5 lesson in
      one measurement — the near-smell and the reach failure had the SAME cause.
      v1: "Мої друзі вважають, що віра в Бога — це просто самозаспокоєння, а не щось
           обґрунтоване. Чи є за цим взагалі якісь тверді підстави, чи це справді лише
           питання почуттів?"
          ("…just self-comfort rather than anything grounded. Is there any solid basis
           behind it at all, or is it really only a matter of feelings?")
          → top **0.748** — 0.002 under the smell line, and 2 of 5 credits missing.
          Two things went wrong together:
            (a) "тверді підстави" (solid grounds) nearly restates /a/isnuye.html's own
                opening line, "Чи хотілося тобі бодай раз почути тверді переконливі докази
                про існування Бога?" ("Have you ever wanted to hear hard, convincing
                evidence for God's existence?"). That is what put the score at 0.748.
            (b) "самозаспокоєння" (self-comfort) + "питання почуттів" (a matter of
                feelings) is emotional framing, and it retrieved emotional documents:
                /a/myr.html (peace of mind) at RANK 2, /a/lykho.html (disaster) at 5 and
                /a/dali.html (bereavement) at 6 — while BOTH cosmology articles
                (/a/vsesvit.html at rank 10, /a/pantelyku.html outside) and the DNA
                article (/a/spravzhniy.html, outside) lost their slots.
      v2 (kept): replaces the feelings framing with the objection an actual sceptic makes
          — that faith is upbringing plus emotion and that science has already explained
          the world without God — and drops the "solid grounds" phrasing entirely.
          → **top 0.748 → 0.695, and 3 of 5 → 5 of 5 credits, at ranks 1, 2, 3, 4 and 5.**
          Both problems were fixed by the same edit, which is not what §0.12 predicts
          ("reach and smell pull in opposite directions"). They pull in opposite
          directions when the fix is a paraphrase. They pull TOGETHER when the fix is a
          change of the objection being made.
    rejected:
      - { path: "/a/myr.html", rank: 6, why: "'Peace of mind in an unstable world' — was RANK 2 for v1 of this question and fell to 6 once the emotional framing came out. Its subject is peace under changing circumstances, not evidence." }
      - { path: "/a/yednannya.html", rank: 7, why: "the world-religions comparison — matched on its 'what can a person get from this religion' framing. Would be credited to a `religions` case if the suite were widened." }
      - { path: "/a/chomu.html", rank: 8, why: "'Why is it so hard to live in this world?' — credited to case 2" }
      - { path: "/a/chudo.html", rank: 9, why: "'Why doesn't God perform some miracle and prove to everyone that he exists?' — CLOSE, and rejected on its text. Its subject is God's reticence (Philip Yancey on why God leaves room for unbelief), not whether there is evidence. Same call the Hungarian suite made on /a/csodat.html." }
      - { path: "/a/pravdyvoho.html", rank: 10, why: "credited to case 3" }
    top_score: 0.696

  # ── 2 ────────────────────────────────────────────────────────────────── skeptic
