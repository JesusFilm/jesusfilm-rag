      - { path: "/a/pravdyvoho.html", en: "🔴 TITLE TRAP. Titled 'In search of the true God', which reads like a conversion or a seeking story. It is not: the body is an ENUMERATED LIST of God's attributes — '#1: A God greater than us', and onward — 13.2k of it, the long-form companion to /a/khto.html. This is the same trap §0.12 lists as systematic ('Why can we rely on the God of the Bible?' → the six-attributes article, seen in bg tr fa pt cs). Fifth-plus source, same trap, localised title.", rank: 1, score: 0.682 }
