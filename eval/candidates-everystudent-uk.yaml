    topic: suffering
    q: "Торік мій друг загинув в аварії. Відтоді мені ніхто так і не пояснив, як це взагалі поєднується з добрим Богом, який нібито все тримає під контролем."
    en: "Last year my friend died in a crash. Since then nobody has actually explained to me how that fits together at all with a good God who supposedly holds everything under control."
