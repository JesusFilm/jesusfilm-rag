      - { path: "/a/lykho.html", en: "'Where is God when disaster comes?' — Marilyn Adamson, 10.7k. 'How far can we rely on God, knowing that he is with us? Is he really the one we can turn to in any situation, in disaster as well as in calm?' The Ukrainian twin of the Russian /a/gdebog.html and the Hungarian /a/faj.html, both credited for this same question shape.", rank: 1, score: 0.741 }
      - { path: "/a/chomu.html", en: "'Why is it so hard to live in this world?' — the theodicy article. Its opening names the rampage of violence, hatred, ISIS atrocities, sexual slavery, murder and poverty, then narrows to the personal: 'Our parents divorce. The girl next door is abducted. A relative is diagnosed with cancer.' Closest of the five to the asker's own situation.", rank: 4, score: 0.68 }
      - { path: "/a/rezhyser.html", en: "'Is God the director of the world?' — the free-will argument, framed as an analogy about film directors: 'people say \"I do not believe in God because there is evil in the world\", but that argument already concedes that a good world is possible.' Answers the 'good God who holds everything under control' half specifically — i.e. the control premise, not the grief.", rank: 7, score: 0.657 }
      - { path: "/a/dali.html", en: "'How do you go on?' — written directly at someone recovering from a disaster or the loss of a friend or relative, 5.2k. It is unusual and worth noting: it opens by REFUSING the why-question — 'Will you find an explanation from God for why this happened? Probably not… \"Why?\" is not the apt question to put to God here' — and answers what God is like instead. The best fit to 'nobody has explained it to me'.", rank: 2, score: 0.733 }
    rejected:
      - { path: "/a/pravdyvoho.html", rank: 3, why: "RANK 3 AND REJECTED — the what-is-God-like article. Its section on God's character does speak to 'is he good', but the document is not about suffering. Credited to case 3." }
      - { path: "/a/nadiyeyu.html", rank: 5, why: "Steve Sawyer's HIV testimony — how he personally kept hope after his diagnosis, not why a good God allows it. Same call as the Russian /a/steysi1.html and the Hungarian /a/sawyer.html." }
      - { path: "/a/poklonyatysya.html", rank: 6, why: "the child-rape article — see the note below; rejected deliberately, not by oversight." }
      - { path: "/a/ateyistka.html", rank: 8, why: "credited to case 1" }
      - { path: "/a/myr.html", rank: 9, why: "peace of mind — a tail-adjacent match" }
      - { path: "/a/isnuye.html", rank: 10, why: "credited to case 1" }
    rejected_note: |
      ⓘ /a/poklonyatysya.html ("How can you worship a God who allows a child to be raped?",
      3.3k) is the source's fifth suffering document and it is a real one — the author's
      own close relative's child was raped, and the answer is the free-will theodicy under
      that weight. It was NOT credited, and the call is deliberate rather than close: its
      subject is deliberate human evil, and the asker's friend died in an ACCIDENT, where
      no human chose anything. Crediting it would measure the engine's ability to conflate
      two different problems of evil. It returns in the top 10 anyway (see the check log)
      and is correctly ranked below all four credits.
    top_score: 0.741

