      - { path: "/a/islam.html", en: "'Jesus and Islam' (21.0k, the LARGEST document in the source) — six questions, and question 1 IS the tahrif question: 'Has the Bible been changed from its original state?' It answers by asking whether God is able to preserve his own word. The estate's Islam-routes-bible-trust pattern (§0.7, `zh` `kk` `th` `bg` `ja`), verified on this source rather than assumed.", rank: 2, score: 0.691 }
    reworded: |
      ⚠️ REWORDED ONCE, and the smell it fixed was 0.001 over the line — which is the
      point worth keeping, because on a source whose floor probe reads 0.546 nobody
      would have predicted a smell here at all.
      v1: "People in my hostel often say the Bible is just a book like any other old
           book, copied by hand for centuries. HOW CAN AN EDUCATED PERSON SATISFY
           HIMSELF ABOUT IT?"
           → **0.751 🔴 SMELL**, credits at ranks 1 and 2. The final clause restates
           /a/bible.html's own opening almost word for word — that article asks "can a
           SENSIBLE PERSON believe the Bible?" in its third sentence.
      v2 (kept): drops the "can a sensible person believe" frame entirely and changes the
           objection to a dismissal to be tested — a teacher's claim that copy-upon-copy
           makes the wording not worth arguing about.
           → **0.751 → 0.741**, both credits still ranks 1 and 2, with a 0.139 gap down
           to rank 3. The best-separated case in the suite.
    note: |
      ⓘ TWO CREDITS IS THE COMPLETE ANSWER, NOT A THIN ONE. Ranks 3–9 are the Jesus-deity
      article, the Josh McDowell testimony, the what-is-God-like article, the world-
      religions page, the God-exists video, the peace article and the trust-Jesus page —
      i.e. nothing else on this source addresses textual transmission. /a/bible.html and
      /a/islam.html are the whole shelf for this topic and both are credited.
    top_score: 0.741

