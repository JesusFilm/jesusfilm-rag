      - { path: "/a/isthere.html", en: "'Does God exist?' (17.3k, Marilyn Adamson) — the source's flagship apologetics article: 'six common-sense reasons to believe God really exists', argued as evidence a reader is invited to weigh rather than accept. Its opening insists the case be treated the way one treats the claim that people walked on the moon — photographs, transcripts, moon rock — i.e. as testable.", rank: 3, score: 0.684 }
      - { path: "/a/existence.html", en: "'The existence of God' (3.6k video script) — the design-versus-chance argument stated concretely: ATP synthase as a proton-driven molecular turbine, the bacterial flagellum, the ribosome, 'from nucleus to nebula you see the marks of design', then directly 'atheistic science claims…'. This is the document that answers the chance half of the question.", rank: 1, score: 0.73 }
      # DROPPED 2026-08-06 by the estate-wide VIDEO-TWIN rule (operator decision).
      # /a/collins.html is the abridged video transcript of an article this same case
      # already credits, so crediting both measured one argument twice. `de` and
      # `ms` rejected their own copies of this Collins clip for exactly this reason.
    boundary_credit: |
      ⚠️ /a/collins.html IS THE ONE CREDIT THE REVIEWER SHOULD LOOK AT.
      At 1,899 chars / 1 chunk it is the smallest document credited anywhere in this
      suite, and it is a VIDEO TRANSCRIPT whose first line is a cross-reference to
      another article ("see the article: Does God exist?"). That is the shape of §0.12's
      failure mode #2 (pure-tail documents). It is NOT one: the openings report flags
      nothing under 1,200 chars on this source, and the body is 1,800 characters of
      actual fine-tuning argument (the gravitational constant, the Big Crunch) with no
      invitation prayer at all. I credited it on the text. It returned at rank 2 (0.704),
      which is the engine agreeing. If the operator would rather this suite credit only
      full articles, dropping it costs one credit and changes nothing else.
    rejected:
      - { path: "/a/coronavirus.html", rank: 4, why: "the anxiety article — credited to case 4. At rank 4 for a design-versus-chance question because its own opening runs through Socrates, Dostoevsky, Nietzsche and Hume before concluding philosophy was not enough. A philosophy passage inside an anxiety article." }
      - { path: "/a/why.html", rank: 5, why: "'Why is life so hard?' — the dropped `suffering` topic's document" }
      - { path: "/a/source.html", rank: 6, why: "Josh McDowell testimony — THE TAIL MAGNET. It was RANK 2 for v1 of this question; changing the objection pushed it to 6. Would be a credit for the dropped `purpose` topic." }
      - { path: "/a/tragedy.html", rank: 7, why: "crisis and free will — the dropped `suffering` topic" }
      - { path: "/a/faith.html", rank: 8, why: "credited in rounds 1–2 and DROPPED at round 3 — see below" }
      - { path: "/a/loving.html", rank: 9, why: "'How can a loving God send people to hell?' — its point (1) does cite Romans 1:19-20, creation as evidence for God, which is why it matches; its subject is hell. Rejected on the text." }
      - { path: "/a/ideal.html", rank: 10, why: "credited to case 3" }
    dropped_after_engine_check:
      - path: "/a/faith.html"
        why: |
          "Beyond blind faith" (20.6k, Paul E. Little) was credited in rounds 1 and 2 and
          is DROPPED at round 3. Its opening does argue that faith is not blind and that
          "man cannot settle God's existence unless God reveals himself, so we look into
          the windows of history for a clue" — which answers the v1 question ("is it just
          wishful thinking?") and is why it returned at rank 10 there. But the SUBJECT of
          the article is whether JESUS is God, argued from his biography and the
          resurrection. It never engages the chance-versus-designer claim the kept
          question actually makes. It sits at rank 8 (0.566) and the engine is right.
          Dropped rather than kept-as-a-miss: a kept miss should record a real retrieval
          gap, and this is not one — it is a document answering a different question.
    top_score: 0.73

  # ── 2 ─────────────────────────── skeptic · the Islam/tahrif routing, verified
