    persona: skeptic
    topic: bible-trust
    q: "میرے ایک استاد نے کہا کہ آج جو بائبل ہمارے پاس ہے وہ نقل در نقل کا نتیجہ ہے، اِس لیے اُس کے الفاظ پر بحث کرنا فضول ہے۔ کیا اِس دعوے کو پرکھنے کا کوئی طریقہ ہے؟"
