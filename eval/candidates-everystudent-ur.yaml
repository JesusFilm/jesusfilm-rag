  # ── 1 ──────────────────────────────────────────────────────────────── skeptic
  - id: "esur-skeptic-ittefaq" # topic: god-exists
    persona: skeptic
    topic: god-exists
    q: "مجھے بتایا جاتا ہے کہ سب کچھ اتفاق سے بنا ہے اور کسی بنانے والے کی ضرورت نہیں۔ کیا اِس کے خلاف کوئی ایسی دلیل ہے جو محض مذہبی دعویٰ نہ ہو بلکہ قابلِ جانچ ہو؟"
