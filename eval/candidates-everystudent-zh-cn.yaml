# Phase 5 Part B — 10 candidate golden cases for `everystudent-zh-cn` (xinshengming.com)
#
# ⚠️ PROPOSAL ONLY — nothing here reaches eval/qa-golden.yaml without an explicit
# operator approval turn (golden Guardrail #4).
#
# Source: 128 documents / 293 chunks, the largest source in the #111 campaign.
# Topics: drawn from the §0.7 canonical menu approved 2026-08-03. All ten apply
# here (128 docs ÷ 8 = 16, capped at 10).
#
# ── How these were built ────────────────────────────────────────────────────
# 1. Discovery: the ten ENGLISH topic questions run zh-scoped at topK 20 →
#    51 distinct candidate documents of 128. (English questions were measured to
#    be a good discovery scaffold but a poor top-1 judge — campaign file §0.6.)
# 2. Each question was then AUTHORED IN CHINESE, not translated from English —
#    real users of xinshengming.com ask in Chinese, and an English-question eval
#    would measure something nobody does.
# 3. Every drafted question was run through the wired Retriever before being
#    finalised (Guardrail #8 #2). ✅ No paraphrase smell: the top score across all
#    ten was 0.689, well under the 0.75 line. No question restates a title.
# 4. Every credited document was judged on its CHUNK TEXT, never its title.
#
# ── 🔴 Why #4 is not boilerplate: two title traps caught in this source ──────
# `/a/yesno.html` carries the SEO title "是否有神的存在 - 相信神真实存在的六个理由"
# ("Is there a God — six reasons to believe God exists"). Its body is about
# FREE WILL AND DECISION-MAKING ("自由意志与做决定的艺术"). It was about to be
# credited for god-exists on the strength of that title. It is not credited.
# Same lesson as the §0.7 `religions` misread. Guardrail #5 is load-bearing here.
#
# ── ⚠️ Two deliberate omissions, both recorded rather than silently applied ──
# A. NO `/john/**` DOCUMENT IS CREDITED. everystudent-zh-cn carries a 37-document
#    Gospel-of-John correspondence course (29% of the source; no other campaign
#    source has one). It is ministry writing, not the raw scripture §12 blocks,
#    but whether it belongs in the corpus is an open operator decision —
#    campaign file §0.8. Notably, ZERO lessons surfaced for any of the ten
#    in-language questions, so excluding them costs this suite nothing.
# B. NO CROSS-SOURCE CREDITS YET. The `zh` bucket also holds `thelife-zh` and
#    `everystudent-zh-tw`, and their documents genuinely outrank zh-cn on several
#    of these questions (see the RETRIEVED blocks). Under the living-relevant-set
#    model they should be credited — but crediting a document nobody has READ
#    would violate Guardrail #5. **Deferred to Part A**, where those documents are
#    read. Expect per-source coverage here to read LOW until that happens; that is
#    the honest number, not a defect.
#
# evidence_tier: `llm-translated` on all ten — the operator does not read Chinese
# and cannot verify these translations. Flip to `human-verified` if that is wrong,
# or if a Cru Chinese speaker reviews the suite later (campaign file §7).

part_b_cases:

  # ── 1 ── god-exists / skeptic ────────────────────────────────────────────────
  - id: "zhcn-skeptic-shenzai"
    language: "zh"
    evidence_tier: "llm-translated"
    # EN: "My friends all say believing in God is just self-comfort with no basis at all. Is there really any reason that holds up?"
    question: "我朋友都说信神只是自我安慰，根本没有依据。真的有什么站得住脚的理由吗？"
    relevant:
      everystudent-zh-cn:
        - "/a/pack1.html"       # "how could a rational person come to believe in God? I found answers that convinced me"
        - "/a/pack2.html"       # "you can never be 100% certain, but you can decide on factual evidence"
        - "/a/atheist.html"     # first-person account of an atheist reasoning her way to belief
        - "/a/miracle2.html"    # "why doesn't God perform visible miracles to prove he exists?"
        - "/a/fanxuede5.html"   # ch.5 "The struggle of reason" — an intellectual's account
        - "/a/who2.html"        # cosmological argument: nothing never existed, so something always has
    # RETRIEVED (qwen, zh-scoped, 2026-08-03) — EN translations for verification:
    #   1. 0.670 zhcn /a/pack1.html      — EN: "Spiritual Adventure Pack, message #1"
    #   2. 0.666 zhcn /a/fanxuede5.html  — EN: "Chapter 5: The struggle of reason"
    #   3. 0.663 zhcn /a/atheist.html    — EN: "How an atheist found God"
    #   4. 0.650 zhcn /a/pack2.html      — EN: "Spiritual Adventure Pack, message #2"
    #   5. 0.625 zhcn /a/miracle2.html   — EN: "Why doesn't God prove himself by performing miracles?"
    #   6. 0.592 zh-tw /content/WhoIsHe/prove  (cross-source, not credited — see note B)
    #   7. 0.586 zh-tw /content/WhoIsHe/exist207  (cross-source)
    #   8. 0.585 zhcn /a/peace.html      — EN: "Finding inner peace in an unpredictable, unstable world"

