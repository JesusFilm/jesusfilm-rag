#   `everystudent-zh-tw` (46 docs, this file), `everystudent-zh-cn` (128 docs, already
#   has a 10-case suite) and `thelife-zh`. Every retrieval below is language-scoped to
#   `zh`, so 3–7 of each top 10 belong to the other two sources. Ranks here are NOT
#   comparable to a single-source language such as `hu` or `cs`. Measured slot share,
#   round 2, own-source documents in the top 10:
#     religions 7/10 · know-god 7/10 · suffering 6/10 · god-exists 5/10 ·
#     bible-trust 5/10 · anxiety 3/10 · prayer 3/10
#   The two thinnest — anxiety and prayer — still hold rank 1, so the competition costs
#   depth, not the top slot.
#
# CORPUS SHAPE — read this before judging any hit
#   46 documents in four namespaces: /content/WhoIsHe (17), /content/LifeIssues (12),
#   /content/TheExperience (9), /content/Enigmas (8). There is NO `/a/` namespace and
#   NO `/story/` namespace — the path shape of this source is unlike every batch-1
#   sibling, so path-pattern heuristics written for `/a/*.html` do not transfer.
#   Testimony share by PATH is 0%; by CONTENT about 9 of 46 (20%) are first-person
#   accounts filed under LifeIssues / TheExperience / Enigmas
#   (TrueLove512, Pornography301, Journey208, HopeInLife607, FaceDeath611,
#   Ashamed533, Beauty504, Lifesource302, RealLife303).
#   Null-language documents: 0 of 46. Duplicate paths: 0. Duplicate titles: 0.
#
#   ⚠️ CASE-VARIANT PATH PREFIXES — a real transcription hazard. Four documents use a
#   LOWERCASE namespace while the other 42 use CamelCase:
#     /content/whoishe/bible220            (not WhoIsHe)
#     /content/whoishe/isgodelephant       (not WhoIsHe)
#     /content/whoishe/when2dmanmeet3dgod  (not WhoIsHe)
#     /content/lifeissues/facing-anxiety   (not LifeIssues)
#   All four are the source's REWRITTEN articles (modern SEO subheadings, newest prose).
