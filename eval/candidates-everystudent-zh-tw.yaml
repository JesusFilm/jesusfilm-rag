cases:

  # ── 1 ────────────────────────────── skeptic · god-exists  ⚠ REWORDED, SEE BELOW
  - id: "eszhtw-skeptic-jituo"
    persona: skeptic
    topic: god-exists
    q: "我朋友都說信神只是一種寄託，說到底沒有半點根據。撇開個人感受不談，這件事有沒有可以攤開來檢驗的事實？"
    en: "My friends all say believing in God is just something to lean on, with no basis whatsoever. Setting personal feelings aside, are there any facts on this that can be laid out and examined?"
    credits:
      - { path: "/content/WhoIsHe/exist207", en: "Does God really exist? — Marilyn Adamson's nine reasons. 6,735 chars / 11 chunks, the largest and most-chunked document in the source and its flagship apologetics article. Cosmic fine-tuning (earth's size, distance from the sun, the moon's pull), DNA as encoded information, and the anthropological universality of belief. Opens by separating evidence from 'just believe'.", rank: 2, score: 0.653 }
      - { path: "/content/WhoIsHe/prove", en: "Why does God not prove his own existence? — 942 chars. NOT a pure tail: it is a Q&A that states plainly that strong factual and philosophical arguments for God DO exist (and cross-references the article above), then answers the second half of the question — why God will not compel belief, quoting Philip Yancey on 'the miracle of restraint'. It answers the asker's implied 'if it were real it would be obvious'.", rank: 6, score: 0.606 }
    reworded: |
      ⚠️ REWORDED ONCE, and it is FAILURE MODE #5 reproduced exactly (§0.12).
      v1: "我身邊的朋友都覺得信神只是一種自我安慰，是人想像出來讓自己好過一點的東西……
           還是純粹只是心理作用？"
          ("…just a form of SELF-COMFORT, something people imagine to make themselves
           feel better… or is it purely PSYCHOLOGICAL?")
          → top 0.690, no smell, but only 1 of 4 credits returned and the flagship
          article sat at rank 6. The emotional framing pulled emotional documents:
          rank 2 was /content/WhoIsHe/praydifference (praying to a cactus gives
          "temporary peace, encouragement and hope — but false") and rank 4 was
          /content/Enigmas/Tragic601 (God as a refuge in disaster). The two documents
          that actually argue the case fell out.
      v2 (kept): keeps the "just something to lean on" premise but asks for FACTS THAT
          CAN BE LAID OUT AND EXAMINED instead of asking whether it is psychological.
          → **exist207 rank 6 → rank 2 (0.654); /WhoIsHe/prove entered at rank 6.**
          Same direction and roughly the same size as the Turkish 0.583 → 0.704 result.
    the_finding: |
      🔴 THIS IS ONE OF THE TWO CASES WHERE A NON-TRADITIONAL-CHINESE DOCUMENT
      LEGITIMATELY TAKES RANK 1 — and the margin is 0.001.
      Top score 0.655 belongs to a document from `everystudent-zh-cn` or `thelife-zh`;
      `/content/WhoIsHe/exist207` is rank 2 at 0.654. Only 5 of the 10 slots are
      Traditional Chinese. This is not a question defect and not a retrieval defect: two
      sibling sites publish the same Marilyn Adamson article in two scripts and the
      Simplified one wins by a rounding error. Record it; do not try to reword past it.
    dropped_after_engine_check:
      - path: "/content/WhoIsHe/faith201"
        why: >-
          "Definitely not blind faith" (5,440 chars / 3 chunks). Its TITLE denies the wishful-thinking charge, which is why it was drafted in, but its BODY is the case for JESUS' identity — the manger, the "who do you say I am", the blasphemy charge, the claim to forgive sins. That is a different question from whether God exists, and it missed the top 10 in both rounds. The engine is right. Dropped rather than kept as a miss.
      - path: "/content/WhoIsHe/nothing102"
        why: >-
          "Was there ever nothing?" — part 1 of the four-part cosmological series. Its subject is the origin of matter, and the series' actual conclusion (that the Self-Existent One is personal) lives in `/content/WhoIsHe/whoii`, which case 3 credits. Crediting both ends of the same argument measures it twice.
    rejected:
      - { path: "/content/WhoIsHe/twokinds217", rank: 4, why: "'Two kinds of truth' (1,329 ch) — whether Christianity can be true for you and not for me. It matches the 'setting feelings aside' framing, but its subject is relativism, which belongs to the religions topic (it was rank 2 there). Rejected on the text." }
      - { path: "/content/Enigmas/Tragic601", rank: 7, why: "'When disaster strikes, does believing in God make a difference?' (899 ch) — a general God-as-refuge page. ⚠ THIS IS THIS SOURCE'S GENERAL ATTRACTOR: it appeared in the top 10 of FOUR of the seven drafted questions (god-exists, suffering, know-god, and god-exists v1 at rank 4). It is credited nowhere. On a source with almost no separable gospel tail, this page plays the role the tail plays elsewhere." }
      - { path: "/content/WhoIsHe/praydifference", rank: 10, why: "'Does it matter which god you pray to?' — its subject is the identity of the God addressed, not evidence. Was rank 2 for v1 of this question; the reword pushed it to 10." }
    top_score: 0.655

  # ── 2 ──────────────────────── skeptic · suffering  🟢 THE STRONGEST CASE HERE
  - id: "eszhtw-skeptic-chehuo"
    persona: skeptic
    topic: suffering
    q: "去年我一個很要好的朋友出車禍走了，走得毫無道理。如果真的有一位良善的神，祂當時在哪裡？為什麼祂不出手？"
    en: "Last year a close friend of mine was killed in a car accident, for no reason at all. If there really is a good God, where was he at the time? Why did he not step in?"
    credits:
      - { path: "/content/Enigmas/BadThings605", en: "Why do bad things happen? — Stacy James, paralysed by a diving accident as a student, writing in the first person: 'God did not push me into the water.' Free will, consequence, and C.S. Lewis on the 80% of suffering caused by human wrongdoing. 1,171 chars — short, but a complete argument, not a tail.", rank: 1, score: 0.744 }
      - { path: "/content/Enigmas/Suffering631", en: "Life, why so much suffering! — the source's dedicated theodicy article (2,301 chars / 2 chunks). Splits the question in two ('why does God allow it at all' vs the personal experience of it) and answers the first at length: God did not create evil, free will is the price of not being a robot, suffering is temporary for those who return to him.", rank: 2, score: 0.676 }
      - { path: "/content/Enigmas/Lost612", en: "A lost world — how could a suffering world be made by a loving God? Attenborough's eye-worm, then Darwin's daughter Annie, whose death (not his biology) is what actually cost Darwin his faith. Written by a Taiwanese author, 林韡承 — original Traditional-Chinese content, not a translation of an English parent article.", rank: 8, score: 0.603 }
    the_finding: |
      🟢 THE BEST-PLACED CASE IN THE SUITE, AND THE ONLY ONE WHERE THIS SOURCE OWNS THE
      TOP OF A CONTESTED BUCKET. Top score 0.744 IS the rank-1 credit, with the second
      credit at rank 2 and 6 of the 10 slots Traditional Chinese — against 128
      Simplified-Chinese documents and `thelife-zh`. If the operator wants one case from
      this suite to watch as a regression canary, this is it.
    rejected:
      - { path: "/content/Enigmas/Tragic601", rank: 3, why: "RANK 3 AND REJECTED — 'When disaster strikes, does believing in God make a difference?' Its opening does ask '災難、天災或悲傷來襲時：神在那裡？', which looks like a direct answer to the question's 'where was he'. But the body is about how far God can be relied on for strength and refuge, not about why he allows it. Same call the `hu` suite made on /a/isten-segitsege.html, and this page is a general attractor across four of the seven questions." }
      - { path: "/content/WhoIsHe/exist207", rank: 4, why: "credited to case 1 — matched here on its problem-of-evil passage" }
      - { path: "/content/WhoIsHe/prove", rank: 5, why: "credited to case 1" }
    top_score: 0.744

