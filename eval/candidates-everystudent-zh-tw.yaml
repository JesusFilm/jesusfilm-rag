# 🔴 LANGUAGE FILTER IS `zh`, NOT `zh-tw`. Every document in this source is labelled
#   with the base ISO 639-1 code. `phase5-check.ts zh-tw zh` — passing `zh-tw` as the
#   language returns nothing.
#
