# ─────────────────────────────────────────────────────────────────────────────
# THE ONE SYSTEMATIC FINDING — the boilerplate-tail false positive
# ─────────────────────────────────────────────────────────────────────────────
# 38 of the 75 candidates were rejected, and MOST of them failed the same way.
#
# Almost every everystudent article ends with the same closing move: a short
# gospel summary and an invitation prayer ("Jesus, I believe in you, thank you
# for dying for me, come into my life…"). That tail is its own chunk. So a
# question about *how to begin believing* matches the TAIL of articles about
# homosexuality, pornography, dating, world religions and stress — while the one
# article that is actually about beginning (/a/personally.html, the Four
# Spiritual Laws) ranks LAST.
#
# tlzh-newcomer-xinzhu is the clean specimen. Nine campaign hits; ranks 1–14 are
# all boilerplate tails; the correct answer is rank 15:
#   rank  1  0.660  /a/gaylesbian.html   EN: "Homosexuals — does God love you?"
#   rank  4  0.625  /a/religion.html     EN: "Are all religions the same?"
#   rank  5  0.620  /a/toxicnew.html     EN: "Breaking free from pornography"
#   rank 12  0.552  /a/wolves.html       EN: "Dances with wolves" (sex and dating)
#   rank 15  0.543  /a/personally.html   EN: "Knowing God personally"  ← THE ANSWER
#
# This is a THIRD trap of the same family as the two title traps already on
# record (§0.7 /a/hochsten.html, §0.8 /a/yesno.html). §0.9 said "a third trap
# should be assumed to exist" — this is it, and it is worse than the other two
# because it is not one document, it is a template across the whole estate.
#
# Rule for the remaining 44 Part B suites: a hit whose matched chunk is the
# closing invitation prayer is evidence about the TEMPLATE, not about the
# document. Read the opening of the document before crediting it.

